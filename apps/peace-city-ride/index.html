    drawBg(ctx, g, V) {

      ctx.fillStyle = 'rgba(255,240,220,.7)';
      strip(g.bg * .01, 90, W, (x, i) => { const y = 8 + hash(i) * hz * .3; ctx.globalAlpha = .3 + hash(i + 2) * .5; ctx.fillRect(x + hash(i + 1) * 80, y, 1.6, 1.6); });
      ctx.globalAlpha = 1;
      // low sun that sinks slowly during a run

      strip(g.bg * .03, 520, W, (x, i) => cloud(ctx, x + hash(i + 5) * 220, 40 + hash(i) * hz * .35, 50 + hash(i + 9) * 60));
      // a few birds gliding home, flapping out of step
      ctx.strokeStyle = 'rgba(50,25,60,.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      strip(g.bg * .09 + g.t * 14, 300, W, (x, i) => {

      ctx.fillStyle = '#5E2C4C';
      strip(ho, 120, W, (x, i) => { if (hash(i) < .45) return; const cx = x + hash(i + 3) * 90; cypress(ctx, cx, hill(cx + ho) + 4, 7, 26 + hash(i + 7) * 18); });
      strip(g.bg * .3, 860, W, x => aqueduct(ctx, x + 40, gr - 4));
      // roadside: umbrella pines, tombs and bushes in silhouette
      ctx.fillStyle = '#3A2440';
      strip(g.bg * .62, 360, W, (x, i) => {
        if (hash(i) > .3) umbrellaPine(ctx, x + hash(i + 4) * 120, gr, .9 + hash(i + 6) * .35);
        if (hash(i + 8) > .72) tomb(ctx, x + 200, gr);
        bush(ctx, x + 300 * hash(i + 11), gr, 26 + hash(i + 12) * 20);
      });
      // Via Appia: curb stones and polygonal paving, lower rows scroll faster for depth
      ctx.fillStyle = '#3E2A30'; ctx.fillRect(0, gr, W, H - gr);
      const stones = ['#7A5A50', '#6C4E48', '#86645A', '#735349', '#5F4442'];
      let y = gr + 4, row = 0;
      while (y < H) {

      ctx.fillStyle = '#D9A273'; ctx.fillRect(0, gr, W, 3);

    drawObstacle(ctx, g, o) {

        ctx.strokeStyle = 'rgba(90,70,50,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 19, y + 40); ctx.lineTo(x + 16, y + 46); ctx.lineTo(x + 18, y + 50); ctx.stroke();

        ctx.fillStyle = linGrad(ctx, 0, gr - 19, 0, gr - 12, ['#9A6A3E', '#6B4426']); ctx.fillRect(x - 2, gr - 19, o.w + 4, 7);

        ctx.fillStyle = '#C9BCA4'; ctx.fillRect(x, gr - 10, 36, 10);
        ctx.fillStyle = '#DCD0B9'; rrect(ctx, x + 3, gr - 16, 30, 7, 3); ctx.fill();
        ctx.fillStyle = linGrad(ctx, x + 5, 0, x + 31, 0, ['#ADA088', '#F3EBDA', '#C2B59C']);
        ctx.beginPath(); ctx.moveTo(x + 5, gr - 15); ctx.lineTo(x + 5, y + 12); ctx.lineTo(x + 11, y + 4); ctx.lineTo(x + 16, y + 10);
        ctx.lineTo(x + 22, y); ctx.lineTo(x + 27, y + 8); ctx.lineTo(x + 31, y + 5); ctx.lineTo(x + 31, gr - 15); ctx.fill();
        ctx.strokeStyle = 'rgba(120,100,80,.35)'; ctx.lineWidth = 1.2; ctx.beginPath();
        for (let fx = x + 9; fx < x + 30; fx += 4.4) { ctx.moveTo(fx, y + 14); ctx.lineTo(fx, gr - 17); }
        ctx.stroke();
        ctx.strokeStyle = 'rgba(80,60,40,.6)'; ctx.beginPath(); ctx.moveTo(x + 22, y + 2); ctx.lineTo(x + 20, y + 22); ctx.lineTo(x + 24, y + 34); ctx.stroke();
        laurelLeaves(ctx, x + 18, y + 64, 15, PI * .6, PI * 1.4, 6, 3.2);
        ctx.fillStyle = '#CFC3AC'; ctx.save(); ctx.translate(x + 44, gr - 4); ctx.rotate(.4); ctx.fillRect(-6, -4, 12, 8); ctx.restore();
      } else if (o.k === 'chariot') {
        chariot(ctx, g, o, gr);
      }
    },
    drawItem(ctx, g, it) {
      ctx.save(); ctx.translate(it.x, it.y + Math.sin(g.t * 4 + it.x * .01) * 5);
      if (it.k === 'coin') {
        glow(ctx, 0, 0, 24, 'rgba(255,214,90,.45)', 'rgba(255,214,90,0)');
        ctx.scale(Math.max(.2, Math.abs(Math.cos(g.t * 4 + it.x * .02))), 1);
        ctx.fillStyle = linGrad(ctx, -10, -10, 10, 10, ['#FFF0A0', '#F2B92E', '#C98A12']); ctx.beginPath(); ctx.arc(0, 0, 11, 0, PI * 2); ctx.fill();
        ctx.strokeStyle = '#A8700E'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = 'rgba(150,95,10,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 8, 0, PI * 2); ctx.stroke();
        // emperor's profile with a laurel
        ctx.fillStyle = '#B07A14'; ctx.beginPath(); ctx.arc(.4, -.8, 3.6, 0, PI * 2); ctx.fill(); ctx.fillRect(-1.6, 1.5, 3.6, 3.4);

        ctx.fillStyle = '#D9342A'; ctx.beginPath(); ctx.moveTo(0, 11); ctx.lineTo(-4, 17); ctx.lineTo(-1, 16); ctx.lineTo(0, 12); ctx.lineTo(1, 16); ctx.lineTo(4, 17); ctx.fill();

// ---------------------------------------------------------------------------
// Penalty quiz: answer a hard football question, then shoot.
// ---------------------------------------------------------------------------
function penaltyGame(area, hud) {
  const { ctx, size, dispose } = setupCanvas(area);
  const qs = triviaQuestions(5);
  let round = 0, goals = 0, results = [], phase = 'intro', raf = 0, unbind = null;
  const shot = { t: 0, from: null, to: null, dur: .6, result: '', target: null };
  const keeper = { x: 0, tx: 0, y: 0, ty: 0, dive: 0 };
  const geo = () => {
    const { W, H } = size, gw = Math.min(W * .78, 560), gh = gw * .33, gx = (W - gw) / 2, gy = H * .22;
    return { W, H, gw, gh, gx, gy, spotX: W / 2, spotY: H * .86 };
  };
  const resetKeeper = () => { const G = geo(); keeper.x = keeper.tx = G.W / 2; keeper.y = keeper.ty = G.gy + G.gh; keeper.dive = 0; };
  resetKeeper();

  const draw = () => {
    const G = geo(); const { W, H } = G;
    const grass = ctx.createLinearGradient(0, 0, 0, H); grass.addColorStop(0, '#0B4D2C'); grass.addColorStop(1, '#13804A');
    ctx.fillStyle = grass; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? 'rgba(255,255,255,.03)' : 'rgba(0,0,0,.04)'; ctx.fillRect(0, H * .3 + i * H * .09, W, H * .09); }
    // crowd
    ctx.fillStyle = '#0A1A2E'; ctx.fillRect(0, 0, W, G.gy - 20);
    for (let i = 0; i < 160; i++) { const x = (i * 53) % W, y = 10 + ((i * 29) % Math.max(10, G.gy - 40)); ctx.fillStyle = ['#2257E6', '#FFC21A', '#D7263D', '#fff'][i % 4]; ctx.globalAlpha = .5; ctx.beginPath(); ctx.arc(x, y + Math.sin(Date.now() / 300 + i) * 1.5, 3, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    // box lines
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3;
    ctx.strokeRect(G.gx - G.gw * .25, G.gy + G.gh, G.gw * 1.5, G.spotY - G.gy - G.gh + H * .08);
    ctx.beginPath(); ctx.arc(G.spotX, G.spotY, 4, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
    // net
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
    for (let x = G.gx; x <= G.gx + G.gw; x += 14) { ctx.beginPath(); ctx.moveTo(x, G.gy); ctx.lineTo(x, G.gy + G.gh); ctx.stroke(); }
    for (let y = G.gy; y <= G.gy + G.gh; y += 14) { ctx.beginPath(); ctx.moveTo(G.gx, y); ctx.lineTo(G.gx + G.gw, y); ctx.stroke(); }
    // posts
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(G.gx, G.gy + G.gh); ctx.lineTo(G.gx, G.gy); ctx.lineTo(G.gx + G.gw, G.gy); ctx.lineTo(G.gx + G.gw, G.gy + G.gh); ctx.stroke();
    // aim hint
    if (phase === 'aim') {
      ctx.fillStyle = 'rgba(255,194,26,.12)'; ctx.fillRect(G.gx, G.gy, G.gw, G.gh);
      ctx.fillStyle = '#FFC21A'; ctx.font = '700 18px "Atkinson Hyperlegible", sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Tippe ins Tor, wohin du schießen willst!', W / 2, G.gy - 12);
    }
    // keeper
    keeper.x += (keeper.tx - keeper.x) * .18; keeper.y += (keeper.ty - keeper.y) * .18;
    ctx.save(); ctx.translate(keeper.x, keeper.y); ctx.rotate(keeper.dive);
    const s = G.gh / 110;
    ctx.fillStyle = '#FFC21A'; rrect(ctx, -14 * s, -62 * s, 28 * s, 40 * s, 8 * s); ctx.fill();
    ctx.strokeStyle = '#FFC21A'; ctx.lineWidth = 9 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-12 * s, -56 * s); ctx.lineTo(-34 * s, -78 * s); ctx.moveTo(12 * s, -56 * s); ctx.lineTo(34 * s, -78 * s); ctx.stroke();
    ctx.strokeStyle = '#111'; ctx.beginPath(); ctx.moveTo(-7 * s, -22 * s); ctx.lineTo(-10 * s, 0); ctx.moveTo(7 * s, -22 * s); ctx.lineTo(10 * s, 0); ctx.stroke();
    ctx.fillStyle = '#FFD6B0'; ctx.beginPath(); ctx.arc(0, -72 * s, 10 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-36 * s, -80 * s, 6 * s, 0, 7); ctx.arc(36 * s, -80 * s, 6 * s, 0, 7); ctx.fill();
    ctx.restore();
    // ball
    let bx = G.spotX, by = G.spotY - 14, br = 16;
    if (phase === 'shot' || phase === 'after') {
      const p = clamp(shot.t / shot.dur, 0, 1), e = 1 - Math.pow(1 - p, 2);
      bx = shot.from.x + (shot.to.x - shot.from.x) * e;
      by = shot.from.y + (shot.to.y - shot.from.y) * e - Math.sin(p * Math.PI) * 40;
      br = 16 - 8 * e;
    }
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(bx, by + br, br, br * .35, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(bx, by, br * .35, 0, 7); ctx.fill();
    // scoreboard dots
    ctx.textAlign = 'left';
    for (let i = 0; i < 5; i++) {
      const x = 22 + i * 26, y = H - 24;
      ctx.beginPath(); ctx.arc(x, y, 9, 0, 7);
      ctx.fillStyle = results[i] === undefined ? 'rgba(255,255,255,.2)' : results[i] ? '#34D08C' : '#FF5D70'; ctx.fill();
    }
    if (phase === 'after' && shot.result) {
      ctx.fillStyle = shot.result === 'TOR!' ? '#FFC21A' : '#fff'; ctx.font = `700 ${Math.round(W * .09)}px "Dela Gothic One", sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(shot.result, W / 2, H * .62);
    }
  };

  const loop = now => {
    if (phase === 'shot') { shot.t += 1 / 60; if (shot.t >= shot.dur) { phase = 'after'; afterShot(); } }
    draw(); hud(`${goals} Tore`);
    raf = requestAnimationFrame(loop);
  };

  const ask = () => {
    if (round >= 5) return finishGame();
    resetKeeper(); phase = 'question';
    const box = questionBox(qs[round], round, 5, ok => {
      const nx = $('#fqNext', area);
      nx.innerHTML = `<button class="btn ${ok ? 'go' : ''}" id="fqGo">${ok ? 'Zum Elfmeter!' : 'Schuss geht daneben …'}</button>`;
      $('#fqGo').onclick = () => { hideOverlay(area); ok ? (phase = 'aim') : autoMiss(); };
    });
    overlay(area, box.html);
    unbind = box.bind(area);
  };
  const shoot = (tx, ty, forceMiss) => {
    const G = geo();
    shot.from = { x: G.spotX, y: G.spotY - 14 }; shot.to = { x: tx, y: ty }; shot.t = 0; shot.dur = .55;
    const third = x => x < G.gx + G.gw / 3 ? 0 : x > G.gx + G.gw * 2 / 3 ? 2 : 1;
    const kd = Math.floor(Math.random() * 3);
    const kx = [G.gx + G.gw * .2, G.W / 2, G.gx + G.gw * .8][kd];
    keeper.tx = kx; keeper.ty = kd === 1 ? G.gy + G.gh * .82 : G.gy + G.gh * .9; keeper.dive = kd === 0 ? -1.1 : kd === 2 ? 1.1 : 0;
    const corner = (tx - G.gx < G.gw * .12 || G.gx + G.gw - tx < G.gw * .12) && ty - G.gy < G.gh * .3;
    if (forceMiss) shot.result = pick(['Pfosten!', 'Drüber!', 'Vorbei!']);
    else if (third(tx) === kd && !(corner && Math.random() < .6)) shot.result = 'Gehalten!';
    else shot.result = 'TOR!';
    phase = 'shot'; Sound.kick();
  };
  const autoMiss = () => {
    const G = geo(); const side = Math.random() < .5;
    shoot(side ? G.gx - 30 : G.gx + G.gw + 30, G.gy + G.gh * .2, true);
  };
  const afterShot = () => {
    const ok = shot.result === 'TOR!';
    results[round] = ok; if (ok) { goals++; Sound.fanfare(); Confetti.burst(60, .5, .3); } else Sound.tone(200, .3, 'triangle', .08);
    round++;
    setTimeout(ask, 1300);
  };
  const finishGame = () => {
    phase = 'end';
    const isNew = recordGame('penalty', goals);
    if (goals === 5) award('penalty5');
    overlay(area, `<p class="hand" style="color:#FFC21A">${goals >= 4 ? 'Weltklasse!' : goals >= 2 ? 'Ordentlich!' : 'Nächstes Mal!'}</p><h2>${goals} von 5 Elfmetern</h2><p>${isNew ? 'Neuer Rekord!' : `Rekord: ${state.games.penalty}/5`}</p><button class="btn" id="pBack" style="margin-top:12px">Zurück zur Arcade</button>`);
    if (goals >= 4) Confetti.burst(160);
    $('#pBack').onclick = () => { closeGame(); tab = 'arcade'; render(); };
  };
  const aim = e => {
    if (phase !== 'aim' || e.target.closest('.overlay')) return;
    const r = area.getBoundingClientRect(), G = geo();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < G.gx - 20 || x > G.gx + G.gw + 20 || y < G.gy - 30 || y > G.gy + G.gh + 10) return;
    const outside = x < G.gx + 4 || x > G.gx + G.gw - 4 || y < G.gy + 4;
    shoot(x, y, outside);
  };
  area.addEventListener('pointerdown', aim);
  overlay(area, `<h2>Elfmeter-Quiz</h2><p>5 Elfmeter. Vor jedem Schuss kommt eine schwere Fußballfrage. Nur wer richtig antwortet, darf schießen. Dann tippst du ins Tor, wohin der Ball soll. Ecken sind schwerer zu halten, aber zu nah am Pfosten geht er vorbei!</p><button class="btn go" id="pGo" style="margin-top:12px">Anpfiff</button>`);
  $('#pGo').onclick = () => { Sound.whistle(); ask(); };
  raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); if (unbind) unbind(); area.removeEventListener('pointerdown', aim); dispose(); };
}


// ---------------------------------------------------------------------------
// Keepy-uppy: tap the ball to keep it in the air. One ticket = 3 tries.
// ---------------------------------------------------------------------------
function kickupsGame(area, hud) {
  const { ctx, size, dispose } = setupCanvas(area);
  let tries = 3, raf = 0, last = 0, b = null, alive = false, count = 0, popups = [];
  const reset = () => { b = { x: size.W / 2, y: size.H * .4, vx: 0, vy: 0, r: Math.min(42, size.W * .09), rot: 0, vr: 0 }; count = 0; popups = []; };
  const start = () => { hideOverlay(area); reset(); alive = true; last = performance.now(); b.vy = -700; };
  const end = () => {
    alive = false; tries--;
    const isNew = recordGame('kickups', count);
    if (count >= 30) award('kick30');
    Sound.tone(160, .3, 'sine', .15, 0, 60);
    overlay(area, `<p class="hand" style="color:#FFC21A">${isNew ? 'Neuer Rekord!' : 'Runtergefallen!'}</p><h2>${count} Kontakte</h2><p>Rekord: ${state.games.kickups}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">${tries > 0 ? `<button class="btn go" id="kAgain">Nochmal (${tries} übrig)</button>` : ''}<button class="btn" id="kBack">Zurück</button></div>`);
    if (isNew && count > 5) Confetti.burst(100);
    const a = $('#kAgain'); if (a) a.onclick = start;
    $('#kBack').onclick = () => { closeGame(); tab = 'arcade'; render(); };
  };
  const tap = e => {
    if (!alive || e.target.closest('.overlay')) return;
    const r = area.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    const d = Math.hypot(x - b.x, y - b.y);
    if (d < b.r * 1.6 && y > b.y - b.r * 1.6) {
      const off = (b.x - x) / b.r;
      b.vy = -(620 + Math.min(count, 40) * 4); b.vx = off * 260 + (Math.random() - .5) * 60; b.vr = off * 8;
      count++; Sound.kick();
      popups.push({ x: b.x, y: b.y - b.r, t: 0, txt: count % 10 === 0 ? `${count}!` : '+1' });
      if (count % 10 === 0) { Sound.coin(); Confetti.burst(40, x / innerWidth, y / innerHeight); }
    }
  };
  const loop = now => {
    const dt = Math.min(.033, (now - last) / 1000 || 0); last = now;
    const { W, H } = size;
    const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#0E2A52'); sky.addColorStop(1, '#1C4F8A');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // floodlights
    ctx.fillStyle = 'rgba(255,255,220,.08)'; ctx.beginPath(); ctx.moveTo(W * .1, 0); ctx.lineTo(W * .45, H); ctx.lineTo(W * .05, H); ctx.fill();
    ctx.beginPath(); ctx.moveTo(W * .9, 0); ctx.lineTo(W * .95, H); ctx.lineTo(W * .55, H); ctx.fill();
    ctx.fillStyle = '#13804A'; ctx.fillRect(0, H * .9, W, H * .1);
    ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = `700 ${Math.round(Math.min(W, H) * .22)}px "Dela Gothic One", sans-serif`; ctx.textAlign = 'center';
    ctx.globalAlpha = .18; ctx.fillText(count, W / 2, H * .55); ctx.globalAlpha = 1;
    if (b) {
      if (alive) {
        b.vy += (1300 + Math.min(count, 50) * 8) * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * .8; } if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * .8; }
        if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * .5; }
        if (b.y > H * .9 - b.r) { b.y = H * .9 - b.r; end(); }
      }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#111';
      const pent = (cx, cy, r) => { ctx.beginPath(); for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } ctx.fill(); };
      pent(0, 0, b.r * .32);
      for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 5; pent(Math.cos(a) * b.r * .78, Math.sin(a) * b.r * .78, b.r * .2); }
      ctx.restore();
    }
    for (const p of popups) { p.t += dt; ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.fillStyle = '#FFC21A'; ctx.font = '700 22px "Dela Gothic One", sans-serif'; ctx.fillText(p.txt, p.x, p.y - p.t * 60); }
    ctx.globalAlpha = 1; popups = popups.filter(p => p.t < 1);
    hud(`Rekord ${state.games.kickups}`);
    raf = requestAnimationFrame(loop);
  };
  reset();
  overlay(area, `<h2>Keepy-Uppy</h2><p>Tippe oder klicke auf den Ball, bevor er den Rasen berührt. Triffst du ihn links, fliegt er nach rechts, und umgekehrt. Es wird immer schneller!</p><button class="btn go" id="kGo" style="margin-top:12px">Start (3 Versuche)</button>`);
  $('#kGo').onclick = start;
  area.addEventListener('pointerdown', tap);
  raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); area.removeEventListener('pointerdown', tap); dispose(); };
}


// ---------------------------------------------------------------------------
// Football expert quiz: 10 hard questions with a 15 s timer.
// ---------------------------------------------------------------------------
function proQuizGame(area, hud) {
  area.style.background = 'radial-gradient(ellipse at top, #2A1B55, #0B1020 70%)';
  const qs = triviaQuestions(10);
  let i = 0, right = 0, points = 0, streak = 0, unbind = null;
  const ask = () => {
    if (i >= qs.length) return done();
    hud(`${points} Punkte`);
    const box = questionBox(qs[i], i, qs.length, (ok, secs) => {
      if (ok) { right++; streak++; const p = 100 + Math.max(0, Math.round((15 - secs) * 10)) + (streak >= 3 ? 50 : 0); points += p; $('#fqFact', area).insertAdjacentHTML('afterbegin', `<b style="color:#FFC21A">+${p} Punkte${streak >= 3 ? ` · Serie x${streak}` : ''}</b><br>`); }
      else streak = 0;
      hud(`${points} Punkte`);
      $('#fqNext', area).innerHTML = `<button class="btn go" id="fqGo">${i + 1 < qs.length ? 'Nächste Frage' : 'Ergebnis'}</button>`;
      $('#fqGo').onclick = () => { i++; ask(); };
      $('#fqGo').focus();
    }, 15);
    overlay(area, box.html);
    unbind = box.bind(area);
  };
  const done = () => {
    const isNew = recordGame('proquiz', right);
    if (right >= 8) award('expert8');
    const verdict = right >= 9 ? 'Fußball-Professor!' : right >= 7 ? 'Echter Experte!' : right >= 5 ? 'Starke Leistung!' : 'Die Fragen waren aber auch fies!';
    overlay(area, `<p class="hand" style="color:#FFC21A">${verdict}</p><h2>${right} von 10 richtig</h2><p>${points} Punkte · ${isNew ? 'Neuer Rekord!' : `Rekord: ${state.games.proquiz}/10`}</p><button class="btn" id="qBack" style="margin-top:12px">Zurück zur Arcade</button>`);
    if (right >= 7) Confetti.burst(160);
    $('#qBack').onclick = () => { closeGame(); tab = 'arcade'; render(); };
  };
  overlay(area, `<h2>Fußball-Experte</h2><p>10 knallharte Fragen über Bundesliga, WM und Champions League. Du hast 15 Sekunden pro Frage. Schnelle Antworten und Serien geben Extrapunkte.</p><button class="btn go" id="qGo" style="margin-top:12px">Los!</button>`);
  $('#qGo').onclick = () => { Sound.whistle(); ask(); };
  return () => { if (unbind) unbind(); };
}


// Boot: first render and the one-time welcome dialog.

function boot() {
  document.documentElement.lang = 'de';
  touchDaily(); save();
  render();
  if (!state.seenIntro) {
    state.seenIntro = true; save();
    const intro = APP.intro || {};
    const when = examDay && daysUntil(EXAM.date) >= 0 ? ` für ${examArt.acc} ${EXAM.kind} am ${examDay}` : '';
    const games = GAMES.length ? `, und je ${STARS_PER_TICKET} neue Sterne bringen ein Ticket für die Arcade mit ${GAMES.slice(0, 2).map(g => g.name).join(', ')} und mehr` : '';
    modal(`${APP.heroArt ? `<div style="width:110px;margin:0 auto">${APP.heroArt()}</div>` : ''}<p class="hand">Willkommen!</p><h2>${intro.title || MANIFEST.title}</h2><p>Hier trainierst du alles${when}. Für jedes Level gibt es bis zu 3 Sterne${games}.</p>${intro.tip ? `<p>${intro.tip}</p>` : ''}`,
      [{ label: "Los geht's!", cls: 'go' }]).then(() => Sound.click());
  }
}
boot();

</script>
