<style>
/* Shared design for all learning apps: one centered column on graph paper like a school notebook,
   sticky status bar and fixed tab bar. Apps override the color tokens in their own styles.css. */
:root {
  --paper: #F4F7FC;
  --grid: #DCE4F3;
  --card: #FFFFFF;
  --ink: #15213F;
  --ink-soft: #55648A;
  --line: #CDD7EA;
  --accent: #2257E6;
  --accent-soft: #DFE8FF;
  --accent-2: #8FE3FF;
  --gold: #FFC21A;
  --gold-ink: #1C1600;
  --bad: #D7263D;
  --bad-soft: #FDE3E6;
  --good: #12995A;
  --good-soft: #DAF4E7;
  --pen: #1F3FB0;
  --accent-strong: #2257E6;
  --go-strong: #12995A;
  --shadow: 0 2px 0 var(--line), 0 10px 24px -14px rgba(21, 33, 63, .35);
  --f-display: 'Dela Gothic One', 'Arial Black', Impact, system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-hand: 'Gochi Hand', 'Comic Sans MS', 'Segoe Print', cursive;
  /* calmer handwriting for what learners type, easier to read than --f-hand */
  --f-write: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  /* page background and the decorative stripe on hero cards; apps swap these for their own look */
  --paper-pattern: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  --paper-size: 24px 24px;
  --stripe: repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--gold-ink) 10px 20px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1527; --grid: #18233D; --card: #152039; --ink: #EAF0FD; --ink-soft: #9DAED2; --line: #2A3A60;
    --accent: #7097FF; --accent-soft: #1E2C57; --accent-2: #A8ECFF; --gold: #FFC93D; --gold-ink: #1C1600;
    --bad: #FF5D70; --bad-soft: #3D1A24; --good: #34D08C; --good-soft: #11392A; --pen: #96B2FF; --accent-strong: #3B63E0; --go-strong: #148A55;
    --shadow: 0 2px 0 #0A1020, 0 10px 24px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1527; --grid: #18233D; --card: #152039; --ink: #EAF0FD; --ink-soft: #9DAED2; --line: #2A3A60;
  --accent: #7097FF; --accent-soft: #1E2C57; --accent-2: #A8ECFF; --gold: #FFC93D; --gold-ink: #1C1600;
  --bad: #FF5D70; --bad-soft: #3D1A24; --good: #34D08C; --good-soft: #11392A; --pen: #96B2FF; --accent-strong: #3B63E0; --go-strong: #148A55;
  --shadow: 0 2px 0 #0A1020, 0 10px 24px -14px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: var(--paper-pattern);
  background-size: var(--paper-size);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: .01em; }
svg { display: block; }

.app { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }

/* ---------- status bar ---------- */
.status {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.rank { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.rank-badge { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-strong); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; flex: none; }
.rank-text { min-width: 0; flex: 1; }
.rank-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.chips { display: flex; gap: 6px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 99px; background: var(--paper); border: 2px solid var(--line); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip svg { width: 18px; height: 18px; }
.chip.pop { animation: pop .5s; }
.iconbtn { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
a.iconbtn { color: inherit; text-decoration: none; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 2px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; gap: 4px;
}
.tabs button { flex: 1; max-width: 160px; border: 0; background: none; padding: 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.tabs button svg { width: 26px; height: 26px; }
.tabs button[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }

/* ---------- home ---------- */
.hero { margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: stretch; }
.countdown {
  position: relative; padding: 18px 20px 18px 22px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow);
  border: 3px solid var(--ink); overflow: hidden; min-width: 0;
}
.countdown::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--stripe); }
.countdown.with-img { --hero-h: clamp(140px, 32vw, 230px); }
.countdown.with-img::before { top: calc(var(--hero-h) + 3px); }
.hero-img { display: block; width: calc(100% + 42px); max-width: none; height: var(--hero-h); margin: -18px -20px 14px -22px; object-fit: cover; object-position: var(--hero-pos, center); border-bottom: 3px solid var(--ink); }
.countdown .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
.countdown h1 { font-size: clamp(26px, 6vw, 40px); margin-top: 4px; }
.countdown h1 em { font-style: normal; color: var(--accent); }
.countdown p { margin: 8px 0 0; color: var(--ink-soft); max-width: 46ch; }
.hand { font-family: var(--f-hand); color: var(--pen); font-size: 1.15em; }
.herobox { width: 120px; border-radius: 18px; background: #0B1020; display: grid; place-items: end center; padding-bottom: 8px; box-shadow: var(--shadow); overflow: hidden; }
.herobox svg { width: 100%; height: 150px; }
.goalrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.tile { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); border: 2px solid var(--line); display: flex; gap: 12px; align-items: center; min-width: 0; text-align: left; }
button.tile:hover { border-color: var(--accent); }
.tile b { display: block; font-size: 15px; }
.tile span { display: block; font-size: 13px; color: var(--ink-soft); }
.tile .ring { width: 46px; height: 46px; flex: none; }
.tile .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; }
.tile .ico svg { width: 26px; height: 26px; }
.tile.exam { border-color: var(--ink); background: var(--gold); color: var(--gold-ink); }
.tile.exam span { color: var(--gold-ink); opacity: .8; }

.world { margin-top: 30px; }
.world-head { display: flex; align-items: center; gap: 14px; }
.world-art { width: 64px; height: 64px; flex: none; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 6px; color: var(--ink); box-shadow: var(--shadow); }
.world-art:has(.wimg) { width: 76px; height: 76px; padding: 0; overflow: hidden; }
.wimg { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 13px; }
.world-head h2 { font-size: clamp(20px, 4.4vw, 26px); }
.world-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
.world-num { font-family: var(--f-hand); color: var(--pen); font-size: 20px; }
.world-prog { margin-left: auto; text-align: right; font-weight: 700; font-size: 14px; flex: none; }
.world-prog small { display: block; color: var(--ink-soft); font-weight: 400; }
.path { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 14px 10px; margin-top: 16px; padding: 16px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 2px dashed var(--line); border-radius: 20px; }
.node { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; padding: 4px; text-align: center; }
.node .bubble { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform .15s; position: relative; color: var(--ink); }
.node .bubble svg { width: 34px; height: 34px; }
.node:hover .bubble { transform: translateY(-3px); }
.node:active .bubble { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.node.done .bubble { background: var(--accent-strong); color: #fff; }
.node.next .bubble { background: var(--gold); color: var(--gold-ink); animation: bob 1.6s ease-in-out infinite; }
.node.locked { cursor: not-allowed; }
.node.locked .bubble { background: var(--paper); border-color: var(--line); box-shadow: 0 5px 0 var(--line); color: var(--ink-soft); }
.node .lbl { font-size: 13px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; hyphens: auto; max-width: 100%; }
.node.locked .lbl { color: var(--ink-soft); }
.stars { display: flex; gap: 1px; }
.stars svg { width: 16px; height: 16px; }

/* ---------- generic ---------- */
.btn { border: 3px solid var(--ink); background: var(--card); color: var(--ink); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 var(--ink); transition: transform .08s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent-strong); color: #fff; }
.btn.go { background: var(--go-strong); color: #fff; }
.btn.warn { background: var(--gold); color: var(--gold-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 14px; font-size: 15px; }
.muted { color: var(--ink-soft); }
.section-title { font-size: clamp(24px, 5vw, 32px); margin: 24px 0 6px; }
.lead { color: var(--ink-soft); margin: 0 0 16px; max-width: 60ch; }

/* ---------- level screen ---------- */
.stage { position: fixed; inset: 0; z-index: 40; background: var(--paper); background-image: var(--paper-pattern); background-size: var(--paper-size); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.stage-inner { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 180px; }
.stage-top { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; padding: 10px 0; background: var(--paper); z-index: 2; }
.progress { flex: 1; height: 16px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.combo { font-family: var(--f-display); color: var(--gold-ink); background: var(--gold); border-radius: 10px; padding: 3px 10px; font-size: 15px; white-space: nowrap; }
.combo.hot { animation: pulse .8s infinite; }
.timer { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 10px; }
.timer i { display: block; height: 100%; background: var(--bad); transform-origin: left; }
.qtitle { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 10px; }
.question { font-size: clamp(21px, 4.4vw, 27px); font-weight: 700; margin: 6px 0 18px; text-wrap: balance; line-height: 1.3; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; border: 3px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; font-size: 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 0 var(--line); transition: transform .08s, border-color .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt kbd { font-family: var(--f-body); font-size: 13px; font-weight: 700; border: 2px solid var(--line); border-radius: 8px; width: 28px; height: 28px; display: grid; place-items: center; flex: none; color: var(--ink-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.opt[disabled] { cursor: default; }
.figure { width: min(220px, 60vw); aspect-ratio: 1; margin: 0 auto 18px; background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; color: var(--ink); box-shadow: var(--shadow); max-width: 100%; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; transform: translateY(110%); transition: transform .3s cubic-bezier(.2, .9, .3, 1.1); padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 3px solid var(--ink); }
.sheet.show { transform: none; }
.sheet.ok { background: var(--good-soft); }
.sheet.bad { background: var(--bad-soft); }
.sheet-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.sheet h3 { font-size: 22px; }
.sheet.ok h3 { color: var(--good); }
.sheet.bad h3 { color: var(--bad); }
.sheet p { margin: 4px 0 0; }
.sheet .txt { flex: 1; min-width: 220px; }
.sheet .xp { font-family: var(--f-display); color: var(--accent); }

/* match */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px 14px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.mcard { border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 58px; font-size: 16px; box-shadow: 0 3px 0 var(--line); }
.mcard .mart { width: 40px; height: 40px; flex: none; color: var(--ink); }
.mcard.sel { border-color: var(--accent); background: var(--accent-soft); }
.mcard.ok { border-color: var(--good); background: var(--good-soft); opacity: .55; cursor: default; }
.mcard.no { border-color: var(--bad); animation: shake .4s; }

/* swipe */
.swipe-wrap { position: relative; height: 300px; margin: 10px auto 20px; max-width: 460px; }
.scard { position: absolute; inset: 0; background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 28px; display: grid; place-items: center; text-align: center; font-size: clamp(20px, 4.5vw, 25px); font-weight: 700; box-shadow: var(--shadow); touch-action: pan-y; user-select: none; transition: transform .35s, opacity .35s; }
.scard .stamp { position: absolute; top: 16px; font-family: var(--f-display); font-size: 22px; padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; transition: opacity .1s; }
.scard .stamp.l { left: 16px; color: var(--bad); transform: rotate(-12deg); }
.scard .stamp.r { right: 16px; color: var(--good); transform: rotate(12deg); }
.scard.back { transform: scale(.94) translateY(14px); opacity: .6; }
.swipe-btns { display: flex; gap: 12px; justify-content: center; }
.swipe-btns .btn { flex: 1; max-width: 220px; }

/* sort */
.sort-card { margin: 14px auto 22px; max-width: 420px; background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 26px 20px; text-align: center; font-size: 22px; font-weight: 700; box-shadow: var(--shadow); min-height: 120px; display: grid; place-items: center; }
.sort-card.fly-0 { animation: fly0 .4s forwards; } .sort-card.fly-1 { animation: fly1 .4s forwards; } .sort-card.fly-2 { animation: fly2 .4s forwards; }
.buckets { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.bucket { border: 3px dashed var(--ink-soft); background: var(--card); border-radius: 18px; padding: 14px; min-height: 120px; text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.bucket:hover { border-color: var(--accent); border-style: solid; }
.bucket .count { font-family: var(--f-display); font-size: 26px; color: var(--accent); }
.bucket .mini { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bucket .mini span { font-size: 12px; font-weight: 400; background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; }

/* order */
.order-list { display: grid; gap: 10px; }
.ocard { text-align: left; border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 17px; display: flex; gap: 12px; align-items: center; box-shadow: 0 3px 0 var(--line); }
.ocard .n { width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 700; flex: none; }
.ocard.placed { border-color: var(--good); background: var(--good-soft); cursor: default; }
.ocard.placed .n { background: var(--good); color: #fff; border: 0; }
.ocard.no { border-color: var(--bad); animation: shake .4s; }
.hearts { display: flex; gap: 4px; }
.hearts svg { width: 24px; height: 24px; }

/* write */
.answer { width: 100%; min-height: 140px; border: 3px solid var(--line); border-radius: 16px; padding: 14px; font: inherit; font-size: 18px; background: var(--card); color: var(--ink); resize: vertical; font-family: var(--f-write); font-size: 20px; }
.type-lead { font-size: 17px; color: var(--ink-soft); margin-top: 4px; }
.type-word { font-family: var(--f-display); font-size: clamp(30px, 8vw, 46px); line-height: 1.15; margin: 8px 0 18px; overflow-wrap: anywhere; }
.type-word small { display: block; font-family: var(--f-body); font-size: 16px; font-weight: 400; color: var(--ink-soft); margin-top: 6px; }
.type-form { display: grid; gap: 12px; }
.tfield { display: grid; gap: 4px; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.tfield input { width: 100%; border: 3px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; font-family: var(--f-write); font-size: 24px; letter-spacing: .02em; text-transform: none; background: var(--card); color: var(--ink); }
.tfield input:focus { outline: none; border-color: var(--accent); }
.tfield input.right { border-color: var(--good); background: var(--good-soft); }
.tfield input.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
.type-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.model { margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--card); border: 3px solid var(--good); }
.model h4 { margin: 0 0 6px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--good); }
.kw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kw span { border-radius: 99px; padding: 3px 10px; font-size: 14px; font-weight: 700; border: 2px solid; }
.kw .hit { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.kw .miss { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.selfrate { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.points { display: grid; gap: 8px; }
.points label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; }
.points input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--good); }

/* ---------- more answer kinds (items.js) ---------- */
.qimg { margin: 6px 0 14px; }
.qimg img, .hint img { display: block; max-width: 100%; max-height: 300px; margin: 0 auto; border-radius: 14px; border: 3px solid var(--ink); background: #fff; cursor: zoom-in; }
.hint-row { margin: 14px 0 4px; }
.hint-row .btn svg { width: 20px; height: 20px; }
.hint { margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 22%, var(--card)); border: 2px solid var(--gold); }
.hint p { margin: 0 0 6px; }
.hint .src { font-size: 14px; color: var(--ink-soft); }
.zoom { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .85); display: grid; place-items: center; gap: 12px; padding: 16px; grid-template-rows: 1fr auto; }
.zoom img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 10px; background: #fff; }
.bd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.bd-chip, .bd-slot, .bd-gap, .bd-l, .bd-r, .bd-grow .seg button { border: 3px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 var(--line); text-align: left; }
.bd-chip[disabled] { opacity: .3; box-shadow: none; }
.bd-picked { display: grid; gap: 8px; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; }
.bd-slot { border-color: var(--accent); }
.bd-pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bd-pairs .col { display: grid; gap: 8px; align-content: start; }
.bd-l, .bd-r { display: flex; gap: 8px; align-items: center; font-size: 16px; }
.bd-l.sel { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--card)); }
.tag { min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 14px; flex: none; }
.tag:empty { background: var(--paper); }
.bd-groups { display: grid; gap: 10px; }
.bd-grow { display: grid; gap: 6px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
.bd-grow > span { font-weight: 700; }
.bd-grow .seg { display: flex; flex-wrap: wrap; gap: 6px; }
.bd-grow .seg button { padding: 6px 12px; font-size: 15px; }
.bd-grow .seg button.on { border-color: var(--accent); background: var(--accent-soft); }
.bd-cloze { font-size: 20px; line-height: 2.1; }
.bd-gap { padding: 2px 12px; font-size: 18px; margin: 0 2px; border-style: dashed; }
.bd-gap.filled { border-style: solid; border-color: var(--accent); }
.bd-multi.on { border-color: var(--accent); background: var(--accent-soft); }
.bd-multi.on kbd { background: var(--accent); color: #fff; border-color: var(--accent); }
.bd-slot.right, .bd-gap.right, .bd-l.right, .bd-grow.right, .bd-multi.right { border-color: var(--good); background: var(--good-soft); }
.bd-slot.wrong, .bd-gap.wrong, .bd-l.wrong, .bd-grow.wrong, .bd-multi.wrong { border-color: var(--bad); background: var(--bad-soft); }
.bd-multi.missed { border-color: var(--good); border-style: dashed; }

/* ---------- parents' view (parents.js) ---------- */
.ptable { overflow-x: auto; }
.ptable table { width: 100%; border-collapse: collapse; font-size: 15px; background: var(--card); border-radius: 14px; overflow: hidden; }
.ptable th, .ptable td { padding: 8px 10px; border-bottom: 2px solid var(--line); text-align: left; }
.plist { display: grid; gap: 10px; padding-left: 22px; }
.plist .muted { font-size: 14px; }
.pbtns { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.pcode { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.bad-text { color: var(--bad); font-weight: 700; }



/* memory */
.memory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mem { aspect-ratio: 1; perspective: 600px; border: 0; padding: 0; background: none; }
.mem .in { display: block; position: relative; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
.mem.open .in, .mem.gone .in { transform: rotateY(180deg); }
.mem .f, .mem .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 3px solid var(--ink); display: grid; place-items: center; padding: 6px; }
.mem .f { background: var(--accent); background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255, 255, 255, .12) 8px 16px); }
.mem .f svg { width: 40%; color: #fff; }
.mem .b { background: var(--card); transform: rotateY(180deg); font-weight: 700; font-size: clamp(11px, 2.6vw, 15px); text-align: center; color: var(--ink); line-height: 1.15; }
.mem .b svg { width: 80%; }
.mem.gone .b { border-color: var(--good); background: var(--good-soft); }

/* learn */
.learn-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; margin-top: 10px; min-height: 40px; }
.learn-head .qtitle { margin-top: 0; flex: 1 1 220px; }
.read-ctrl { flex: none; display: flex; gap: 6px; margin-left: auto; }
.read-rate { min-width: 54px; padding-left: 8px; padding-right: 8px; font-variant-numeric: tabular-nums; }
.read-aloud { flex: none; } .read-aloud svg { width: 20px; height: 20px; }
.read-aloud.on { background: var(--accent-strong); color: #fff; }
.learn-card { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); }
.learn-card h2 { font-size: clamp(22px, 4.8vw, 30px); margin-bottom: 10px; }
.learn-card p { font-size: 18px; margin: 0; max-width: 62ch; }
.learn-card ul, .learn-card ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }
.learn-card ol li::marker { font-family: var(--f-display); color: var(--accent); }
.dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.dev { border: 2px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; background: var(--paper); }
.dev .a { width: 74px; height: 74px; margin: 0 auto 6px; color: var(--ink); }
.dev b { display: block; font-size: 15px; }
.dev span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 26px; border-radius: 99px; }
.nav-row { display: flex; justify-content: space-between; gap: 12px; }

/* results */
.result { text-align: center; padding-top: 30px; }
.result h1 { font-size: clamp(30px, 7vw, 46px); }
.bigstars { display: flex; justify-content: center; gap: 8px; margin: 22px 0; }
.bigstars svg { width: 76px; height: 76px; opacity: .2; transform: scale(.4); }
.bigstars svg.on { animation: starIn .5s forwards; }
.rewards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 10px 0 24px; }
.reward { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 16px; font-family: var(--f-display); font-size: 22px; display: flex; gap: 8px; align-items: center; }
.reward svg { width: 26px; height: 26px; }
.result .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.grade { font-family: var(--f-display); font-size: 92px; line-height: 1; color: var(--accent); }

/* arcade */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.game { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; text-align: left; padding: 0; }
.game .thumb { height: 120px; overflow: hidden; }
.game .thumb svg { height: 100%; width: 100%; }
.game .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.game h3 { font-size: 20px; }
.game p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.game .meta { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-top: 4px; }
.game.locked { filter: grayscale(1); opacity: .65; }
.ticketbar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--gold); color: var(--gold-ink); border: 3px solid var(--ink); margin-bottom: 16px; }
.ticketbar svg { width: 40px; height: 40px; flex: none; }
.ticketbar b { font-family: var(--f-display); font-size: 22px; }
.ticketbar p { margin: 0; font-size: 14px; }

.game-stage { position: fixed; inset: 0; z-index: 50; background: #0B1020; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.game-bar { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); color: #fff; }
.game-bar .ttl { font-family: var(--f-display); font-size: 18px; flex: 1; }
.game-bar .iconbtn { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); color: #fff; }
.game-area { flex: 1; position: relative; min-height: 0; }
.game-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(8, 12, 26, .72); color: #fff; text-align: center; overflow-y: auto; }
.overlay .box { max-width: 560px; width: 100%; }
.overlay h2 { font-size: clamp(26px, 6vw, 40px); }
.overlay p { color: #C8D3EE; }
.overlay .btn { border-color: #fff; box-shadow: 0 4px 0 #fff; }
.fq { text-align: left; background: #152039; border: 2px solid #2A3A60; border-radius: 18px; padding: 18px; }
.fq .question { color: #fff; font-size: clamp(19px, 4vw, 24px); }
.fq .opt { background: #1B2949; border-color: #33467A; box-shadow: 0 4px 0 #33467A; color: #fff; }
.fq .opt kbd { border-color: #33467A; color: #9DAED2; }
.fq .opt.right { background: #11392A; border-color: #34D08C; box-shadow: 0 4px 0 #34D08C; }
.fq .opt.wrong { background: #3D1A24; border-color: #FF5D70; box-shadow: 0 4px 0 #FF5D70; }
.fq .fact { margin-top: 12px; color: #C8D3EE; font-size: 15px; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 14px 10px; text-align: center; }
.badge .medal { width: 64px; height: 64px; margin: 0 auto 8px; }
.badge b { display: block; font-size: 15px; }
.badge span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.badge.off { opacity: .5; }
.badge.off .medal { filter: grayscale(1); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { font-family: var(--f-display); font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }

/* cheat sheet */
.cheat { display: grid; gap: 14px; }
.cheat details { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; }
.cheat summary { padding: 14px 18px; font-family: var(--f-display); font-size: 19px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; }
.cheat summary::-webkit-details-marker { display: none; }
.cheat summary .sa { width: 40px; height: 40px; flex: none; color: var(--ink); }
.cheat summary::after { content: "+"; margin-left: auto; font-size: 26px; color: var(--accent); }
.cheat details[open] summary::after { content: "–"; }
.cheat .cbody { padding: 0 18px 18px; display: grid; gap: 14px; }
.cheat h4 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
.cheat p, .cheat li { font-size: 16px; }
.cheat p { margin: 0; }
.cheat ul, .cheat ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* toasts & modal */
.toasts { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; animation: toastIn .4s, toastOut .4s 3.2s forwards; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); }
.toast svg { width: 40px; height: 40px; flex: none; }
.toast b { display: block; }
.toast span { font-size: 14px; opacity: .8; }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 26, .6); display: grid; place-items: center; padding: 20px; }
.modal .box { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 26px; max-width: 440px; width: 100%; text-align: center; animation: pop .5s; }
.modal h2 { font-size: 28px; margin: 6px 0; }
.modal p { color: var(--ink-soft); }
.modal .thumb { height: 110px; border-radius: 14px; overflow: hidden; margin-bottom: 8px; }
.modal .thumb svg { width: 100%; height: 100%; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%; }

@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes starIn { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.25) rotate(8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-20px); } }
@keyframes fly0 { to { transform: translate(-120px, 160px) scale(.3); opacity: 0; } }
@keyframes fly1 { to { transform: translate(0, 170px) scale(.3); opacity: 0; } }
@keyframes fly2 { to { transform: translate(120px, 160px) scale(.3); opacity: 0; } }
@keyframes flick { 0%, 100% { transform: scaleY(1) skewX(0); } 25% { transform: scaleY(1.05) skewX(-2deg); } 50% { transform: scaleY(.96) skewX(1deg); } 75% { transform: scaleY(1.03) skewX(2deg); } }
.flicker { transform-origin: 50% 100%; transform-box: fill-box; animation: flick 1.2s ease-in-out infinite; }

@media (max-width: 640px) {
  body { font-size: 16px; }
  .hero { grid-template-columns: 1fr; }
  .herobox { display: none; }
  .goalrow { grid-template-columns: 1fr; }
  .path { grid-template-columns: repeat(var(--cols-sm, 3), minmax(0, 1fr)); padding: 12px 8px; }
  .node .bubble { width: 62px; height: 62px; }
  .match { grid-template-columns: 1fr 1fr; }
  .mcard { font-size: 14px; padding: 8px; }
  .mcard .mart { width: 30px; height: 30px; }
  .chip.hide-sm { display: none; }
  .status { gap: 8px; }
  .status .iconbtn { width: 34px; height: 34px; border-radius: 10px; }
  .rank { gap: 8px; }
  .rank-badge { width: 36px; height: 36px; font-size: 16px; border-radius: 10px; }
  .rank-name { font-size: 13px; }
  .chips { gap: 4px; }
  .chip { padding: 4px 7px; font-size: 13px; }
  .chip svg { width: 16px; height: 16px; }
  .world-prog small { display: none; }
  .world-head { flex-wrap: wrap; gap: 10px 12px; }
  .world-art { width: 52px; height: 52px; }
  .world-art:has(.wimg) { width: 64px; height: 64px; }
  .world-head > div:nth-child(2) { flex: 1; }
  .world-prog { order: 3; width: 100%; text-align: left; margin-left: 0; }
  .node .lbl { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Ritt zur Friedensstadt: parchment and timber-frame colours of an old town, the red of the
   city flag, Fredoka for friendly headings, plus the marker for the teacher's guiding questions.
   The shared design lives in core/core.css. */
:root {
  --paper: #F6EDDA; --grid: #E6D7B9; --card: #FFFBF2; --ink: #3A2A1A; --ink-soft: #7A6450; --line: #E4D3B4;
  --accent: #C0262D; --accent-soft: #F8DEDD; --accent-2: #5E9E4A; --gold: #F2B632; --gold-ink: #3A2A1A;
  --pen: #2E5E8C; --accent-strong: #C0262D; --go-strong: #3E8A3A; --good: #3E8A3A; --good-soft: #DDF0D6;
  --shadow: 0 2px 0 var(--line), 0 10px 24px -14px rgba(58, 42, 26, .4);
  --f-display: 'Fredoka', 'Arial Rounded MT Bold', system-ui, sans-serif;
  --paper-pattern: radial-gradient(circle at 1px 1px, var(--grid) 1.5px, transparent 2px);
  --paper-size: 22px 22px;
  --stripe: repeating-conic-gradient(var(--accent) 0 25%, #FFFFFF 0 50%) 0 0 / 10px 20px;
  --hero-pos: 50% 40%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #1A140E; --grid: #2C2218; --card: #261D15; --ink: #F6EDDA; --ink-soft: #C9B597; --line: #48392A; --accent: #FF7A6E; --accent-soft: #4A2220; --accent-2: #8FCB7A; --gold: #F5C24E; --pen: #9CC4EE; --accent-strong: #C93A36; --go-strong: #3E8A3A; --shadow: 0 2px 0 #0C0906, 0 10px 24px -14px rgba(0, 0, 0, .7); }
}
:root[data-theme="dark"] { --paper: #1A140E; --grid: #2C2218; --card: #261D15; --ink: #F6EDDA; --ink-soft: #C9B597; --line: #48392A; --accent: #FF7A6E; --accent-soft: #4A2220; --accent-2: #8FCB7A; --gold: #F5C24E; --pen: #9CC4EE; --accent-strong: #C93A36; --go-strong: #3E8A3A; --shadow: 0 2px 0 #0C0906, 0 10px 24px -14px rgba(0, 0, 0, .7); }

h1, h2, h3 { font-weight: 600; letter-spacing: 0; }
.question { font-size: 21px; }
.lf { display: inline-block; vertical-align: 2px; margin-right: 4px; padding: 1px 8px; border-radius: 8px; background: var(--accent); color: #fff; font-family: var(--f-body); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

</style>
</head>
<body>
<div class="app">
  <header class="status" id="status"></header>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Bereiche"></nav>
<div class="toasts" id="toasts" aria-live="polite"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<script>
// Small helpers shared by the engine, the games and every app.

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function svg(inner, vb = '0 0 100 100') {
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
}

// Dates are plain 'YYYY-MM-DD' strings in local time.

const Sound = {
  ctx: null,
  ensure() {
    if (!state.sound) return null;

      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { return null; }

  tone(f, d = .12, type = 'sine', vol = .12, when = 0, slide = 0) {

  },
  right() { this.tone(660, .09, 'triangle', .14); this.tone(990, .16, 'triangle', .14, .08); },

  noiseNode: null,

const Confetti = {
  parts: [], running: false,
  burst(n = 120, x = .5, y = .35) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cols = ['#2257E6', '#FFC21A', '#D7263D', '#12995A', '#8FE3FF', '#FF8A3D'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      this.parts.push({ x: x * W, y: y * H, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: 4 + Math.random() * 6, c: pick(cols), rot: Math.random() * 6, vr: Math.random() * .4 - .2, life: 120 + Math.random() * 60 });
    }
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.tick()); }
  },
  tick() {
    const cv = $('#confetti'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    this.parts = this.parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    for (const p of this.parts) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.tick()); else { this.running = false; g.clearRect(0, 0, cv.width, cv.height); }
  },
};

function toast(title, text, iconHtml) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${iconHtml || ICON.medal('var(--gold)', 'var(--gold-ink)')}<div><b>${title}</b><span>${text}</span></div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3700);
}

const modalQueue = [];
function modal(html, buttons = [{ label: 'Weiter', cls: 'primary' }]) {
  return new Promise(resolve => {
    modalQueue.push({ html, buttons, resolve });
    if (modalQueue.length === 1) showNextModal();
  });
}
function showNextModal() {
  const m = modalQueue[0]; if (!m) return;
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="box" role="dialog" aria-modal="true">${m.html}<div class="actions" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">${m.buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
  document.body.appendChild(el);
  $('button', el).focus();
  el.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    el.remove(); modalQueue.shift(); m.resolve(+b.dataset.i); showNextModal();
  });
}

{ id: "s17", st: "stadtteile", typ: "mc", lf: true, f: "Womit schützten sich Binnenburg und Butenburg gemeinsam?",

{ id: "s18", st: "stadtteile", typ: "mc", f: "Welche drei Teile bilden zusammen die Osnabrücker Altstadt?",

{ id: "s19", st: "stadtteile", typ: "mc", lf: true, f: "Was entstand in der Neustadt?",

{ id: "s20", st: "stadtteile", typ: "mc", f: "Woran erkennt man die Neustadt bis heute?",

{ id: "s21", st: "stadtteile", typ: "mc", lf: true, f: "Wie heißt die erste Kirche von Osnabrück?",

{ id: "s22", st: "stadtteile", typ: "mc", f: "Welcher Stadtteil ist auf der Karte mit A markiert?", b: "bilder/karte_abcd.jpg",

/* ───────── Station 4: Leben in der alten Stadt ───────── */
{ id: "l1", st: "stadtleben", typ: "mc", lf: true, f: "Wie heißen diese Gebäude?", b: "bilder/fachwerk.jpg",

  e: "Das sind Fachwerkhäuser: ein Gerüst aus Holzbalken, die „Fächer“ dazwischen sind mit Ziegeln oder Reisig gefüllt.",

{ id: "l2", st: "stadtleben", typ: "reihe", f: "Wie baute man ein Fachwerkhaus? Bring die Schritte in die richtige Reihenfolge.",

{ id: "l3", st: "stadtleben", typ: "mc", f: "Warum waren die Grundstücke in der Stadt meistens klein?",

  t: { x: "„Der Grund und Boden in der Stadt war knapp und deshalb teuer.“", q: "„Die Fachwerk-Stadt“" } },
{ id: "l4", st: "stadtleben", typ: "mc", f: "Warum waren die Straßen oft dunkel und feucht?",

  t: { x: "„Um mehr Platz zu gewinnen, wurden die oberen Stockwerke immer ein Stückchen weiter vorgebaut. […] drang nur noch wenig Sonnenlicht auf die Straße durch.“", q: "„Die Fachwerk-Stadt“", b: "bilder/fachwerk.jpg" } },
{ id: "l5", st: "stadtleben", typ: "mc", f: "Was war eine große Gefahr für Fachwerkhäuser – und wer konnte sich Steinhäuser leisten?",

  t: { x: "„Diese Häuser waren immer durch Feuer gefährdet. Nur sehr reiche Bürger konnten es sich leisten, Steinhäuser zu bauen.“", q: "„Die Fachwerk-Stadt“" } },
{ id: "l6", st: "stadtleben", typ: "mc", f: "Warum wurde Osnabrück manchmal durch Feuer verwüstet?",

  t: { x: "„… weil die Feinde mit Feuerpfeilen über sie hinwegschießen konnten. Das war eine große Gefahr, denn die Häuser der Stadt waren mit Stroh gedeckt und fingen leicht Feuer.“", q: "Lesetext „Osnabrück war von einer Mauer umgeben“" } },
{ id: "l7", st: "stadtleben", typ: "mc", f: "Wozu wurden die großen Befestigungstürme und die Vitischanze gebaut?",

  t: { x: "„Zusätzlich wurden die großen Befestigungstürme und die Vitischanze aufgebaut, von denen die heranrückenden Gegner beschossen werden konnten.“", q: "„Osnabrück war von einer Mauer umgeben“" } },
{ id: "l8", st: "stadtleben", typ: "mc", f: "Warum waren später alle Befestigungen umsonst?",

  t: { x: "„Als die Kanonen erfunden wurden, konnte die Stadt aus großer Entfernung beschossen werden. […] Alle Befestigungen waren umsonst.“", q: "„Osnabrück war von einer Mauer umgeben“" } },
{ id: "l9", st: "stadtleben", typ: "jahr", f: "In welchem Jahr ebneten die Osnabrücker die letzten Wälle ein und rissen Mauern und Tore ab?", a: 1872,

  t: { x: "„18_2 ebneten sie die letzten Wälle ein, schütteten die Gräben zu und rissen die Mauern und die engen Stadttore ab.“ (eine Ziffer versteckt)", q: "„Osnabrück war von einer Mauer umgeben“" } },
{ id: "l10", st: "stadtleben", typ: "mc", f: "Welche Straßennamen erinnern noch an die alte Stadtmauer?",

  t: { x: "„Einige Straßennamen erinnern noch daran: Goethering, Schloßwall, Neuer Graben und Rolandsmauer.“", q: "„Osnabrück war von einer Mauer umgeben“" } },
{ id: "l11", st: "stadtleben", typ: "mc", f: "Was steht auf dem Marktplatz im Westen?",

{ id: "l12", st: "stadtleben", typ: "mc", f: "Welches Gebäude ist das?", b: "bilder/foto_rathaus.jpg",

{ id: "l13", st: "stadtleben", typ: "mc", f: "Warum spricht man bei diesen Häusern von Treppengiebeln?", b: "bilder/buergerhaeuser.jpg",

{ id: "l14", st: "stadtleben", typ: "mc", f: "Wozu diente früher die Stadtwaage am Markt?",

{ id: "l15", st: "stadtleben", typ: "mc", f: "Wie nennt man den Osnabrücker Marktplatz auch?",

/* ───────── Station 5: Ablasshandel und Reformation ───────── */
{ id: "r1", st: "reformation", typ: "mc", lf: true, f: "Was ist der Ablasshandel?",
  o: ["Die Kirche verkaufte Briefe, mit denen man sich angeblich von Sünden freikaufen konnte", "Händler tauschten auf dem Markt Brot gegen Fleisch", "Man musste an der Brücke Zoll zahlen", "Die Kirche verschenkte Bibeln"],
  e: "Die Kirche bot „Ablassbriefe“ zum Kauf an. Angeblich konnten sich die Menschen damit von ihren Sünden freikaufen.",
  t: { x: "„Damals bot die Kirche „Ablassbriefe“ zum Kauf an. Angeblich konnten sich die Menschen damit von ihren Sünden freikaufen.“", q: "Nachgehakt! Ablasshandel (Reformation 4/4)" } },
{ id: "r2", st: "reformation", typ: "mc", lf: true, f: "Wie hat der Ablasshandel funktioniert?",
  o: ["Man zahlte Geld für einen Brief und glaubte, dann nicht für seine Sünden büßen zu müssen", "Man tauschte Sünden gegen Brezeln", "Der Bischof schrieb jedem kostenlos einen Brief", "Man musste dafür in den Krieg ziehen"],
  e: "Die Menschen bezahlten Geld für einen Ablassbrief. Sie glaubten, dass sie dann nach dem Tod nicht für ihre Sünden büßen mussten.",
  t: { x: "„Viele Menschen kauften solche Ablassbriefe. Denn die Menschen glaubten fest daran, nach dem Tod für ihre Sünden büßen zu müssen.“", q: "Reformation 4/4" } },
{ id: "r3", st: "reformation", typ: "mc", lf: true, f: "Warum gab es den Ablasshandel?",
  o: ["Die Menschen hatten Angst vor Strafe nach dem Tod, und die Kirche machte damit Geschäfte", "Der Kaiser hatte ihn befohlen", "Die Händler brauchten Papier", "Die Kinder sammelten die Briefe"],
  e: "Die Menschen hatten Angst, nach dem Tod büßen zu müssen. Die Kirche machte mit dieser Angst Geschäfte und verdiente Geld.",
  t: { x: "„Luther ärgerte sich, dass die Kirche mit der Angst der Menschen Geschäfte machte.“", q: "Reformation 4/4" } },
{ id: "r4", st: "reformation", typ: "mc", lf: true, f: "Wer war am Ablasshandel beteiligt – und wo gab es ihn?",
  o: ["Die Kirche verkaufte, viele Menschen kauften – in der Kirche", "Die Schweden verkauften auf dem Markt", "Luther verkaufte im Rathaus", "Die Sachsen verkauften im Wald"],
  e: "Die Kirche verkaufte die Ablassbriefe, viele Menschen kauften sie. Martin Luther kritisierte das.",
  t: { x: "„Damals bot die Kirche „Ablassbriefe“ zum Kauf an. […] Viele Menschen kauften solche Ablassbriefe.“", q: "Reformation 4/4" } },
{ id: "r5", st: "reformation", typ: "mc", f: "Wie kann man Gottes Liebe und Vergebung bekommen, sagte Luther?",
  o: ["Durch den Glauben und ein gutes Leben", "Durch viel Geld", "Durch möglichst viele Ablassbriefe", "Durch einen Krieg"],
  e: "Luther war sich sicher: Gottes Vergebung kann man nicht kaufen. Man bekommt sie durch den Glauben und ein gutes Leben.",
  t: { x: "„Jeder konnte sie erlangen: Doch nicht durch die Zahlung von Geld, sondern allein durch den Glauben und ein gutes Leben.“", q: "Reformation 4/4" } },
{ id: "r6", st: "reformation", typ: "mc", lf: true, f: "Was bedeutet das Wort „Reformation“?",
  o: ["Erneuerung", "Zerstörung", "Frieden", "Verkauf"],
  e: "Reformation bedeutet Erneuerung. Gemeint ist die Erneuerung der Kirche durch Martin Luther.",
  t: { x: "Glühbirnen-Notiz: „Reformation bedeutet ___.“ Auf dem Zeitstrahl aus dem Unterricht steht es in Klammern: „Die Reformation (E…)“.", q: "Reformation 1/4", b: "bilder/leitfragen_2.jpg" } },
{ id: "r7", st: "reformation", typ: "jahr", lf: true, f: "In welchem Jahr begann die Reformation?", a: 1517,
  e: "1517 machte Martin Luther seine 95 Vorschläge. Das war der Beginn der Reformation.",
  t: { x: "„Im Jahr 15_7 machte er 95 Vorschläge, wie sich die Kirche verändern soll.“ (eine Ziffer versteckt)", q: "Reformation 1/4" } },
{ id: "r8", st: "reformation", typ: "mc", lf: true, f: "Wer war Martin Luther?", b: "bilder/luther.jpg",
  o: ["Ein Mönch", "Ein König", "Der Bischof von Osnabrück", "Ein Gesandter aus Schweden"],
  e: "Martin Luther war ein Mönch. Er war unzufrieden mit der Kirche seiner Zeit.",
  t: { x: "„Der Mönch Martin Luther war sehr unzufrieden mit der Kirche zu seiner Zeit!“", q: "Reformation 1/4" } },
{ id: "r9", st: "reformation", typ: "wort", f: "Luther machte 95 Vorschläge. Wie nennt man sie? Die 95 …",
  a: ["Thesen", "95 Thesen"], e: "Die 95 Thesen.",
  t: { x: "Sprechblase vom Steckenpferd: „Luthers Vorschläge werden die „95 T_____“ genannt!“", q: "Reformation 1/4" } },
{ id: "r10", st: "reformation", typ: "mc", lf: true, f: "Was war der Auslöser für die Reformation? Worüber war Luther unzufrieden?",
  o: ["Papst und Bischöfe hielten sich nicht an die Bibel und lebten reich wie Fürsten", "Es gab zu wenige Kirchen", "Die Bibel war zu dick", "Die Gottesdienste waren zu kurz"],
  e: "Papst und viele Bischöfe hielten sich nicht an die Bibel und lebten in Reichtum. Am meisten ärgerte Luther der Ablasshandel.",
  t: { x: "„Damals hielten sich der Papst und viele Bischöfe nicht an die Vorgaben der Bibel. Statt wie bescheidene Kirchenmänner lebten sie in Reichtum wie Fürsten und Könige.“", q: "Reformation 1/4" } },
{ id: "r11", st: "reformation", typ: "mc", f: "Warum nannte man Luthers Anhänger „Protestanten“?",
  o: ["Weil sie gegen die Verfolgung Luthers protestierten", "Weil sie aus Preußen kamen", "Weil sie Profis waren", "Weil sie den Papst wählten"],
  e: "Papst und Kaiser ließen Luther verfolgen. Seine Anhänger protestierten dagegen und hießen deshalb Protestanten.",
  t: { x: "„Die Anhänger Luthers protestierten dagegen und erhielten daher ihren Namen: Protestanten.“", q: "Reformation 1/4" } },
{ id: "r12", st: "reformation", typ: "mc", lf: true, f: "Wer war an der Reformation beteiligt?",
  o: ["Martin Luther und seine Anhänger; Gegner waren Papst und Kaiser", "Karl der Große und Widukind", "Die Schweden und die Franzosen", "Bischof Wiho und die Sachsen"],
  e: "Martin Luther und seine Anhänger, die Protestanten. Der Papst und der Kaiser waren mächtige Gegner, weil sie um ihre Macht fürchteten.",

// Worlds of "Ritt zur Friedensstadt", built from the question catalogue in data.js: one world per
// station in the order of the lessons, then the years and the mock-test questions. Never reorder
// worlds or levels once published; progress is stored per world id and level position.

// The pictures are cut from the class material and stay out of this public repo; they are
// loaded from the first version of the app.
const PIC_BASE = 'https://winf-hsos.github.io/ritt-zur-friedensstadt/';
const pic = p => p ? PIC_BASE + p : undefined;

const QUESTION = Object.fromEntries(RITT.fragen.map(q => [q.id, q]));
const questionsOf = st => RITT.fragen.filter(q => q.st === st);
const chunk = (list, size) => {
  const n = Math.ceil(list.length / size), per = Math.ceil(list.length / n);
  return Array.from({ length: n }, (_, i) => list.slice(i * per, (i + 1) * per));
};

// Learn cards: what to remember from each station, taken from the explanations of its questions.
function stationCards(st) {
  const notes = questionsOf(st.id).filter(q => q.e && q.typ !== 'erklaer');
  const lead = notes.filter(q => q.lf), rest = notes.filter(q => !q.lf);
  return [
    { h: st.name, p: `${st.zeit}: ${st.kurz}.`, bullets: lead.slice(0, 6).map(q => q.e) },
    ...chunk([...lead.slice(6), ...rest], 6).filter(c => c.length).map((c, i) => ({ h: `Gut zu wissen ${i + 1}`, bullets: c.map(q => q.e) })),
  ];
}

const STATION_ART = { furt: 'ford', gruendung: 'crown', stadtteile: 'towers', stadtleben: 'house', reformation: 'theses', krieg: 'sword', frieden: 'dove', steckenpferd: 'horse' };

const TOPICS = [
  ...RITT.stationen.map(st => {
    const qs = questionsOf(st.id), lead = qs.filter(q => q.lf);
    return {
      id: st.id, img: `img/${st.id}.webp`, title: st.name, sub: `${st.zeit} · ${st.kurz}${st.extra ? ' (Zusatz)' : ''}`, art: STATION_ART[st.id], badge: st.name,
      learn: stationCards(st),
      levels: [
        { type: 'learn', title: 'Das Wichtigste' },
        ...chunk(qs, 8).map((c, i) => ({ type: 'ritt', title: `Runde ${i + 1}`, ids: c.map(q => q.id) })),
        ...(lead.length >= 3 ? [{ type: 'ritt', title: 'Leitfragen', ids: lead.map(q => q.id) }] : []),
      ],
    };
  }),
  {
    id: 'zeit', img: 'img/zeit.webp', title: 'Jahreszahlen-Profi', sub: 'Alle Jahreszahlen und die richtige Reihenfolge', art: 'hourglass', badge: 'Zeitreisender',
    learn: [{ h: 'Die wichtigsten Jahreszahlen', bullets: ['um 780: Karl der Große lässt an der Furt eine Bischofskirche bauen (Domburg).', 'um 1000: Binnenburg mit der Marienkirche', 'um 1200: Butenburg mit der Katharinenkirche', 'um 1300: Neustadt mit der Johanniskirche, 1306 vereinigt mit der Altstadt', '1517: Luthers 95 Thesen, Beginn der Reformation', '1618 bis 1648: der Dreißigjährige Krieg', '25. Oktober 1648: Der Westfälische Friede wird in Osnabrück verkündet.', '1948: zum ersten Mal Steckenpferdreiten'] }],
    levels: [
      { type: 'learn', title: 'Zeitleiste' },
      ...chunk(RITT.fragen.filter(q => q.st === 'zeit' || q.typ === 'jahr'), 8).map((c, i) => ({ type: 'ritt', title: `Jahreszahlen ${i + 1}`, ids: c.map(q => q.id) })),
      { type: 'ritt', title: 'Reihenfolgen', ids: RITT.fragen.filter(q => q.typ === 'reihe' && q.st !== 'stadtleben').map(q => q.id) },

  },
  {

// One catalogue question as a quiz item of the shared engine.
function rittItem(lv, id, ref) {
  const qq = QUESTION[id]; if (!qq) return null;
  const base = { ref, img: pic(qq.b), x: qq.e ? `<b>Merke:</b> ${qq.e}` : '', hint: qq.t ? { x: qq.t.x, q: qq.t.q, img: pic(qq.t.b) } : null };
  const q = lfTag(qq) + qq.f;
  switch (qq.typ) {
    case 'mc': return mcFrom({ q, o: qq.o, a: 0, x: base.x }, ref, { img: base.img, hint: base.hint });
    case 'jahr': return { ...base, kind: 'type', q, fields: [{ label: 'Jahreszahl', accept: [String(qq.a)], strict: true, numeric: true, sol: String(qq.a) }] };
    case 'wort': return { ...base, kind: 'type', q, fields: [{ label: 'Antwort', accept: qq.a, sol: qq.a[0] }] };
    case 'reihe': return { ...base, kind: 'order', q, items: qq.o };
    case 'paare': return { ...base, kind: 'pairs', q, pairs: qq.p };
    case 'gruppen': return { ...base, kind: 'groups', q, groups: qq.g, items: qq.i };
    case 'luecke': return { ...base, kind: 'cloze', q, s: qq.s, answers: qq.a, o: qq.o };
    case 'mehrfach': return { ...base, kind: 'multi', q, o: qq.o, right: qq.r };
  }
  return null;
}

// The first version stored per question {n, r, w, box, last, tipp} plus Taler and the days played.
// Taler become XP (3 Taler per right answer there, about 10 XP here), a level gets the stars its share
// of questions answered right the last time would earn, and questions last answered wrong go into the
// mistake box.
function convertLegacy(old) {
  const stats = old.fragen || {}, s = { xp: Math.round((old.taler || 0) * 4), levels: {}, mistakes: {}, answered: 0, correct: 0 };
  Object.values(stats).forEach(v => { s.answered += v.n || 0; s.correct += v.r || 0; });
  const placed = new Set();
  TOPICS.forEach(t => t.levels.forEach((lv, l) => {
    if (lv.type !== 'ritt') return;
    const right = lv.ids.filter(id => stats[id] && stats[id].last === true).length, stars = starsFor(right / lv.ids.length);
    if (stars) s.levels[`${t.id}:${l}`] = { stars, best: Math.round(right / lv.ids.length * 100) };
    lv.ids.forEach(id => { if (stats[id] && stats[id].last === false && !placed.has(id)) { placed.add(id); s.mistakes[`${t.id}|${l}|${id}`] = { n: stats[id].w || 1 }; } });
  }));
  // A station already practised counts as read, so its learn cards do not block the way.
  TOPICS.forEach(t => { if (t.levels.some((_, l) => s.levels[`${t.id}:${l}`])) s.levels[`${t.id}:0`] = { stars: 1, best: 100 }; });
  const days = (old.tage || []).slice().sort();
  if (days.length) {
    let n = 1;
    for (let i = days.length - 1; i > 0 && daysUntil(days[i - 1]) === daysUntil(days[i]) - 1; i--) n++;
    s.streak = { last: days[days.length - 1], days: n };
  }
  s.sound = old.ton !== false;
  return s;
}

  document.body.appendChild(st);

  const hud = html => { $('#gHud').innerHTML = html; };

}
function closeGame() {
  if (gameCleanup) { try { gameCleanup(); } catch (e) { } gameCleanup = null; }
  const st = $('#gameStage'); if (st) st.remove();
  document.body.style.overflow = '';
}

function setupCanvas(area) {
  const cv = document.createElement('canvas'); area.appendChild(cv);
  const ctx = cv.getContext('2d');
  const size = { W: 0, H: 0 };
  const fit = () => {
    const r = area.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
    size.W = r.width; size.H = r.height;
    cv.width = r.width * dpr; cv.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  addEventListener('resize', fit);
  return { cv, ctx, size, dispose: () => removeEventListener('resize', fit) };
}

function overlay(area, html) {
  let o = $('.overlay', area);
  if (!o) { o = document.createElement('div'); o.className = 'overlay'; area.appendChild(o); }
  o.innerHTML = `<div class="box">${html}</div>`;
  o.hidden = false;
  return o;
}
function hideOverlay(area) { const o = $('.overlay', area); if (o) o.hidden = true; }

function recordGame(key, value) {
  const isNew = value > (state.games[key] || 0);
  if (isNew) state.games[key] = value;
  save();
  return isNew;
}

function rrect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

// Trivia questions come from the app's pack (APP.trivia), answers shuffled.
// Unseen questions come first. The seen list is shared by all apps on this site,
// so a question from one app does not come back in another, and it starts over
// once the whole pool has been shown.
const TRIVIA_SEEN_KEY = 'kla:trivia-seen';
const triviaId = q => { let h = 5381; for (const ch of q.q) h = ((h * 33) ^ ch.charCodeAt(0)) >>> 0; return h.toString(36); };
function triviaQuestions(n) {
  let seen;
  try { seen = new Set(JSON.parse(localStorage.getItem(TRIVIA_SEEN_KEY)) || []); } catch (e) { seen = new Set(); }
  const fresh = shuffle(APP.trivia.filter(q => !seen.has(triviaId(q))));
  let picked = fresh.slice(0, n);
  if (picked.length < n) {
    APP.trivia.forEach(q => seen.delete(triviaId(q)));
    picked = picked.concat(shuffle(APP.trivia.filter(q => !picked.includes(q))).slice(0, n - picked.length));
  }
  picked.forEach(q => seen.add(triviaId(q)));
  try { localStorage.setItem(TRIVIA_SEEN_KEY, JSON.stringify([...seen])); } catch (e) { /* storage unavailable */ }
  return picked.map(q => { const order = shuffle([0, 1, 2, 3]); return { q: q.q, o: order.map(i => q.o[i]), a: order.indexOf(q.a), f: q.f }; });
}

function questionBox(q, idx, total, onAnswer, timeLimit) {
  return { html: `<div class="fq"><div class="qtitle" style="color:#9DAED2">Frage ${idx + 1}/${total}</div>${timeLimit ? '<div class="timer"><i id="fqT"></i></div>' : ''}<div class="question">${q.q}</div>
    <div class="options">${q.o.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${o}</span></button>`).join('')}</div><div class="fact" id="fqFact"></div><div id="fqNext" style="margin-top:12px"></div></div>`,
    bind(root) {
      let done = false, raf = 0; const t0 = performance.now();
      const choose = i => {
        if (done) return; done = true; cancelAnimationFrame(raf); removeEventListener('keydown', key);
        const ok = i === q.a, bs = $$('.opt', root);
        bs.forEach(b => b.disabled = true);
        if (i >= 0) bs[i].classList.add(ok ? 'right' : 'wrong');
        bs[q.a].classList.add('right');
        ok ? Sound.right() : Sound.wrong();
        $('#fqFact', root).innerHTML = `${i < 0 ? '<b>Zeit abgelaufen!</b> ' : ''}${q.f}`;
        onAnswer(ok, (performance.now() - t0) / 1000);
      };
      const key = e => { const n = +e.key; if (n >= 1 && n <= 4) choose(n - 1); };
      addEventListener('keydown', key);
      $$('.opt', root).forEach(b => b.onclick = () => choose(+b.dataset.i));
      if (timeLimit) {
        const bar = $('#fqT', root);
        const tick = () => { const p = (performance.now() - t0) / 1000 / timeLimit; bar.style.transform = `scaleX(${1 - clamp(p, 0, 1)})`; if (p >= 1) return choose(-1); raf = requestAnimationFrame(tick); };
        raf = requestAnimationFrame(tick);
      }
      return () => { cancelAnimationFrame(raf); removeEventListener('keydown', key); };
    } };
}
