      <span class="chip" id="ticketChip" title="Spiel-Tickets">${ICON.ticket}${state.tickets}</span>
    </div>
    <button class="iconbtn" id="soundBtn" aria-label="Ton an/aus">${state.sound ? ICON.soundOn : ICON.soundOff}</button>`;
  $('#soundBtn').onclick = () => { state.sound = !state.sound; if (!state.sound) Sound.stopRoar(); save(); renderStatus(); Sound.click(); };
}

function renderTabs() {
  const items = [['home', 'Lernpfad', ICON.map], ['cheat', 'Spickzettel', ICON.book], ['arcade', 'Arcade', ICON.pad], ['badges', 'Erfolge', ICON.trophy]];
  $('#tabs').innerHTML = items.map(([id, l, ic]) => `<button data-tab="${id}" aria-current="${tab === id}">${ic}${l}</button>`).join('');
  $$('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; Sound.click(); render(); scrollTo(0, 0); });
}

function render() {
  renderStatus(); renderTabs();
  const m = $('#main');
  if (tab === 'home') m.innerHTML = homeHtml();
  if (tab === 'cheat') m.innerHTML = cheatHtml();
  if (tab === 'arcade') m.innerHTML = arcadeHtml();
  if (tab === 'badges') m.innerHTML = badgesHtml();
  bindMain();
}

function ring(p) {
  const r = 19, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--accent-soft)" stroke-width="6"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - clamp(p, 0, 1))}" transform="rotate(-90 23 23)"/></svg>`;
}

function heroText() {
  if (!EXAM) return { headline: `Los geht's!`, sub: MANIFEST.about || '' };
  const dl = daysUntil(EXAM.date), k = EXAM.kind;
  const headline = dl > 1 ? `Noch <em>${dl} Tage</em> bis ${examArt.to} ${k}` : dl === 1 ? `<em>Morgen</em> ist ${k}` : dl === 0 ? `<em>Heute</em> ist ${k}!` : `${k} geschrieben`;
  const sub = dl >= 0 ? `${examDay}, ${shortDate(EXAM.date)} · ${MANIFEST.subject} · Thema: ${EXAM.topics}.` : 'Du kannst trotzdem weiter üben und spielen.';
  return { headline, sub };
}

function homeHtml() {
  touchDaily();
  const { headline, sub } = heroText();
  const nMist = Object.keys(state.mistakes).length;
  const done = WORLDS.reduce((s, t, ti) => s + t.levels.filter((_, l) => starsOf(ti, l) > 0).length, 0);
  const all = WORLDS.reduce((s, t) => s + t.levels.length, 0);
  return `
  <section class="hero">
    <div class="countdown">
      <div class="eyebrow">${MANIFEST.subject}${MANIFEST.grade ? ' ' + MANIFEST.grade : ''}</div>
      <h1>${headline}</h1>
      <p>${sub} <span class="hand">Du hast schon ${done} von ${all} Leveln geschafft.</span></p>
    </div>
    ${APP.heroArt ? `<div class="herobox" aria-hidden="true">${APP.heroArt()}</div>` : ''}
  </section>
  <div class="goalrow">
    <div class="tile">${ring(state.daily.xp / DAILY_GOAL)}<div><b>Tagesziel</b><span>${Math.min(state.daily.xp, DAILY_GOAL)} / ${DAILY_GOAL} XP heute</span></div></div>
    <button class="tile" data-act="mistakes"><div class="ico" style="background:var(--bad-soft);color:var(--bad)">${ICON.box}</div><div><b>Fehlerkiste</b><span>${nMist ? `${nMist} Fragen zum Reparieren` : 'Leer. Stark!'}</span></div></button>
    ${APP.exam ? `<button class="tile exam" data-act="exam"><div class="ico" style="background:var(--card);color:var(--ink)">${ICON.exam}</div><div><b>Probe-${examName}</b><span>${state.examBest ? `Beste Note: ${state.examBest}` : examDay ? `Teste dich wie am ${examDay}` : 'Teste dich wie in der echten Arbeit'}</span></div></button>` : ''}
  </div>
  ${WORLDS.map((t, ti) => worldHtml(t, ti)).join('')}
  ${GAMES.length ? `<p class="muted" style="text-align:center;margin-top:30px;font-size:14px">Je ${STARS_PER_TICKET} neue Sterne geben ein Spiel-Ticket für die Arcade. Ab ${GAMES[0].stars} Sternen wartet das erste Spiel.</p>` : ''}`;
}

function worldHtml(t, ti) {
  const got = t.levels.reduce((s, _, l) => s + starsOf(ti, l), 0), max = t.levels.reduce((a, lv) => a + maxStarsOf(lv), 0);
  const n = t.levels.length, cols = n <= 6 ? n : Math.ceil(n / 2), colsSm = n % 3 === 1 && n > 3 ? 4 : 3;
  let nextFound = false;
  const nodes = t.levels.map((lv, l) => {
    const st = starsOf(ti, l), unlocked = isUnlocked(ti, l);
    let cls = st ? 'done' : unlocked ? '' : 'locked';
    if (!st && unlocked && !nextFound) { cls = 'next'; nextFound = true; }
    return `<button class="node ${cls}" data-level="${ti}:${l}" ${unlocked ? '' : 'aria-disabled="true"'}>
      <span class="bubble">${unlocked ? (TYPE_ICON[lv.type] || TYPE_ICON.mc) : ICON.lock}</span>
      <span class="stars">${(lv.type === 'learn' ? [0] : [0, 1, 2]).map(i => ICON.star(i < st)).join('')}</span>
      <span class="lbl">${lv.title}</span></button>`;
  }).join('');
  return `<section class="world">
    <div class="world-head"><div class="world-art">${artOf(t.art)}</div>
      <div style="min-width:0"><span class="world-num">Welt ${ti + 1}</span><h2>${t.title}</h2><p>${t.sub}</p></div>
      <div class="world-prog">${got}/${max} ${ICON.star().replace('<svg', '<svg style="width:16px;height:16px;display:inline;vertical-align:-2px"')}<small>${worldDone(ti) ? 'komplett' : ''}</small></div></div>
    <div class="path" style="--cols:${cols};--cols-sm:${colsSm}">${nodes}</div></section>`;
}

function bindMain() {
  $$('#main [data-level]').forEach(b => b.onclick = () => {
    const [t, l] = b.dataset.level.split(':').map(Number);
    if (!isUnlocked(t, l)) { Sound.wrong(); toast('Noch gesperrt', 'Schaffe zuerst das Level davor.', ICON.lock); return; }
    Sound.click(); startLevel(t, l);
  });
  const mist = $('#main [data-act="mistakes"]'); if (mist) mist.onclick = () => startMistakes();
  const ex = $('#main [data-act="exam"]'); if (ex) ex.onclick = () => startExam();
  $$('#main [data-game]').forEach(b => b.onclick = () => tryGame(b.dataset.game));
  $$('#main [data-learnall]').forEach(b => b.onclick = () => startLevel(+b.dataset.learnall, 0));
}

// ---------------------------------------------------------------------------
// Stage (full-screen level view) and the feedback sheet
// ---------------------------------------------------------------------------
let run = null;
let keyHandler = null;

function openStage(inner) {
  closeStage();
  const st = document.createElement('div');
  st.className = 'stage'; st.id = 'stage';
  st.innerHTML = `<div class="stage-inner">${inner}</div><div class="sheet" id="sheet"><div class="sheet-inner"></div></div>`;
  document.body.appendChild(st);
  document.body.style.overflow = 'hidden';
  return st;
}
function closeStage() {
  const st = $('#stage'); if (st) st.remove();
  document.body.style.overflow = '';
  if (keyHandler) { removeEventListener('keydown', keyHandler); keyHandler = null; }
  if (run && run.cleanup) run.cleanup();
  Sound.stopRoar();
}
function onKey(fn) {
  if (keyHandler) removeEventListener('keydown', keyHandler);
  keyHandler = e => { if (!$('.modal') && e.target.tagName !== 'TEXTAREA') fn(e); };
  addEventListener('keydown', keyHandler);
}

function stageTop(progress, extra = '') {
  return `<div class="stage-top"><button class="iconbtn" id="quit" aria-label="Level verlassen">${ICON.close}</button>
    <div class="progress"><i style="width:${progress * 100}%"></i></div>${extra}</div>`;
}
function bindQuit() { $('#quit').onclick = () => { closeStage(); render(); }; }
function comboHtml() { return run && run.combo >= 3 ? `<span class="combo ${run.combo >= 6 ? 'hot' : ''}">Combo x${run.combo}</span>` : ''; }

function showSheet(ok, title, text, xp, onNext) {
  const sh = $('#sheet');
  sh.className = 'sheet show ' + (ok ? 'ok' : 'bad');
  $('.sheet-inner', sh).innerHTML = `<div class="txt"><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}${xp ? `<p class="xp">+${xp} XP</p>` : ''}</div><button class="btn ${ok ? 'go' : 'primary'}" id="nextBtn">Weiter</button>`;
  const go = () => { sh.className = 'sheet'; onNext(); };
  $('#nextBtn').onclick = go;
  $('#nextBtn').focus({ preventScroll: true });
  onKey(e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
}

// Single answer bookkeeping; returns XP earned.
function scoreAnswer(ok, ref, bonus = 0) {
  state.answered++;
  if (ok) {
    state.correct++;
    run.correct++; run.combo++;
    state.bestCombo = Math.max(state.bestCombo, run.combo);
    if (run.mode === 'mistakes') noteFixed(ref);
    const xp = 10 + (run.combo >= 6 ? 10 : run.combo >= 3 ? 5 : 0) + bonus;
    run.xp += xp;
    Sound.right();
    if (run.combo === 5 || run.combo === 10 || run.combo === 15) Confetti.burst(50, .5, .2);
    return xp;
  }
  run.combo = 0;
  noteMistake(ref);
  Sound.wrong();
  return 0;
}


// Level engines shared by all apps. Apps add their own types through APP.levelTypes.

// ---------------------------------------------------------------------------
// Dispatcher
// ---------------------------------------------------------------------------
function startLevel(t, l) {
  const lv = WORLDS[t].levels[l];
  run = { t, l, lv, mode: 'level', correct: 0, total: 0, combo: 0, xp: 0, errors: 0 };
  if (QUIZ_TYPES[lv.type]) {
    run.items = quizItems(t, l); run.total = run.items.length; run.i = 0; run.timer = lv.timer || 0;
    return quizStep();
  }
  const fn = { learn: learnLevel, match: matchLevel, sort: sortLevel, order: orderLevel, write: writeLevel, memory: memoryLevel, ...APP.levelTypes }[lv.type];
  fn();
}

function startMistakes() {
  const refs = Object.keys(state.mistakes);
  if (!refs.length) { toast('Fehlerkiste ist leer', 'Keine offenen Fehler. Weiter so!', ICON.check); return; }
  const items = shuffle(refs).slice(0, 12).map(itemFromRef).filter(Boolean);
  if (!items.length) { state.mistakes = {}; save(); render(); return; }
  run = { mode: 'mistakes', items, total: items.length, i: 0, correct: 0, combo: 0, xp: 0, title: 'Fehlerkiste' };
  quizStep();
}

// ---------------------------------------------------------------------------
// Quiz engine (mc, swipe and typed answers), also used for the mistake box and the exam
// ---------------------------------------------------------------------------
function quizStep() {
  if (run.i >= run.items.length) {
    if (run.mode === 'exam') return examWrite(0);
    return finish(run.correct / run.total);
  }
  const it = run.items[run.i];
  const title = run.mode === 'level' ? run.lv.title : run.title;
  const top = stageTop(run.i / run.total, run.mode === 'exam' ? '' : comboHtml());
  if (it.kind === 'swipe') return swipeStep(it, title, top);
  if (it.kind === 'type') return typeStep(it, title, top);
  openStage(`${top}
    ${run.timer && run.mode === 'level' ? '<div class="timer"><i id="tbar"></i></div>' : ''}
    <div class="qtitle">${title} · ${run.i + 1}/${run.total}</div>
    ${it.fig ? `<div class="figure ${it.figClass || ''}">${it.fig}</div>` : ''}
    <div class="question">${it.q}</div>
    <div class="options">${it.o.map((o, i) => `<button class="opt" data-i="${i}"><kbd>${i + 1}</kbd><span>${o}</span></button>`).join('')}</div>`);
  bindQuit();
  let answered = false, t0 = performance.now(), raf = 0;
  const choose = i => {
    if (answered) return; answered = true; cancelAnimationFrame(raf);
    const ok = i === it.a;
    const btns = $$('.opt');
    btns.forEach(b => b.disabled = true);
    if (run.mode === 'exam') {
      if (i >= 0) btns[i].style.borderColor = 'var(--accent)';
      run.answers.push({ it, i, ok }); if (ok) run.correct++; else noteMistake(it.ref);
      Sound.click();
      return setTimeout(() => { run.i++; quizStep(); }, 350);
    }
    if (i >= 0) btns[i].classList.add(ok ? 'right' : 'wrong');
    if (!ok) btns[it.a].classList.add('right');
    const fast = run.timer && (performance.now() - t0) / 1000 < run.timer / 2;
    const xp = scoreAnswer(ok, it.ref, ok && fast ? 5 : 0);
    const title = i < 0 ? 'Zeit abgelaufen!' : ok ? pick(PRAISE) + (fast ? ' Blitzschnell!' : '') : 'Nicht ganz.';
    showSheet(ok, title, (ok ? '' : `Richtig ist: <b>${it.o[it.a]}</b>. `) + (it.x || ''), xp, () => { run.i++; quizStep(); });
  };
  $$('.opt').forEach(b => b.onclick = () => choose(+b.dataset.i));
  onKey(e => { const n = +e.key; if (n >= 1 && n <= it.o.length) choose(n - 1); });
  if (run.timer && run.mode === 'level') {
    const bar = $('#tbar');
    const tick = () => {
      const p = (performance.now() - t0) / 1000 / run.timer;
      bar.style.transform = `scaleX(${1 - clamp(p, 0, 1)})`;
      if (p >= 1) return choose(-1);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    run.cleanup = () => cancelAnimationFrame(raf);
  }
}

// Swipe cards: right = yes (it.ok true), left = no.
function swipeVerdict(it) { return `Das ist <b>${(it.ok ? it.yes : it.no).toLowerCase()}</b>.`; }

function swipeStep(it, title, top) {
  const next = run.items[run.i + 1];
  openStage(`${top}
    <div class="qtitle">${title} · ${run.i + 1}/${run.total}</div>
    <div class="question" style="font-size:18px;font-weight:400;color:var(--ink-soft)">${it.prompt} Wische oder tippe.</div>
    <div class="swipe-wrap">
      ${next && next.kind === 'swipe' ? `<div class="scard back">${next.t}</div>` : ''}
      <div class="scard" id="card"><span class="stamp l">${it.no.toUpperCase()}</span><span class="stamp r">${it.yes.toUpperCase()}</span>${it.t}</div>
    </div>
    <div class="swipe-btns"><button class="btn" style="border-color:var(--bad);color:var(--bad)" id="sL">✖ ${it.no}</button><button class="btn" style="border-color:var(--good);color:var(--good)" id="sR">✔ ${it.yes}</button></div>`);
  bindQuit();
  const card = $('#card'); let done = false;
  const decide = yes => {
    if (done) return; done = true;
    card.style.transform = `translateX(${yes ? 140 : -140}%) rotate(${yes ? 24 : -24}deg)`; card.style.opacity = 0;
    const ok = yes === it.ok;
    if (run.mode === 'exam') {
      run.answers.push({ it, i: yes, ok }); if (ok) run.correct++; else noteMistake(it.ref);
      Sound.click(); return setTimeout(() => { run.i++; quizStep(); }, 350);
    }
    const xp = scoreAnswer(ok, it.ref);
    showSheet(ok, ok ? pick(PRAISE) : 'Nicht ganz.', `${swipeVerdict(it)} ${it.x}`, xp, () => { run.i++; quizStep(); });
  };
  $('#sL').onclick = () => decide(false);
  $('#sR').onclick = () => decide(true);
  onKey(e => { if (e.key === 'ArrowLeft') decide(false); if (e.key === 'ArrowRight') decide(true); });
  let sx = null;
  card.addEventListener('pointerdown', e => { sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', e => {
    if (sx === null) return; const dx = e.clientX - sx;
    card.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`;
    $('.stamp.l', card).style.opacity = clamp(-dx / 100, 0, 1); $('.stamp.r', card).style.opacity = clamp(dx / 100, 0, 1);
  });
  card.addEventListener('pointerup', e => {
    if (sx === null) return; const dx = e.clientX - sx; sx = null; card.style.transition = '';
    if (Math.abs(dx) > 90) decide(dx > 0); else { card.style.transform = ''; $$('.stamp', card).forEach(s => s.style.opacity = 0); }
  });
}

// Typed answers: it.fields is a list of inputs, each with a label, the solution
// shown afterwards (sol) and either accepted answers (accept, traps, strict) or
// its own judge(text) -> { ok, typo, hint }. Partly right items score pts < 1.
function typeStep(it, title, top) {
  const exam = run.mode === 'exam';
  openStage(`${top}
    <div class="qtitle">${title} · ${run.i + 1}/${run.total}</div>
    ${it.lead ? `<div class="type-lead">${it.lead}</div>` : ''}
    <div class="type-word">${it.q}</div>
    <form class="type-form" id="tform" autocomplete="off">
      ${it.fields.map((f, i) => `<label class="tfield"><span>${f.label}</span><input id="tf${i}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="${i < it.fields.length - 1 ? 'next' : 'done'}"></label>`).join('')}
      <div class="type-btns"><button class="btn primary" type="submit">${exam ? 'Weiter' : 'Prüfen'}</button><button class="btn" type="button" id="tskip">Weiß ich nicht</button></div>
    </form>`);
  bindQuit();
  const inputs = it.fields.map((_, i) => $('#tf' + i));
  inputs[0].focus({ preventScroll: true });
  inputs.forEach((inp, i) => inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && i < inputs.length - 1) { e.preventDefault(); inputs[i + 1].focus(); }
  }));
  let done = false;
  const check = skip => {
    if (done) return; done = true;
    const res = it.fields.map((f, i) => skip ? { ok: false } : f.judge ? f.judge(inputs[i].value) : judgeAnswer(inputs[i].value, f.accept, f.traps, f.strict));
    const pts = res.filter(r => r.ok).length / res.length, ok = pts === 1;
    inputs.forEach((inp, i) => { inp.readOnly = true; if (!exam) inp.classList.add(res[i].ok ? 'right' : 'wrong'); });
    $$('#tform button').forEach(b => b.disabled = true);
    if (exam) {
      run.answers.push({ it, ok, pts, given: inputs.map(x => x.value.trim()).filter(Boolean).join(' · ') });
      if (ok) run.correct++; else noteMistake(it.ref);
      Sound.click(); return setTimeout(() => { run.i++; quizStep(); }, 350);
    }
    const xp = scoreAnswer(ok, it.ref);
    const lines = it.fields.map((f, i) => res[i].ok && !res[i].typo ? '' :
      `${it.fields.length > 1 ? f.label + ': ' : ''}${res[i].ok ? 'Achte auf die Schreibweise:' : 'Richtig ist'} <b>${f.sol}</b>.${res[i].hint ? ' ' + res[i].hint : ''}`);
    showSheet(ok, ok ? pick(PRAISE) : pts > 0 ? 'Halb richtig.' : 'Nicht ganz.', [...lines, it.x].filter(Boolean).join('<br>'), xp, () => { run.i++; quizStep(); });
  };
  $('#tform').onsubmit = e => { e.preventDefault(); check(false); };
  $('#tskip').onclick = () => check(true);
}

// Case, ä/ae spellings, Latin length marks, punctuation and curly apostrophes do not count.
function normAnswer(s) {
  return norm(String(s).normalize('NFD').replace(/[\u0304\u0306]/g, '').normalize('NFC'))
    .replace(/[.,!?;:/„“"'’‘()]/g, ' ').replace(/\s+/g, ' ').trim();
}
function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// Judges one typed answer. Several answers separated by commas count if one of
// them is right. traps are known wrong answers ({ answers, hint }) that get a
// specific hint; unless strict, one typo in a longer word is accepted.
function judgeAnswer(text, accept, traps = [], strict = false) {
  const parts = [text, ...String(text).split(/[,;]| oder /)].map(normAnswer).filter(Boolean);
  const acc = accept.map(normAnswer);
  if (parts.some(p => acc.includes(p))) return { ok: true };
  for (const tr of traps) if (parts.some(p => tr.answers.map(normAnswer).includes(p))) return { ok: false, hint: tr.hint };
  if (!strict && parts.some(p => acc.some(a => a.length >= 5 && editDistance(a, p) <= 1))) return { ok: true, typo: true };
  return { ok: false };
}

// What the learner should have answered, for result lists.
function itemSolution(it) {
  if (it.kind === 'swipe') return swipeVerdict(it);
  if (it.kind === 'type') return 'Richtig: ' + it.fields.map(f => f.sol).join(' · ') + '.';
  return 'Richtig: ' + it.o[it.a] + '.';
}

// ---------------------------------------------------------------------------
// Finish & results
// ---------------------------------------------------------------------------
function starsFor(ratio) { return ratio >= .95 ? 3 : ratio >= .75 ? 2 : ratio >= .5 ? 1 : 0; }

async function finish(ratio) {
  if (run.cleanup) { run.cleanup(); run.cleanup = null; }
  const isLearn = run.mode === 'level' && run.lv.type === 'learn';
  const stars = run.mode === 'level' ? (isLearn ? 1 : starsFor(ratio)) : 0;
  let newStars = 0, earned = 0, prevTotal = totalStars(), wasDone = false;
  if (run.mode === 'level') {
    const k = levelKey(run.t, run.l), prev = state.levels[k] || { stars: 0 };
    wasDone = worldDone(run.t);
    newStars = Math.max(0, stars - prev.stars);
    state.levels[k] = { stars: Math.max(prev.stars, stars), best: Math.max(prev.best || 0, Math.round(ratio * 100)) };
    if (stars > 0) run.xp += 15 + stars * 10;
    state.starBank = (state.starBank || 0) + newStars;
    earned = grantTickets(Math.floor(state.starBank / STARS_PER_TICKET));
    state.starBank %= STARS_PER_TICKET;
  } else if (run.mode === 'mistakes') {
    run.xp += 10;
  }
  addXp(run.xp);
  const titles = ['Fast!', 'Geschafft!', 'Richtig gut!', 'Perfekt!'];
  const msg = isLearn ? 'Lernkarten geschafft. Jetzt wird geübt, und dabei gibt es bis zu 3 Sterne pro Level.' : run.mode === 'mistakes' ? `${run.correct} von ${run.total} Fehlern repariert.` :
    stars === 0 ? 'Für einen Stern brauchst du mindestens die Hälfte. Probier es gleich nochmal, du lernst bei jedem Versuch dazu.' :
      stars === 3 ? 'Alles richtig. Das sitzt!' : `${Math.round(ratio * 100)} % richtig.`;
  const hasNext = run.mode === 'level' && run.l + 1 < WORLDS[run.t].levels.length;
  openStage(`<div class="result">
    <p class="hand">${run.mode === 'level' ? run.lv.title : run.title}</p>
    <h1>${isLearn ? 'Gelernt!' : run.mode === 'level' ? titles[stars] : 'Repariert!'}</h1>
    ${run.mode === 'level' ? `<div class="bigstars">${(isLearn ? [0] : [0, 1, 2]).map(i => ICON.star(true).replace('<svg', `<svg data-s="${i}"`)).join('')}</div>` : '<div style="height:20px"></div>'}
    <p class="lead" style="margin:0 auto 10px">${msg}</p>
    <div class="rewards"><div class="reward">${APP.xpIcon || ICON.bolt}+${run.xp} XP</div>${earned ? `<div class="reward">${ICON.ticket}+${earned}</div>` : ''}</div>
    <div class="actions">
      ${run.mode === 'level' ? `<button class="btn" id="again">Nochmal</button>` : ''}
      ${hasNext && stars > 0 ? `<button class="btn go" id="nextLvl">Nächstes Level</button>` : ''}
      <button class="btn primary" id="toMap">Zum Lernpfad</button>
    </div></div>`);
  const svgs = $$('.bigstars svg');
  for (let i = 0; i < stars; i++) setTimeout(() => { svgs[i].classList.add('on'); Sound.tone(700 + i * 200, .15, 'triangle', .14); }, 300 + i * 350);
  if (stars >= 2 || (run.mode === 'mistakes' && run.correct)) setTimeout(() => Confetti.burst(stars === 3 ? 180 : 90), 300 + stars * 350);
  const ag = $('#again'); if (ag) ag.onclick = () => startLevel(run.t, run.l);
  const nx = $('#nextLvl'); if (nx) nx.onclick = () => startLevel(run.t, run.l + 1);
  $('#toMap').onclick = () => { closeStage(); render(); };
  onKey(e => { if (e.key === 'Enter') { e.preventDefault(); ($('#nextLvl') || $('#toMap')).click(); } });
  checkBadges(); save(); renderStatus();
  if (earned) setTimeout(() => { const c = $('#ticketChip'); if (c) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); } Sound.coin(); }, 300 + stars * 350);
  await sleep(500 + stars * 350);
  if (run.mode === 'level' && !wasDone && worldDone(run.t)) {
    const got = grantTickets(1); save(); renderStatus();
    Sound.fanfare(); Confetti.burst(220);
    const r = await modal(`<div style="width:100px;margin:0 auto;color:var(--ink)">${artOf(WORLDS[run.t].art)}</div><p class="hand">Welt ${run.t + 1} komplett!</p><h2>${WORLDS[run.t].title}</h2><p>Du hast alle Level dieser Welt geschafft. ${got ? 'Als Belohnung gibt es <b>+1 Spiel-Ticket</b>.' : ''}</p>`,
      GAMES.length ? [{ label: 'Ab in die Arcade', cls: 'go' }, { label: 'Weiterlernen', cls: '' }] : [{ label: 'Weiterlernen', cls: 'go' }]);
    if (r === 0 && GAMES.length) { closeStage(); tab = 'arcade'; render(); }
  }
  if (run.mode === 'level') await checkGameUnlocks(prevTotal);
}

// ---------------------------------------------------------------------------
// Learn cards. A card has a heading (h) and blocks: p, bullets, steps, list.
// APP.learnExtras(card, mode) adds app-specific blocks ({ top, bottom } HTML);
// mode is 'card' for the learn level and 'cheat' for the cheat sheet.
// ---------------------------------------------------------------------------
function learnBlocks(c, mode) {
  const ex = (APP.learnExtras && APP.learnExtras(c, mode)) || {};
  let b = '';
  if (c.p) b += `<p>${c.p}</p>`;
  if (ex.top) b += ex.top;
  if (c.bullets) b += `<ul>${c.bullets.map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (c.steps) b += `<ol>${c.steps.map(x => `<li>${x}</li>`).join('')}</ol>`;
  if (c.list) b += mode === 'card'
    ? `<div class="dev-grid">${c.list.map(x => `<div class="dev"><div class="a">${artOf(x.art)}</div><b>${x.t}</b><span>${x.d}</span></div>`).join('')}</div>`
    : `<ul>${c.list.map(x => `<li><b>${x.t}</b>: ${x.d}</li>`).join('')}</ul>`;
  if (ex.bottom) b += ex.bottom;
  return b;
}
function learnCardHtml(c) { return `<div class="learn-card"><h2>${c.h}</h2>${learnBlocks(c, 'card')}</div>`; }

function learnLevel(cards, title) {
  cards = cards || WORLDS[run.t].learn;
  let i = 0;
  const show = () => {
    openStage(`${stageTop((i + 1) / cards.length)}
      <div class="qtitle">${title || run.lv.title} · Karte ${i + 1}/${cards.length}</div>
      <div style="margin-top:10px">${learnCardHtml(cards[i])}</div>
      <div class="dots">${cards.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
      <div class="nav-row"><button class="btn" id="prev" ${i === 0 ? 'disabled' : ''}>Zurück</button><button class="btn ${i === cards.length - 1 ? 'go' : 'primary'}" id="fwd">${i === cards.length - 1 ? 'Verstanden!' : 'Weiter'}</button></div>`);
    bindQuit();
    const fwd = () => { Sound.click(); if (i < cards.length - 1) { i++; show(); $('#stage').scrollTop = 0; } else { run.correct = 1; run.total = 1; run.xp = 10; finish(1); } };
    const back = () => { if (i > 0) { i--; show(); } };
    $('#fwd').onclick = fwd; $('#prev').onclick = back;
    onKey(e => { if (e.key === 'ArrowRight' || e.key === 'Enter') fwd(); if (e.key === 'ArrowLeft') back(); });
  };
  show();
}

// ---------------------------------------------------------------------------
// Match pairs
// ---------------------------------------------------------------------------
function matchLevel() {
  const pairs = run.lv.pairs.map((p, i) => ({ ...p, id: i }));
  const left = shuffle(pairs), right = shuffle(pairs);
  let sel = null, done = 0;
  run.total = pairs.length;
  openStage(`${stageTop(0, '<span id="combo"></span>')}
    <div class="qtitle">${run.lv.title}</div><div class="question">${run.lv.prompt}</div>
    <div class="match"><div class="col">${left.map(p => `<button class="mcard" data-side="a" data-id="${p.id}">${p.art ? `<span class="mart">${artOf(p.art)}</span>` : ''}<span>${p.a}</span></button>`).join('')}</div>
    <div class="col">${right.map(p => `<button class="mcard" data-side="b" data-id="${p.id}"><span>${p.b}</span></button>`).join('')}</div></div>`);
  bindQuit();
  $$('.mcard').forEach(b => b.onclick = () => {
    if (b.classList.contains('ok')) return;
    if (!sel || sel.dataset.side === b.dataset.side) {
      if (sel) sel.classList.remove('sel');
      sel = b; b.classList.add('sel'); Sound.click(); return;
    }
    const ok = sel.dataset.id === b.dataset.id;
    if (ok) {
      [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); x.disabled = true; });
      done++; scoreAnswer(true);
      $('.progress i').style.width = `${done / pairs.length * 100}%`;
      $('#combo').innerHTML = comboHtml();
      if (done === pairs.length) setTimeout(() => finish(pairs.length / (pairs.length + run.errors)), 500);
    } else {
      run.errors++; scoreAnswer(false);
      [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 450); });
      $('#combo').innerHTML = '';
    }
    sel = null;
  });
}

// ---------------------------------------------------------------------------
// Sort into buckets
// ---------------------------------------------------------------------------
function sortLevel() {
  const items = shuffle(run.lv.items), buckets = run.lv.buckets;
  const placed = buckets.map(() => []);
  run.total = items.length; let i = 0;
  const show = () => {
    if (i >= items.length) return finish(run.correct / run.total);
    const it = items[i];
    openStage(`${stageTop(i / items.length, comboHtml())}
      <div class="qtitle">${run.lv.title} · ${i + 1}/${items.length}</div><div class="question" style="font-size:18px;font-weight:400;color:var(--ink-soft)">${run.lv.prompt}</div>
      <div class="sort-card" id="sc">${it.t}</div>
      <div class="buckets">${buckets.map((b, j) => `<button class="bucket" data-b="${j}"><span>${b}</span><span class="count">${placed[j].length}</span><span class="mini">${placed[j].slice(-4).map(x => `<span>${x}</span>`).join('')}</span></button>`).join('')}</div>`);
    bindQuit();
    const choose = j => {
      $$('.bucket').forEach(b => b.disabled = true);
      const ok = j === it.b;
      scoreAnswer(ok);
      const bi = buckets.length === 2 ? (j === 0 ? 0 : 2) : j;
      $('#sc').classList.add('fly-' + bi);
      if (ok) {
        placed[j].push(it.t);
        setTimeout(() => { i++; show(); }, 380);
      } else {
        placed[it.b].push(it.t);
        showSheet(false, 'Nicht ganz.', `„${it.t}“ gehört zu <b>${buckets[it.b]}</b>.`, 0, () => { i++; show(); });
      }
    };
    $$('.bucket').forEach(b => b.onclick = () => choose(+b.dataset.b));
    onKey(e => { const n = +e.key; if (n >= 1 && n <= buckets.length) choose(n - 1); });
  };
  show();
}

// ---------------------------------------------------------------------------
// Order (tap in sequence)
// ---------------------------------------------------------------------------
function orderLevel() {
  const items = run.lv.items, cards = shuffle(items.map((t, i) => ({ t, i })));
  let next = 0, hearts = 3;
  run.total = items.length;
  const hud = () => `<span class="hearts" id="hearts">${[0, 1, 2].map(i => ICON.heart(i < hearts)).join('')}</span>`;
  openStage(`${stageTop(0, hud())}
    <div class="qtitle">${run.lv.title}</div><div class="question">${run.lv.prompt}</div>
    <div class="order-list">${cards.map(c => `<button class="ocard" data-i="${c.i}"><span class="n"></span><span>${c.t}</span></button>`).join('')}</div>`);
  bindQuit();
  $$('.ocard').forEach(b => b.onclick = () => {
    if (b.classList.contains('placed') || hearts <= 0) return;
    if (+b.dataset.i === next) {
      b.classList.add('placed'); $('.n', b).textContent = next + 1; next++;
      scoreAnswer(true);
      $('.progress i').style.width = `${next / items.length * 100}%`;
      if (next === items.length) setTimeout(() => finish(1 - run.errors * .2), 450);
    } else {
      run.errors++; hearts--; scoreAnswer(false);
      b.classList.add('no'); setTimeout(() => b.classList.remove('no'), 450);
      $('#hearts').outerHTML = hud();
      if (hearts <= 0) {
        const sh = $('#sheet');
        showSheet(false, 'Keine Herzen mehr', `Die richtige Reihenfolge:<br>${items.map((t, i) => `${i + 1}. ${t}`).join('<br>')}`, 0, () => finish(0));
        sh.style.maxHeight = '70vh'; sh.style.overflowY = 'auto';
      } else {
        toast('Falsche Reihenfolge', `Gesucht ist Schritt ${next + 1}.`, ICON.heart(false));
      }
    }
  });
}

// ---------------------------------------------------------------------------
// Free-text answers with keyword check. Each entry of it.k is a group of
// accepted spellings; the first one is the label shown to the learner.
// ---------------------------------------------------------------------------
function keywordScore(text, groups) {
  const t = norm(' ' + text + ' ');
  const hits = groups.map(g => g.some(k => t.includes(norm(k))));
  return { hits, ratio: hits.filter(Boolean).length / groups.length };
}

function writeTask(it, header, onDone) {
  openStage(`${header}
    <div class="question">${it.q}</div>
    <textarea class="answer" id="ans" placeholder="Schreib deine Antwort hier rein, so wie in ${examArt.dat} ${examName} …"></textarea>
    <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button class="btn primary" id="check">Antwort prüfen</button><button class="btn" id="skip">Ich weiß es nicht</button></div>
    <div id="fb"></div>`);
  bindQuit();
  const ans = $('#ans'); ans.focus();
  try { const d = sessionStorage.getItem('draft:' + it.q); if (d) ans.value = d; } catch (e) { }
  ans.oninput = () => { try { sessionStorage.setItem('draft:' + it.q, ans.value); } catch (e) { } };
  const check = () => {
    const ks = keywordScore(ans.value, it.k);
    $('#check').disabled = true; $('#skip').disabled = true; ans.readOnly = true;
    $('#fb').innerHTML = `<div class="model"><h4>Musterlösung</h4><p>${it.m}</p>
      <div class="kw">${it.k.map((g, i) => `<span class="${ks.hits[i] ? 'hit' : 'miss'}">${ks.hits[i] ? '✔' : '✖'} ${g[0]}</span>`).join('')}</div>
      <p class="muted" style="font-size:14px;margin-top:8px">Du hast ${ks.hits.filter(Boolean).length} von ${it.k.length} Schlüsselbegriffen genannt. Vergleiche ehrlich mit der Musterlösung:</p></div>
      <div class="selfrate"><button class="btn go" data-r="1">Hatte ich fast alles</button><button class="btn warn" data-r=".5">Teilweise</button><button class="btn" data-r="0">Noch nicht</button></div>`;
    $$('.selfrate .btn').forEach(b => b.onclick = () => {
      try { sessionStorage.removeItem('draft:' + it.q); } catch (e) { }
      onDone((ks.ratio + +b.dataset.r) / 2, ans.value);
    });
    $('.selfrate .btn').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
  $('#check').onclick = check;
  $('#skip').onclick = () => { ans.value = ''; check(); };
}

function writeLevel() {
  const items = shuffle(run.lv.items); let i = 0, sum = 0;
  run.total = items.length;
  const show = () => {
    if (i >= items.length) return finish(sum / items.length);
    writeTask(items[i], `${stageTop(i / items.length)}<div class="qtitle">${run.lv.title} · ${i + 1}/${items.length} · Schreib wie in der Arbeit</div>`, score => {
      sum += score;
      const xp = 10 + Math.round(score * 20); run.xp += xp;
      if (score >= .75) { Sound.right(); run.correct++; } else Sound.click();
      showSheet(score >= .5, score >= .75 ? 'Sehr gut formuliert!' : score >= .5 ? 'Guter Anfang!' : 'Merk dir die Musterlösung.', score < .75 ? 'Tipp: Lies die Musterlösung laut vor und schreib sie einmal ab. So bleibt sie hängen.' : '', xp, () => { i++; show(); });
    });
  };
  show();
}

// ---------------------------------------------------------------------------
// Memory: find picture and name of the same thing (keys from lv.pool, see APP.entity)
// ---------------------------------------------------------------------------
function memoryLevel() {
  const keys = shuffle(run.lv.pool).slice(0, 6);
  const cards = shuffle(keys.flatMap(k => [{ k, pic: true }, { k, pic: false }]));
  let open = [], moves = 0, found = 0, lock = false;
  run.total = 6;
  openStage(`${stageTop(0, '<span class="chip" id="moves">0 Züge</span>')}
    <div class="qtitle">${run.lv.title}</div><div class="question" style="font-size:19px">Finde immer Bild und Namen, die zusammengehören.</div>
    <div class="memory">${cards.map((c, i) => `<button class="mem" data-i="${i}" aria-label="Karte"><span class="in"><span class="f">${APP.memoryBack || TYPE_ICON.memory}</span><span class="b">${c.pic ? artOf(c.k) : APP.entity(c.k).name}</span></span></button>`).join('')}</div>`);
  bindQuit();
  $$('.mem').forEach(b => b.onclick = () => {
    if (lock || b.classList.contains('open') || b.classList.contains('gone')) return;
    b.classList.add('open'); open.push(b); Sound.click();
    if (open.length < 2) return;
    moves++; $('#moves').textContent = `${moves} Züge`;
    const [a, c] = open.map(x => cards[+x.dataset.i]);
    if (a.k === c.k && a.pic !== c.pic) {
      open.forEach(x => { x.classList.add('gone'); x.classList.remove('open'); });
      open = []; found++; scoreAnswer(true);
      $('.progress i').style.width = `${found / 6 * 100}%`;
      const e = APP.entity(a.k);
      toast(e.name, e.info, `<span style="width:40px;height:40px;color:var(--paper)">${artOf(a.k)}</span>`);
      if (found === 6) setTimeout(() => finish(moves <= 10 ? 1 : moves <= 14 ? .8 : .55), 700);
    } else {
      lock = true; run.combo = 0;
      setTimeout(() => { open.forEach(x => x.classList.remove('open')); open = []; lock = false; }, 900);
    }
  });
}


// Mock exam: quiz items mixed from several worlds plus write tasks, graded at the end.
// APP.exam = { mix: { worldId: count, ... }, writes: n, art: artKey, types: [levelType, ...] }
// types optionally limits the quiz items to levels of these types.

function startExam() {
  const cfg = APP.exam, refs0 = allRefs();
  const ids = Object.keys(cfg.mix);
  const refs = shuffle(ids.flatMap(id => {
    const ti = WORLDS.findIndex(t => t.id === id);
    return shuffle(refs0.filter(r => r.t === ti && (!cfg.types || cfg.types.includes(r.type)))).slice(0, cfg.mix[id]).map(r => r.ref);
  }));
  const writes = shuffle(WORLDS.filter(t => ids.includes(t.id)).flatMap(t => t.levels.filter(lv => lv.type === 'write').flatMap(lv => lv.items))).slice(0, cfg.writes || 0);
  run = { mode: 'exam', items: refs.map(itemFromRef).filter(Boolean), writes, i: 0, correct: 0, combo: 0, xp: 0, answers: [], started: Date.now(), title: `Probe-${examName}` };
  run.total = run.items.length + run.writes.length;
  openStage(`<div class="result" style="padding-top:40px">
    <div style="width:120px;margin:0 auto;color:var(--ink)">${cfg.art ? artOf(cfg.art) : ICON.exam}</div>
    <h1>Probe-${examName}</h1>
    <p class="lead" style="margin:12px auto">${run.items.length} Aufgaben${writes.length ? ` und ${writes.length} Schreibaufgaben` : ''} aus allen Themen. Wie in der echten Arbeit gibt es erst am Ende die Auswertung, mit Note.</p>
    <div class="actions"><button class="btn warn" id="go">Los geht's</button><button class="btn" id="back">Zurück</button></div></div>`);
  $('#go').onclick = () => quizStep();
  $('#back').onclick = () => { closeStage(); render(); };
}

function examWrite(k) {
  if (k >= run.writes.length) return examResult();
  const it = run.writes[k];
  writeTask(it, `${stageTop((run.items.length + k) / run.total)}<div class="qtitle">Probe-${examName} · Schreibaufgabe ${k + 1}/${run.writes.length} · 3 Punkte</div>`, (score, text) => {
    run.answers.push({ write: true, it, score, text });
    examWrite(k + 1);
  });
}

// German school grades from the percentage of points.
function gradeFor(pct) { return pct >= 92 ? '1' : pct >= 81 ? '2' : pct >= 67 ? '3' : pct >= 50 ? '4' : pct >= 30 ? '5' : '6'; }

async function examResult() {
  const mcPts = run.answers.filter(a => !a.write).reduce((s, a) => s + (a.pts ?? (a.ok ? 1 : 0)), 0);
  const wPts = run.answers.filter(a => a.write).reduce((s, a) => s + a.score * 3, 0);
  const max = run.items.length + run.writes.length * 3;
  const pts = Math.round((mcPts + wPts) * 2) / 2, pct = Math.round(pts / max * 100), grade = gradeFor(pct);
  const mins = Math.max(1, Math.round((Date.now() - run.started) / 60000));
  const xp = 40 + mcPts * 5 + Math.round(wPts * 5);
  addXp(xp);
  if (!state.examBest || +grade < +state.examBest) state.examBest = grade;
  if (+grade <= 2) award('exam2');
  if (grade === '1') award('exam1');
  if (+grade <= 2) grantTickets(1);
  save();
  const wrong = run.answers.filter(a => !a.write && !a.ok);
  const ready = examDay && EXAM && daysUntil(EXAM.date) >= 0 ? `Du bist bereit für ${examDay}.` : 'Du bist bestens vorbereitet.';
  const [headline, advice] = { 1: ['Sehr gut!', ready], 2: ['Gut!', 'Schau dir die Fehler unten noch einmal an.'], 3: ['Befriedigend', 'Die Fehlerkiste hilft dir, die Lücken zu schließen.'], 4: ['Ausreichend', 'Übe die Welten nochmal, in denen du Fehler hattest.'], 5: ['Da geht noch was', 'Mach die Lernkarten nochmal und probiere es dann erneut.'], 6: ['Kein Problem, dafür ist die Probe da', 'Starte am besten mit den Lernkarten.'] }[grade];
  openStage(`<div class="result">
    <p class="hand">Probe-${examName} · ${mins} Min.</p>
    <div class="grade">${grade}</div>
    <h1>${headline}</h1>
    <p class="lead" style="margin:10px auto">${String(pts).replace('.', ',')} von ${max} Punkten (${pct} %). ${advice}</p>
    <div class="rewards"><div class="reward">+${xp} XP</div>${+grade <= 2 ? `<div class="reward">${ICON.ticket}+2</div>` : ''}</div>
    <div class="actions"><button class="btn primary" id="toMap">Zum Lernpfad</button><button class="btn" id="again">Neue Probe</button></div>
    ${wrong.length ? `<h2 class="section-title" style="text-align:left">Das solltest du dir nochmal anschauen</h2>
      <div class="options" style="text-align:left">${wrong.map(a => `<div class="opt" style="display:block;cursor:default"><b>${a.it.kind === 'swipe' ? a.it.t : a.it.q}</b><br>
      <span class="muted">${a.given ? `Deine Antwort: ${esc(a.given)}. ` : ''}${itemSolution(a.it)} ${a.it.x || ''}</span></div>`).join('')}</div>
      <p class="muted">Diese Fragen liegen jetzt in deiner Fehlerkiste.</p>` : ''}
  </div>`);
  $('#toMap').onclick = () => { closeStage(); render(); };
  $('#again').onclick = () => startExam();
  if (+grade <= 2) { Sound.fanfare(); Confetti.burst(220); } else Sound.tone(500, .2);
}


// Tab pages: cheat sheet, arcade and achievements.

function cheatHtml() {
  const when = examDay && EXAM && daysUntil(EXAM.date) >= 0 ? `für ${examDay}` : 'aus allen Welten';
  return `<h2 class="section-title">Spickzettel</h2><p class="lead">Alles Wichtige ${when} auf einen Blick. Am Abend vorher einmal durchlesen, am Morgen nochmal.</p>

}

function arcadeHtml() {
  if (!GAMES.length) return `<h2 class="section-title">Arcade</h2><p class="lead">In dieser App gibt es noch keine Spiele.</p>`;
  const ts = totalStars(), next = GAMES.find(g => g.stars > ts);
  return `<h2 class="section-title">Arcade</h2><p class="lead">Hier gibt es die Belohnung fürs Lernen, und jedes Spiel kostet ein Ticket. Ein Ticket bekommst du für je ${STARS_PER_TICKET} neue Sterne, für jede komplette Welt, fürs Tagesziel${APP.exam ? ` und für ${examArt.good} Probe-${examName}` : ''}. Mehr als ${TICKET_CAP} Tickets kannst du nicht ansparen.</p>
  <div class="ticketbar">${ICON.ticket}<div><b>${state.tickets} Ticket${state.tickets === 1 ? '' : 's'}</b><p>Du hast ${ts} ${ts === 1 ? 'Stern' : 'Sterne'}. Noch ${STARS_PER_TICKET - (state.starBank || 0)} neue ${STARS_PER_TICKET - (state.starBank || 0) === 1 ? 'Stern' : 'Sterne'} bis zum nächsten Ticket. ${next ? `Nächstes Spiel ab ${next.stars} Sternen.` : 'Alle Spiele sind freigeschaltet!'}</p></div></div>
  <div class="games">${GAMES.map(g => {
    const unlocked = ts >= g.stars;
    return `<button class="game ${unlocked ? '' : 'locked'}" data-game="${g.id}"><div class="thumb">${gameThumb(g.id)}</div><div class="body"><h3>${g.name}</h3><p>${g.desc}</p>
      <div class="meta"><span>${unlocked ? g.record(state.games[g.id] || 0) : `${ICON.lock.replace('<svg', '<svg style="width:16px;height:16px;display:inline;vertical-align:-3px"')} ab ${g.stars} Sternen`}</span><span>${unlocked ? '1 Ticket' : ''}</span></div></div></button>`;
  }).join('')}</div>`;
}

function tryGame(id) {
  const g = GAMES.find(x => x.id === id);
  if (totalStars() < g.stars) { Sound.wrong(); toast('Noch gesperrt', `Sammle ${g.stars} Sterne im Lernpfad.`, ICON.lock); return; }
  if (state.tickets < 1) { Sound.wrong(); toast('Keine Tickets', `Hol dir neue Sterne im Lernpfad, für je ${STARS_PER_TICKET} gibt es ein Ticket.`, ICON.ticket); return; }
  state.tickets--; save(); renderStatus();
  openGame(id);
}

function badgesHtml() {
  const acc = state.answered ? Math.round(state.correct / state.answered * 100) : 0;
  const cols = ['var(--gold)', 'var(--accent-2)', 'var(--good-soft)', 'var(--bad-soft)'];
  return `<h2 class="section-title">Erfolge</h2><p class="lead">Deine Statistik und alle Abzeichen. Schaffst du alle ${BADGES.length}?</p>
  <div class="statgrid">
    <div class="stat"><b>${state.xp}</b><span>XP gesamt</span></div>
    <div class="stat"><b>${totalStars()}/${maxStars()}</b><span>Sterne</span></div>
    <div class="stat"><b>${acc} %</b><span>richtig beantwortet (${state.answered} Fragen)</span></div>
    <div class="stat"><b>${state.bestCombo}</b><span>beste Combo</span></div>
    ${APP.exam ? `<div class="stat"><b>${state.examBest || '–'}</b><span>beste Probe-Note</span></div>` : ''}
  </div>
  <div class="badges">${BADGES.map((b, i) => `<div class="badge ${state.badges[b.id] ? '' : 'off'}"><div class="medal">${ICON.medal(cols[i % 4], 'var(--ink)')}</div><b>${b.name}</b><span>${b.desc}</span></div>`).join('')}</div>
  <div style="margin-top:30px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn small" id="resetBtn">Fortschritt zurücksetzen</button>
  </div>`;
}

document.addEventListener('click', async e => {
  if (e.target.id !== 'resetBtn') return;
  const r = await modal('<h2>Wirklich alles löschen?</h2><p>XP, Sterne, Tickets und Abzeichen werden auf null gesetzt.</p>', [{ label: 'Abbrechen', cls: 'primary' }, { label: 'Ja, zurücksetzen', cls: '' }]);
  if (r === 1) { Object.assign(state, defaultState()); save(); render(); }
});


// ---------------------------------------------------------------------------
// Endless runner engine (jump & run) shared by themed games. One ticket = 3 runs.
// A theme names the game and draws its world:
//   { id, title, intro, collected(n), badge, dust,
//     obstacles: { kind: { w, h, vx, from } },   vx: extra speed towards the player,
//                                                from: run time (s) before it can appear
//     items: { coin, power } particle colors,
//     drawBg(ctx, g, V), drawPlayer(ctx, g, alive), drawObstacle(ctx, g, o), drawItem(ctx, g, it) }
// ---------------------------------------------------------------------------
function runnerGame(area, hud, T) {
  const { ctx, size, dispose } = setupCanvas(area);
  let tries = 3, raf = 0, last = 0, g = null, alive = false;
  // Logical view: the world is drawn scaled up on tall screens so the runner stays readable.
  const V = { W: 0, H: 0, k: 1 };
  const view = () => { V.k = clamp(size.H / 430, 1, 1.9); V.W = size.W / V.k; V.H = size.H / V.k; };
  view();

  const newRun = () => {
    const H = V.H;
    g = { t: 0, speed: 330, dist: 0, score: 0, coins: 0, obs: [], items: [], parts: [], next: 1.2, nextItem: 2.5, shield: false, shake: 0,
      p: { x: V.W * .18, y: 0, vy: 0, jumps: 0, w: 34, h: 52 }, ground: H * .8, bg: 0 };
    g.p.y = g.ground - g.p.h;
  };
  const jump = () => {
    if (!alive) return;
    if (g.p.jumps < 2) { g.p.vy = g.p.jumps ? -560 : -640; g.p.jumps++; Sound.tone(g.p.jumps === 1 ? 420 : 620, .1, 'square', .05, 0, 800); }
  };
  const spawnObstacle = () => {
    const k = pick(Object.keys(T.obstacles).filter(k => g.t >= (T.obstacles[k].from || 0)));
    const o = T.obstacles[k];
    g.obs.push({ k, x: V.W + 30, w: o.w, h: o.h, vx: o.vx || 0, ph: Math.random() * 6 });
    const gap = clamp(1.25 - g.t * .012, .62, 1.25);
    g.next = gap + Math.random() * .8;
  };
  const spawnItem = () => {
    const power = !g.shield && Math.random() < .25;
    g.items.push({ k: power ? 'power' : 'coin', x: V.W + 30, y: g.ground - 80 - Math.random() * 110, r: 14 });
    g.nextItem = 1.4 + Math.random() * 2;
  };
  const burst = (x, y, n, c, up = 200) => { for (let i = 0; i < n; i++) g.parts.push({ x, y, vx: Math.random() * 200 - 100, vy: Math.random() * -up, life: .6, c }); };
  const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  const end = () => {
    alive = false;
    const score = Math.floor(g.score);
    const isNew = recordGame(T.id, score);
    if (score >= 500 && T.badge) award(T.badge);
    tries--;
    Sound.tone(300, .3, 'sawtooth', .08, 0, 90);
    overlay(area, `<p class="hand" style="color:#FFC21A">${isNew ? 'Neuer Rekord!' : 'Autsch!'}</p><h2>${score} Punkte</h2><p>Rekord: ${state.games[T.id]} · ${T.collected(g.coins)}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">${tries > 0 ? `<button class="btn go" id="rAgain">Nochmal (${tries} übrig)</button>` : ''}<button class="btn" id="rBack">Zurück</button></div>
      ${tries <= 0 ? '<p>Für weitere Läufe brauchst du ein neues Ticket.</p>' : ''}`);
    if (isNew) Confetti.burst(100);
    const again = $('#rAgain'); if (again) again.onclick = start;
    $('#rBack').onclick = () => { closeGame(); render(); };
  };
  const start = () => { hideOverlay(area); newRun(); alive = true; last = performance.now(); Sound.whistle(); };

  const loop = now => {
    const dt = Math.min(.033, (now - last) / 1000 || 0); last = now;
    view();
    if (g) { g.ground = V.H * .8; g.p.x = V.W * .18; if (!alive && g.p.jumps === 0) g.p.y = g.ground - g.p.h; }
    if (g && alive) {
      g.t += dt; g.speed = 330 + g.t * 9; g.bg += g.speed * dt; g.score += dt * 10 + g.speed * dt * .02;
      const p = g.p, falling = p.vy > 0;
      p.vy += 1700 * dt; p.y += p.vy * dt;
      if (p.y >= g.ground - p.h) {
        if (falling && p.jumps && T.dust) burst(p.x + 17, g.ground - 2, 8, T.dust, 120);
        p.y = g.ground - p.h; p.vy = 0; p.jumps = 0;
      }
      g.next -= dt; if (g.next <= 0) spawnObstacle();
      g.nextItem -= dt; if (g.nextItem <= 0) spawnItem();
      const box = { x: p.x + 6, y: p.y + 4, w: p.w - 10, h: p.h - 6 };
      for (const o of g.obs) {
        o.x -= (g.speed + o.vx) * dt;
        if (!o.hit && hit(box, { x: o.x + 4, y: g.ground - o.h + 4, w: o.w - 8, h: o.h - 4 })) {
          o.hit = true;
          if (g.shield) { g.shield = false; g.shake = .3; Sound.tone(800, .15, 'square', .06, 0, 300); }
          else { g.shake = .4; end(); break; }
        }
      }
      g.obs = g.obs.filter(o => o.x > -120);
      for (const it of g.items) {
        it.x -= g.speed * dt;
        if (!it.got && Math.hypot(it.x - (p.x + 17), it.y - (p.y + 26)) < 34) {
          it.got = true;
          if (it.k === 'coin') { g.score += 25; g.coins++; Sound.coin(); } else { g.shield = true; Sound.tone(700, .2, 'triangle', .1, 0, 1200); }
          burst(it.x, it.y, 10, T.items[it.k]);
        }
      }
      g.items = g.items.filter(it => it.x > -40 && !it.got);
      if (T.dust && p.jumps === 0 && Math.random() < dt * 14) burst(p.x + 8, g.ground - 2, 1, T.dust, 60);
    }
    if (g) {
      ctx.save(); ctx.scale(V.k, V.k);
      if (g.shake > 0) { g.shake -= dt; ctx.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10); }
      T.drawBg(ctx, g, V); g.obs.forEach(o => T.drawObstacle(ctx, g, o)); g.items.forEach(it => T.drawItem(ctx, g, it)); T.drawPlayer(ctx, g, alive);
      for (const pt of g.parts) { pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vy += 500 * dt; pt.life -= dt; ctx.globalAlpha = Math.max(0, pt.life / .6); ctx.fillStyle = pt.c; ctx.fillRect(pt.x, pt.y, 4, 4); }
      ctx.globalAlpha = 1; g.parts = g.parts.filter(pt => pt.life > 0);
      ctx.restore();
      ctx.font = '700 22px "Dela Gothic One", sans-serif'; ctx.textAlign = 'right';
      ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillText(Math.floor(g.score), size.W - 14, 36);
      ctx.fillStyle = '#fff'; ctx.fillText(Math.floor(g.score), size.W - 16, 34);
      hud(`Rekord ${state.games[T.id] || 0}`);
    }
    raf = requestAnimationFrame(loop);
  };
  newRun();
  overlay(area, `<h2>${T.title}</h2>${T.intro}<p><b>Springen:</b> Leertaste, Pfeil hoch oder tippen. Zweimal drücken für einen Doppelsprung.</p><button class="btn go" id="rGo" style="margin-top:12px">Start (3 Läufe)</button>`);
  $('#rGo').onclick = start;
  const key = e => { if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); jump(); } };
  const tap = e => { if (e.target.closest('.overlay')) return; e.preventDefault(); jump(); };
  addEventListener('keydown', key); area.addEventListener('pointerdown', tap);
  raf = requestAnimationFrame(loop);
  return () => { cancelAnimationFrame(raf); removeEventListener('keydown', key); area.removeEventListener('pointerdown', tap); dispose(); };
}

// ---------------------------------------------------------------------------
// Lab Runner: through the chemistry lab, over burners, beakers, acid and gas bottles.
// ---------------------------------------------------------------------------
const LAB_RUNNER = {
  id: 'runner', title: 'Lab Runner', badge: 'runner500',
  intro: '<p>Lauf durchs Labor! Springe über Brenner, Bechergläser, Säurepfützen und Gasflaschen. Sammle Atome für Punkte, eine Schutzbrille schützt dich einmal.</p>',
  collected: n => `${n} Atome gesammelt`,
  obstacles: { burner: { w: 30, h: 62 }, beakers: { w: 46, h: 40 }, acid: { w: 86, h: 12 }, cylinder: { w: 34, h: 96, from: 12 } },
  items: { coin: '#5CE1E6', power: '#7CF29A' },
  drawBg(ctx, g, V) {
    const { W, H } = V;
    const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#16224A'); sky.addColorStop(1, '#24366B');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    // wall tiles
    ctx.strokeStyle = 'rgba(255,255,255,.04)'; ctx.lineWidth = 1;
    const off = (g.bg * .2) % 48;
    for (let x = -off; x < W; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, g.ground); ctx.stroke(); }
    for (let y = 0; y < g.ground; y += 48) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    // shelves with flasks (parallax)
    const so = (g.bg * .45) % 320;
    for (let x = -so; x < W + 320; x += 320) {
      const y = g.ground - 170;
      ctx.fillStyle = '#31437C'; ctx.fillRect(x + 20, y, 200, 8);
      const cols = ['#5CE1E6', '#FFC21A', '#FF6B8A', '#7CF29A'];
      for (let i = 0; i < 4; i++) {
        const fx = x + 40 + i * 46; ctx.fillStyle = cols[i];
        ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(fx, y); ctx.lineTo(fx + 8, y - 20); ctx.lineTo(fx + 8, y - 30); ctx.lineTo(fx + 16, y - 30); ctx.lineTo(fx + 16, y - 20); ctx.lineTo(fx + 24, y); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    // floor
    ctx.fillStyle = '#0F1836'; ctx.fillRect(0, g.ground, W, H - g.ground);
    ctx.fillStyle = '#FFC21A'; ctx.fillRect(0, g.ground, W, 4);
    const fo = g.bg % 60; ctx.fillStyle = 'rgba(255,255,255,.07)';
    for (let x = -fo; x < W; x += 60) ctx.fillRect(x, g.ground + 18, 30, 4);
  },
  drawPlayer(ctx, g, alive) {
    const p = g.p, run = alive && p.jumps === 0, ph = g.t * 14;
    ctx.save(); ctx.translate(p.x, p.y);
    // legs
    ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const l1 = run ? Math.sin(ph) * 9 : -4, l2 = run ? -Math.sin(ph) * 9 : 6;
    ctx.beginPath(); ctx.moveTo(12, 40); ctx.lineTo(12 + l1, 52); ctx.moveTo(22, 40); ctx.lineTo(22 + l2, 52); ctx.stroke();
    // coat
    ctx.fillStyle = '#F4F6FA'; rrect(ctx, 4, 18, 26, 26, 6); ctx.fill();
    ctx.fillStyle = '#2257E6'; ctx.fillRect(15, 20, 4, 22);
    // arm
    ctx.strokeStyle = '#F4F6FA'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(18, 24); ctx.lineTo(30, 30 + (run ? Math.cos(ph) * 5 : -6)); ctx.stroke();
    // head
    ctx.fillStyle = '#FFD6B0'; ctx.beginPath(); ctx.arc(18, 10, 11, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5A3A22'; ctx.beginPath(); ctx.arc(16, 4, 10, Math.PI, Math.PI * 2); ctx.fill();
    // goggles
    ctx.fillStyle = g.shield ? '#7CF29A' : '#7FD3FF'; rrect(ctx, 14, 6, 17, 7, 3); ctx.fill();
    ctx.strokeStyle = '#1B1B2F'; ctx.lineWidth = 1.5; ctx.stroke();
    if (g.shield) { ctx.strokeStyle = 'rgba(124,242,154,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(17, 26, 36, 0, Math.PI * 2); ctx.stroke(); }
    ctx.restore();
  },
  drawObstacle(ctx, g, o) {
    const y = g.ground - o.h;
    if (o.k === 'burner') {
      ctx.fillStyle = '#9AA6BB'; ctx.fillRect(o.x + 10, y + 22, 10, o.h - 30);
      ctx.fillStyle = '#5E6A82'; ctx.fillRect(o.x, g.ground - 8, o.w, 8);
      const f = Math.sin(g.t * 30) * 3;
      ctx.fillStyle = '#FF8A1F'; ctx.beginPath(); ctx.moveTo(o.x + 6, y + 24); ctx.quadraticCurveTo(o.x + 15 + f, y - 10, o.x + 15, y - 4); ctx.quadraticCurveTo(o.x + 15 - f, y - 10, o.x + 24, y + 24); ctx.fill();
      ctx.fillStyle = '#FFD24A'; ctx.beginPath(); ctx.moveTo(o.x + 10, y + 24); ctx.quadraticCurveTo(o.x + 15, y + 4, o.x + 20, y + 24); ctx.fill();
    } else if (o.k === 'beakers') {
      ctx.fillStyle = 'rgba(200,230,255,.25)'; ctx.strokeStyle = '#CFE3FF'; ctx.lineWidth = 2;
      [[0, 0, 22, 40], [24, 12, 22, 28]].forEach(([dx, dy, w, h]) => { ctx.fillRect(o.x + dx, y + dy, w, h); ctx.strokeRect(o.x + dx, y + dy, w, h); });
      ctx.fillStyle = '#FF6B8A'; ctx.fillRect(o.x + 1, y + 20, 20, 19); ctx.fillStyle = '#5CE1E6'; ctx.fillRect(o.x + 25, y + 26, 20, 13);
    } else if (o.k === 'acid') {
      ctx.fillStyle = '#7CF29A'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, g.ground - 4, o.w / 2, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#B8FFC9'; for (let i = 0; i < 3; i++) { const bx = o.x + 16 + i * 26, by = g.ground - 8 - ((g.t * 40 + i * 13) % 18); ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill(); }
    } else if (o.k === 'cylinder') {
      ctx.fillStyle = '#C9302C'; rrect(ctx, o.x, y + 10, o.w, o.h - 10, 10); ctx.fill();
      ctx.fillStyle = '#333'; ctx.fillRect(o.x + 11, y, 12, 12);
      ctx.fillStyle = '#fff'; ctx.save(); ctx.translate(o.x + o.w / 2, y + 50); ctx.rotate(Math.PI / 4); ctx.fillRect(-9, -9, 18, 18); ctx.restore();
    }
  },
  drawItem(ctx, g, it) {
    ctx.save(); ctx.translate(it.x, it.y + Math.sin(g.t * 4 + it.x * .01) * 5);
    if (it.k === 'coin') {
      ctx.strokeStyle = '#5CE1E6'; ctx.lineWidth = 2;
      for (let a = 0; a < 3; a++) { ctx.beginPath(); ctx.ellipse(0, 0, 15, 6, a * Math.PI / 3 + g.t, 0, Math.PI * 2); ctx.stroke(); }
      ctx.fillStyle = '#FFC21A'; ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = '#7FD3FF'; rrect(ctx, -16, -7, 32, 14, 6); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#1B1B2F'; ctx.fillRect(-2, -5, 4, 10);
    }
    ctx.restore();
  },
};


// ---------------------------------------------------------------------------
// Legionärslauf: a legionary runs along the Via Appia towards Rome at sunset,
// over amphorae, milestones, palisades and broken columns, while chariots come
// the other way. Gold coins give points, a laurel wreath protects once.
// Uses the runner engine in runner.js.
// ---------------------------------------------------------------------------
const LEGION_RUN = (() => {
  const PI = Math.PI;
  // Deterministic noise so scenery tiles look the same every time they scroll by.
  const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  // Calls fn(x, i) for every tile of a layer that scrolled by `off`.
  const strip = (off, period, W, fn) => { for (let i = Math.floor(off / period) - 1; i * period - off < W + period; i++) fn(i * period - off, i); };
  const linGrad = (ctx, x0, y0, x1, y1, stops) => { const gr = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => gr.addColorStop(i / (stops.length - 1), c)); return gr; };
  const glow = (ctx, x, y, r, inner, outer) => { const gr = ctx.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, inner); gr.addColorStop(1, outer); ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2); };
  // Arch-shaped sub-path (opening at the bottom), used with evenodd fills.
  const arch = (ctx, x, base, w, h) => { ctx.moveTo(x, base); ctx.lineTo(x, base - h + w / 2); ctx.arc(x + w / 2, base - h + w / 2, w / 2, PI, 0); ctx.lineTo(x + w, base); ctx.closePath(); };

  // --- scenery -------------------------------------------------------------
  const cloud = (ctx, x, y, w) => {
    ctx.fillStyle = 'rgba(255,196,186,.28)';
    ctx.beginPath(); ctx.ellipse(x, y, w, w * .16, 0, 0, PI * 2); ctx.ellipse(x - w * .3, y - w * .1, w * .4, w * .16, 0, 0, PI * 2); ctx.ellipse(x + w * .25, y - w * .12, w * .35, w * .15, 0, 0, PI * 2); ctx.fill();
  };
  const cypress = (ctx, x, base, w, h) => { ctx.beginPath(); ctx.ellipse(x, base - h / 2, w / 2, h / 2, 0, 0, PI * 2); ctx.fill(); };
  const colosseum = (ctx, x, base, w, h, holes) => {
    ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - h); ctx.quadraticCurveTo(x + w * .32, base - h - 7, x + w * .62, base - h);
    ctx.lineTo(x + w * .68, base - h * .84); ctx.lineTo(x + w * .76, base - h * .9); ctx.lineTo(x + w * .86, base - h * .66); ctx.lineTo(x + w, base - h * .6); ctx.lineTo(x + w, base); ctx.fill();
    const fill = ctx.fillStyle; ctx.fillStyle = holes; ctx.beginPath();
    const bay = (w - 12) / 14, aw = bay * .58;
    for (let r = 0; r < 3; r++) for (let a = 0; a < 14; a++) {
      const ax = x + 6 + a * bay + (bay - aw) / 2, rel = (ax - x) / w;
      if ((r === 2 && rel > .6) || (r === 1 && rel > .84)) continue;
      arch(ctx, ax, base - h * .06 - r * h * .27, aw, h * .19);
    }
    ctx.fill(); ctx.fillStyle = fill;
  };
  const temple = (ctx, x, base, w, h, holes) => {
    ctx.fillRect(x, base - h * .14, w, h * .14);
    ctx.beginPath(); ctx.moveTo(x - 3, base - h * .72); ctx.lineTo(x + w / 2, base - h); ctx.lineTo(x + w + 3, base - h * .72); ctx.fill();
    ctx.fillRect(x - 2, base - h * .76, w + 4, h * .1);
    const fill = ctx.fillStyle; ctx.fillStyle = holes;
    for (let i = 0; i < 5; i++) ctx.fillRect(x + w * .08 + i * w * .18 + w * .06, base - h * .66, w * .07, h * .52);
    ctx.fillStyle = fill;
  };
  const pantheon = (ctx, x, base, w, h) => {
    ctx.fillRect(x, base - h * .55, w, h * .55);
    ctx.beginPath(); ctx.arc(x + w / 2, base - h * .55, w * .42, PI, 0); ctx.fill();
  };
  const farCity = (ctx, x, base, i, holes) => {
    ctx.fillStyle = '#93506F';
    cypress(ctx, x + 40, base, 9, 40); cypress(ctx, x + 54, base, 7, 30);
    colosseum(ctx, x + 80, base, 200, 62, holes);
    ctx.fillStyle = '#93506F';
    temple(ctx, x + 330, base, 74, 52, holes);
    pantheon(ctx, x + 450, base, 60, 50);
    cypress(ctx, x + 530, base, 8, 36); cypress(ctx, x + 546, base, 10, 46);
    if (hash(i) > .4) { temple(ctx, x + 640, base, 50, 36, holes); }
    cypress(ctx, x + 760, base, 9, 34);
  };
  const aqueduct = (ctx, x, base) => {
    const len = 534, top = base - 150;
    ctx.fillStyle = linGrad(ctx, 0, top, 0, base, ['#B9655E', '#9A4C55', '#6E3449']);
    ctx.beginPath(); ctx.rect(x, top, len, base - top);
    for (let i = 0; i < 9; i++) arch(ctx, x + 12 + i * 58, base, 46, 80);
    for (let i = 0; i < 18; i++) arch(ctx, x + 10.5 + i * 29, base - 98, 20, 34);
    ctx.fill('evenodd');
    // sunlit edges of the water channel and the cornice between the tiers
    ctx.fillStyle = '#EBA677'; ctx.fillRect(x, top, len, 3); ctx.fillRect(x, base - 100, len, 2);
    ctx.fillStyle = 'rgba(60,20,40,.25)'; ctx.fillRect(x, top + 3, len, 4);
  };
  const umbrellaPine = (ctx, x, base, s) => {
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 5 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, base); ctx.quadraticCurveTo(x - 4 * s, base - 50 * s, x + 12 * s, base - 92 * s); ctx.stroke();
    ctx.lineWidth = 3 * s; ctx.beginPath(); ctx.moveTo(x + 5 * s, base - 70 * s); ctx.lineTo(x + 26 * s, base - 92 * s); ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + 12 * s, base - 98 * s, 38 * s, 11 * s, 0, 0, PI * 2);
    ctx.ellipse(x - 12 * s, base - 94 * s, 20 * s, 8 * s, 0, 0, PI * 2);
    ctx.ellipse(x + 38 * s, base - 94 * s, 18 * s, 7 * s, 0, 0, PI * 2);
    ctx.ellipse(x + 16 * s, base - 106 * s, 24 * s, 7 * s, 0, 0, PI * 2);
    ctx.fill();
  };
  const tomb = (ctx, x, base) => {
    ctx.fillRect(x, base - 26, 60, 26);
    ctx.fillRect(x + 8, base - 56, 44, 30);
    for (let i = 0; i < 6; i++) ctx.fillRect(x + 8 + i * 8, base - 61, 5, 6);
  };
  const bush = (ctx, x, base, w) => { ctx.beginPath(); ctx.ellipse(x, base - w * .28, w * .5, w * .3, 0, 0, PI * 2); ctx.ellipse(x + w * .35, base - w * .2, w * .32, w * .22, 0, 0, PI * 2); ctx.fill(); };

  // --- obstacles -----------------------------------------------------------
  const amphora = (ctx, cx, by, h, rot) => {
    ctx.save(); ctx.translate(cx, by); ctx.rotate(rot);
    ctx.fillStyle = linGrad(ctx, -h * .3, 0, h * .3, 0, ['#8E3B22', '#E08451', '#A84B2A']);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-h * .4, -h * .26, -h * .32, -h * .72, -h * .1, -h * .78); ctx.lineTo(-h * .07, -h * .95);
    ctx.lineTo(h * .07, -h * .95); ctx.lineTo(h * .1, -h * .78); ctx.bezierCurveTo(h * .32, -h * .72, h * .4, -h * .26, 0, 0); ctx.fill();
    ctx.fillStyle = '#C96A3E'; ctx.fillRect(-h * .1, -h, h * .2, h * .07);
    ctx.strokeStyle = '#8E3B22'; ctx.lineWidth = 2.2; ctx.beginPath();
    ctx.moveTo(-h * .07, -h * .9); ctx.quadraticCurveTo(-h * .3, -h * .92, -h * .2, -h * .68);
    ctx.moveTo(h * .07, -h * .9); ctx.quadraticCurveTo(h * .3, -h * .92, h * .2, -h * .68); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,20,10,.4)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-h * .25, -h * .55); ctx.quadraticCurveTo(0, -h * .5, h * .25, -h * .55); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,225,190,.55)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-h * .17, -h * .66); ctx.quadraticCurveTo(-h * .23, -h * .42, -h * .09, -h * .2); ctx.stroke();
    ctx.restore();
  };
  const stake = (ctx, x0, y0, x1, y1) => {
    const len = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / len, uy = (y1 - y0) / len;
    ctx.lineCap = 'butt'; ctx.lineWidth = 4.5;
    ctx.strokeStyle = '#8A5A33'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * 6, y1 - uy * 6); ctx.stroke();
    ctx.fillStyle = '#E2C08F'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * 7 - uy * 2.4, y1 - uy * 7 + ux * 2.4); ctx.lineTo(x1 - ux * 7 + uy * 2.4, y1 - uy * 7 - ux * 2.4); ctx.fill();
  };
  const horse = (ctx, x, base, ph) => {
    const c = '#6E4326', dark = '#2E1B10';
    // legs: a galloping cycle, front pair and hind pair out of phase
    ctx.lineCap = 'round'; ctx.lineWidth = 3;
    [[13, 0, '#563318'], [33, 2.2, '#563318'], [17, 1, c], [37, 3.2, c]].forEach(([lx, off, col]) => {
      const a = Math.sin(ph + off) * .7, kx = x + lx + Math.sin(a) * 7, ky = base - 15;
      ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(x + lx, base - 27); ctx.lineTo(kx, ky); ctx.lineTo(kx + Math.sin(a * 1.6) * 6, base - 3); ctx.stroke();
      ctx.fillStyle = dark; ctx.fillRect(kx + Math.sin(a * 1.6) * 6 - 2, base - 4, 4, 3);
    });
    // tail
    ctx.strokeStyle = dark; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + 39, base - 34); ctx.quadraticCurveTo(x + 48, base - 34 + Math.sin(ph) * 3, x + 50, base - 22); ctx.stroke();
    // body, neck and head
    ctx.fillStyle = linGrad(ctx, 0, base - 40, 0, base - 22, ['#8A5634', c, '#4E2E18']);
    ctx.beginPath(); ctx.ellipse(x + 25, base - 31, 16, 8.5, 0, 0, PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 16, base - 37); ctx.lineTo(x + 5, base - 52); ctx.lineTo(x + 1, base - 48); ctx.lineTo(x + 10, base - 28); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 1, base - 47, 8, 3.8, -.55, 0, PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 5, base - 53); ctx.lineTo(x + 7, base - 58); ctx.lineTo(x + 8, base - 52); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 6, base - 53); ctx.quadraticCurveTo(x + 11, base - 44, x + 17, base - 38); ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x + 1, base - 49, 1, 0, PI * 2); ctx.fill();
    // red plume on the bridle
    ctx.fillStyle = '#E0352B'; ctx.beginPath(); ctx.ellipse(x + 6, base - 58, 2, 4, -.3, 0, PI * 2); ctx.fill();
  };
  const chariot = (ctx, g, o, gr) => {
    const x = o.x, ph = g.t * 18 + o.ph;
    // dust kicked up behind the wheel
    for (let i = 0; i < 4; i++) { const k = (g.t * 3 + i * .25) % 1; ctx.fillStyle = `rgba(214,170,120,${.35 * (1 - k)})`; ctx.beginPath(); ctx.arc(x + 74 + k * 30, gr - 4 - k * 10, 4 + k * 9, 0, PI * 2); ctx.fill(); }

    ctx.strokeStyle = '#4A2A16'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 28, gr - 36); ctx.lineTo(x + 54, gr - 22); ctx.stroke();
    ctx.strokeStyle = '#2E1B10'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 2, gr - 46); ctx.quadraticCurveTo(x + 30, gr - 52, x + 60, gr - 41); ctx.stroke();
    // charioteer
    ctx.fillStyle = '#E8DCC6'; rrect(ctx, x + 58, gr - 46, 10, 14, 3); ctx.fill();
    ctx.fillStyle = '#E5A87A'; ctx.beginPath(); ctx.arc(x + 62, gr - 50, 4.2, 0, PI * 2); ctx.fill();
    ctx.fillStyle = '#D9A441'; ctx.beginPath(); ctx.arc(x + 62.5, gr - 50.5, 4.6, PI, 0); ctx.fill();
    ctx.fillStyle = '#E0352B'; ctx.beginPath(); ctx.moveTo(x + 58, gr - 53); ctx.quadraticCurveTo(x + 63, gr - 60, x + 68, gr - 53); ctx.fill();
    // chariot box: curved red front with a gold rim
    ctx.fillStyle = linGrad(ctx, x + 52, 0, x + 78, 0, ['#8E1C17', '#D0362C', '#9E211B']);
    ctx.beginPath(); ctx.moveTo(x + 52, gr - 14); ctx.quadraticCurveTo(x + 50, gr - 34, x + 58, gr - 36); ctx.lineTo(x + 78, gr - 30); ctx.lineTo(x + 78, gr - 14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#F0C24B'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.fillStyle = '#F0C24B'; ctx.beginPath(); ctx.arc(x + 62, gr - 24, 2.4, 0, PI * 2); ctx.fill();

    const wx = x + 64, wy = gr - 12, rot = -g.t * 14;
    ctx.strokeStyle = '#3E2614'; ctx.lineWidth = 1.6; ctx.beginPath();
    for (let s = 0; s < 6; s++) { const a = rot + s * PI / 3; ctx.moveTo(wx, wy); ctx.lineTo(wx + Math.cos(a) * 11, wy + Math.sin(a) * 11); }
    ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(wx, wy, 11.5, 0, PI * 2); ctx.stroke();
    ctx.fillStyle = '#F0C24B'; ctx.beginPath(); ctx.arc(wx, wy, 2.6, 0, PI * 2); ctx.fill();
  };

  // --- the legionary -------------------------------------------------------
  const leg = (ctx, a, col) => {
    const hx = 15, hy = 38, kx = hx + Math.sin(a) * 7, ky = hy + Math.cos(a) * 7;
    const sa = a - (a < 0 ? .9 : .15), fx = kx + Math.sin(sa) * 7, fy = Math.min(52, ky + Math.cos(sa) * 7);
    ctx.strokeStyle = col; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();

    ctx.fillStyle = '#4E2C14'; rrect(ctx, fx - 2.5, fy - 2.5, 8, 3.2, 1.4); ctx.fill();
    ctx.strokeStyle = '#4E2C14'; ctx.lineWidth = 1; ctx.beginPath();
    for (let k = .55; k < 1; k += .2) { const sx = kx + (fx - kx) * k, sy = ky + (fy - ky) * k; ctx.moveTo(sx - 2.2, sy); ctx.lineTo(sx + 2.2, sy - 1); }
