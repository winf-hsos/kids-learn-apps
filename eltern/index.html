<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eltern-Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20100%20100%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%0A%20%20%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%2315213F%22/%3E%0A%20%20%3Crect%20x%3D%2218%22%20y%3D%2218%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%232257E6%22/%3E%0A%20%20%3Crect%20x%3D%2254%22%20y%3D%2218%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%23FFC21A%22/%3E%0A%20%20%3Crect%20x%3D%2218%22%20y%3D%2254%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%2312995A%22/%3E%0A%20%20%3Crect%20x%3D%2254%22%20y%3D%2254%22%20width%3D%2228%22%20height%3D%2228%22%20rx%3D%227%22%20fill%3D%22%23D7263D%22/%3E%0A%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Dela+Gothic+One&family=Gochi+Hand&family=Patrick+Hand&display=swap">
<style>
/* Shared design for all learning apps: one centered column on graph paper like a school notebook,
   sticky status bar and fixed tab bar. Apps override the color tokens in their own styles.css. */
:root {
  --paper: #F4F7FC;
  --grid: #DCE4F3;
  --card: #FFFFFF;
  --ink: #15213F;
  --ink-soft: #55648A;
  --line: #CDD7EA;
  --accent: #2257E6;
  --accent-soft: #DFE8FF;
  --accent-2: #8FE3FF;
  --gold: #FFC21A;
  --gold-ink: #1C1600;
  --bad: #D7263D;
  --bad-soft: #FDE3E6;
  --good: #12995A;
  --good-soft: #DAF4E7;
  --pen: #1F3FB0;
  --accent-strong: #2257E6;
  --go-strong: #12995A;
  --shadow: 0 2px 0 var(--line), 0 10px 24px -14px rgba(21, 33, 63, .35);
  --f-display: 'Dela Gothic One', 'Arial Black', Impact, system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-hand: 'Gochi Hand', 'Comic Sans MS', 'Segoe Print', cursive;
  /* calmer handwriting for what learners type, easier to read than --f-hand */
  --f-write: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive;
  /* page background and the decorative stripe on hero cards; apps swap these for their own look */
  --paper-pattern: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  --paper-size: 24px 24px;
  --stripe: repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--gold-ink) 10px 20px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1527; --grid: #18233D; --card: #152039; --ink: #EAF0FD; --ink-soft: #9DAED2; --line: #2A3A60;
    --accent: #7097FF; --accent-soft: #1E2C57; --accent-2: #A8ECFF; --gold: #FFC93D; --gold-ink: #1C1600;
    --bad: #FF5D70; --bad-soft: #3D1A24; --good: #34D08C; --good-soft: #11392A; --pen: #96B2FF; --accent-strong: #3B63E0; --go-strong: #148A55;
    --shadow: 0 2px 0 #0A1020, 0 10px 24px -14px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1527; --grid: #18233D; --card: #152039; --ink: #EAF0FD; --ink-soft: #9DAED2; --line: #2A3A60;
  --accent: #7097FF; --accent-soft: #1E2C57; --accent-2: #A8ECFF; --gold: #FFC93D; --gold-ink: #1C1600;
  --bad: #FF5D70; --bad-soft: #3D1A24; --good: #34D08C; --good-soft: #11392A; --pen: #96B2FF; --accent-strong: #3B63E0; --go-strong: #148A55;
  --shadow: 0 2px 0 #0A1020, 0 10px 24px -14px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: var(--paper-pattern);
  background-size: var(--paper-size);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.12; margin: 0; text-wrap: balance; letter-spacing: .01em; }
svg { display: block; }

.app { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 110px; }

/* ---------- status bar ---------- */
.status {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 2px solid var(--line);
  display: flex; align-items: center; gap: 12px;
}
.rank { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.rank-badge { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-strong); color: #fff; display: grid; place-items: center; font-family: var(--f-display); font-size: 18px; flex: none; }
.rank-text { min-width: 0; flex: 1; }
.rank-name { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xpbar { height: 10px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; margin-top: 4px; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 99px; transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.chips { display: flex; gap: 6px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 99px; background: var(--paper); border: 2px solid var(--line); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip svg { width: 18px; height: 18px; }
.chip.pop { animation: pop .5s; }
.iconbtn { border: 2px solid var(--line); background: var(--paper); border-radius: 12px; width: 38px; height: 38px; display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
a.iconbtn { color: inherit; text-decoration: none; }

/* ---------- tab bar ---------- */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--card); border-top: 2px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; justify-content: center; gap: 4px;
}
.tabs button { flex: 1; max-width: 160px; border: 0; background: none; padding: 6px 4px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.tabs button svg { width: 26px; height: 26px; }
.tabs button[aria-current="true"] { color: var(--accent); background: var(--accent-soft); }

/* ---------- home ---------- */
.hero { margin-top: 18px; display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: stretch; }
.countdown {
  position: relative; padding: 18px 20px 18px 22px; border-radius: 18px; background: var(--card); box-shadow: var(--shadow);
  border: 3px solid var(--ink); overflow: hidden; min-width: 0;
}
.countdown::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--stripe); }
.countdown.with-img { --hero-h: clamp(140px, 32vw, 230px); }
.countdown.with-img::before { top: calc(var(--hero-h) + 3px); }
.hero-img { display: block; width: calc(100% + 42px); max-width: none; height: var(--hero-h); margin: -18px -20px 14px -22px; object-fit: cover; object-position: var(--hero-pos, center); border-bottom: 3px solid var(--ink); }
.countdown .eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
.countdown h1 { font-size: clamp(26px, 6vw, 40px); margin-top: 4px; }
.countdown h1 em { font-style: normal; color: var(--accent); }
.countdown p { margin: 8px 0 0; color: var(--ink-soft); max-width: 46ch; }
.hand { font-family: var(--f-hand); color: var(--pen); font-size: 1.15em; }
.herobox { width: 120px; border-radius: 18px; background: #0B1020; display: grid; place-items: end center; padding-bottom: 8px; box-shadow: var(--shadow); overflow: hidden; }
.herobox svg { width: 100%; height: 150px; }
.goalrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.tile { background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); border: 2px solid var(--line); display: flex; gap: 12px; align-items: center; min-width: 0; text-align: left; }
button.tile:hover { border-color: var(--accent); }
.tile b { display: block; font-size: 15px; }
.tile span { display: block; font-size: 13px; color: var(--ink-soft); }
.tile .ring { width: 46px; height: 46px; flex: none; }
.tile .ico { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; }
.tile .ico svg { width: 26px; height: 26px; }
.tile.exam { border-color: var(--ink); background: var(--gold); color: var(--gold-ink); }
.tile.exam span { color: var(--gold-ink); opacity: .8; }

/* endless trainer */
.tr-top { background: var(--good); } .tr-good { background: var(--gold); } .tr-weak { background: var(--bad); } .tr-new { background: var(--line); }
.tr-bar { display: flex; gap: 3px; height: 14px; border-radius: 99px; overflow: hidden; background: var(--line); }
.tr-bar i { display: block; min-width: 6px; }
.trainer-tile { display: grid; gap: 8px; width: 100%; margin-top: 12px; padding: 14px 16px; text-align: left; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--shadow); color: var(--ink); }
.trainer-tile:hover { border-color: var(--accent); }
.tt-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.tt-head b { font-family: var(--f-display); font-size: 20px; }
.tt-head span, .tt-go { font-size: 14px; color: var(--ink-soft); }
.trainer { text-align: center; padding-top: 20px; max-width: 560px; margin: 0 auto; }
.trainer h1 { font-size: clamp(30px, 7vw, 44px); }
.trainer .tr-bar { height: 20px; margin: 16px 0 12px; }
.tr-round { margin: 6px auto 0; }
.tr-legend { display: grid; gap: 6px; text-align: left; }
.tr-legend div { display: grid; grid-template-columns: 14px 34px 1fr auto; align-items: center; gap: 10px; font-size: 16px; }
.tr-legend i, .tr-list summary i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.tr-legend b { text-align: right; font-variant-numeric: tabular-nums; }
.tr-legend em { font-style: normal; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.tr-stars { display: flex; gap: 10px; align-items: center; text-align: left; margin: 16px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--paper); border: 2px solid var(--line); font-size: 15px; }
.tr-stars svg { width: 28px; height: 28px; flex: none; }
.tr-how { color: var(--ink-soft); font-size: 15px; text-align: left; margin: 16px 0; }
.trainer .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
.tr-list { text-align: left; border-top: 2px solid var(--line); padding: 10px 0; }
.tr-list summary { cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.tr-words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tr-words span { padding: 4px 10px; border-radius: 10px; background: var(--paper); border: 2px solid var(--line); font-weight: 700; }
.tr-words small, .toast small { font-weight: 400; color: var(--ink-soft); }
.trainer-chip svg { width: 18px; height: 18px; }

.world { margin-top: 30px; }
.world-head { display: flex; align-items: center; gap: 14px; }
.world-art { width: 64px; height: 64px; flex: none; background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 6px; color: var(--ink); box-shadow: var(--shadow); }
.world-art:has(.wimg) { width: 76px; height: 76px; padding: 0; overflow: hidden; }
.wimg { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; border-radius: 13px; }
.world-head h2 { font-size: clamp(20px, 4.4vw, 26px); }
.world-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
.world-num { font-family: var(--f-hand); color: var(--pen); font-size: 20px; }
.world-prog { margin-left: auto; text-align: right; font-weight: 700; font-size: 14px; flex: none; }
.world-prog small { display: block; color: var(--ink-soft); font-weight: 400; }
.path { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 14px 10px; margin-top: 16px; padding: 16px; background: color-mix(in srgb, var(--card) 70%, transparent); border: 2px dashed var(--line); border-radius: 20px; }
.node { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; border: 0; background: none; padding: 4px; text-align: center; }
.node .bubble { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform .15s; position: relative; color: var(--ink); }
.node .bubble svg { width: 34px; height: 34px; }
.node:hover .bubble { transform: translateY(-3px); }
.node:active .bubble { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.node.done .bubble { background: var(--accent-strong); color: #fff; }
.node.next .bubble { background: var(--gold); color: var(--gold-ink); animation: bob 1.6s ease-in-out infinite; }
.node.locked { cursor: not-allowed; }
.node.locked .bubble { background: var(--paper); border-color: var(--line); box-shadow: 0 5px 0 var(--line); color: var(--ink-soft); }
.node .lbl { font-size: 13px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; hyphens: auto; max-width: 100%; }
.node.locked .lbl { color: var(--ink-soft); }
.stars { display: flex; gap: 1px; }
.stars svg { width: 16px; height: 16px; }

/* ---------- generic ---------- */
.btn { border: 3px solid var(--ink); background: var(--card); color: var(--ink); padding: 12px 20px; border-radius: 14px; font-weight: 700; font-size: 17px; box-shadow: 0 4px 0 var(--ink); transition: transform .08s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.primary { background: var(--accent-strong); color: #fff; }
.btn.go { background: var(--go-strong); color: #fff; }
.btn.warn { background: var(--gold); color: var(--gold-ink); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.small { padding: 8px 14px; font-size: 15px; }
.muted { color: var(--ink-soft); }
.section-title { font-size: clamp(24px, 5vw, 32px); margin: 24px 0 6px; }
.lead { color: var(--ink-soft); margin: 0 0 16px; max-width: 60ch; }

/* ---------- level screen ---------- */
.stage { position: fixed; inset: 0; z-index: 40; background: var(--paper); background-image: var(--paper-pattern); background-size: var(--paper-size); overflow-y: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.stage-inner { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 180px; }
.stage-top { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; padding: 10px 0; background: var(--paper); z-index: 2; }
.progress { flex: 1; height: 16px; border-radius: 99px; background: var(--card); border: 2px solid var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 99px; transition: width .4s; }
.combo { font-family: var(--f-display); color: var(--gold-ink); background: var(--gold); border-radius: 10px; padding: 3px 10px; font-size: 15px; white-space: nowrap; }
.combo.hot { animation: pulse .8s infinite; }
.timer { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 4px 0 10px; }
.timer i { display: block; height: 100%; background: var(--bad); transform-origin: left; }
.qtitle { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 10px; }
.question { font-size: clamp(21px, 4.4vw, 27px); font-weight: 700; margin: 6px 0 18px; text-wrap: balance; line-height: 1.3; }
.options { display: grid; gap: 10px; }
.opt { text-align: left; border: 3px solid var(--line); background: var(--card); border-radius: 16px; padding: 14px 16px; font-size: 18px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 0 var(--line); transition: transform .08s, border-color .15s; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt kbd { font-family: var(--f-body); font-size: 13px; font-weight: 700; border: 2px solid var(--line); border-radius: 8px; width: 28px; height: 28px; display: grid; place-items: center; flex: none; color: var(--ink-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); animation: shake .4s; }
.opt[disabled] { cursor: default; }
.figure { width: min(220px, 60vw); aspect-ratio: 1; margin: 0 auto 18px; background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 18px; color: var(--ink); box-shadow: var(--shadow); max-width: 100%; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; transform: translateY(110%); transition: transform .3s cubic-bezier(.2, .9, .3, 1.1); padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); border-top: 3px solid var(--ink); }
.sheet.show { transform: none; }
.sheet.ok { background: var(--good-soft); }
.sheet.bad { background: var(--bad-soft); }
.sheet-inner { max-width: 760px; margin: 0 auto; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.sheet h3 { font-size: 22px; }
.sheet.ok h3 { color: var(--good); }
.sheet.bad h3 { color: var(--bad); }
.sheet p { margin: 4px 0 0; }
.sheet .txt { flex: 1; min-width: 220px; }
.sheet .xp { font-family: var(--f-display); color: var(--accent); }

/* match */
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px 14px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.mcard { border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; align-items: center; gap: 10px; min-height: 58px; font-size: 16px; box-shadow: 0 3px 0 var(--line); }
.mcard .mart { width: 40px; height: 40px; flex: none; color: var(--ink); }
.mcard.sel { border-color: var(--accent); background: var(--accent-soft); }
.mcard.ok { border-color: var(--good); background: var(--good-soft); opacity: .55; cursor: default; }
.mcard.no { border-color: var(--bad); animation: shake .4s; }

/* swipe */
.swipe-wrap { position: relative; height: 300px; margin: 10px auto 20px; max-width: 460px; }
.scard { position: absolute; inset: 0; background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 28px; display: grid; place-items: center; text-align: center; font-size: clamp(20px, 4.5vw, 25px); font-weight: 700; box-shadow: var(--shadow); touch-action: pan-y; user-select: none; transition: transform .35s, opacity .35s; }
.scard .stamp { position: absolute; top: 16px; font-family: var(--f-display); font-size: 22px; padding: 4px 12px; border: 4px solid; border-radius: 10px; opacity: 0; transition: opacity .1s; }
.scard .stamp.l { left: 16px; color: var(--bad); transform: rotate(-12deg); }
.scard .stamp.r { right: 16px; color: var(--good); transform: rotate(12deg); }
.scard.back { transform: scale(.94) translateY(14px); opacity: .6; }
.swipe-btns { display: flex; gap: 12px; justify-content: center; }
.swipe-btns .btn { flex: 1; max-width: 220px; }

/* sort */
.sort-card { margin: 14px auto 22px; max-width: 420px; background: var(--card); border: 3px solid var(--ink); border-radius: 20px; padding: 26px 20px; text-align: center; font-size: 22px; font-weight: 700; box-shadow: var(--shadow); min-height: 120px; display: grid; place-items: center; }
.sort-card.fly-0 { animation: fly0 .4s forwards; } .sort-card.fly-1 { animation: fly1 .4s forwards; } .sort-card.fly-2 { animation: fly2 .4s forwards; }
.buckets { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.bucket { border: 3px dashed var(--ink-soft); background: var(--card); border-radius: 18px; padding: 14px; min-height: 120px; text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.bucket:hover { border-color: var(--accent); border-style: solid; }
.bucket .count { font-family: var(--f-display); font-size: 26px; color: var(--accent); }
.bucket .mini { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.bucket .mini span { font-size: 12px; font-weight: 400; background: var(--accent-soft); border-radius: 6px; padding: 2px 6px; }

/* order */
.order-list { display: grid; gap: 10px; }
.ocard { text-align: left; border: 3px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 17px; display: flex; gap: 12px; align-items: center; box-shadow: 0 3px 0 var(--line); }
.ocard .n { width: 32px; height: 32px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 700; flex: none; }
.ocard.placed { border-color: var(--good); background: var(--good-soft); cursor: default; }
.ocard.placed .n { background: var(--good); color: #fff; border: 0; }
.ocard.no { border-color: var(--bad); animation: shake .4s; }
.hearts { display: flex; gap: 4px; }
.hearts svg { width: 24px; height: 24px; }

/* write */
.answer { width: 100%; min-height: 140px; border: 3px solid var(--line); border-radius: 16px; padding: 14px; font: inherit; font-size: 18px; background: var(--card); color: var(--ink); resize: vertical; font-family: var(--f-write); font-size: 20px; }
.type-lead { font-size: 17px; color: var(--ink-soft); margin-top: 4px; }
.type-word { font-family: var(--f-display); font-size: clamp(30px, 8vw, 46px); line-height: 1.15; margin: 8px 0 18px; overflow-wrap: anywhere; }
.type-word small { display: block; font-family: var(--f-body); font-size: 16px; font-weight: 400; color: var(--ink-soft); margin-top: 6px; }
.type-form { display: grid; gap: 12px; }
.tfield { display: grid; gap: 4px; font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); }
.tfield input { width: 100%; border: 3px solid var(--line); border-radius: 14px; padding: 12px 14px; font: inherit; font-family: var(--f-write); font-size: 24px; letter-spacing: .02em; text-transform: none; background: var(--card); color: var(--ink); }
.tfield input:focus { outline: none; border-color: var(--accent); }
.tfield input.right { border-color: var(--good); background: var(--good-soft); }
.tfield input.wrong { border-color: var(--bad); background: var(--bad-soft); animation: shake .4s; }
.type-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.model { margin-top: 16px; padding: 16px; border-radius: 16px; background: var(--card); border: 3px solid var(--good); }
.model h4 { margin: 0 0 6px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--good); }
.kw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.kw span { border-radius: 99px; padding: 3px 10px; font-size: 14px; font-weight: 700; border: 2px solid; }
.kw .hit { color: var(--good); border-color: var(--good); background: var(--good-soft); }
.kw .miss { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.selfrate { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.points { display: grid; gap: 8px; }
.points label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); cursor: pointer; }
.points input { width: 22px; height: 22px; flex: none; margin-top: 1px; accent-color: var(--good); }

/* ---------- more answer kinds (items.js) ---------- */
.qimg { margin: 6px 0 14px; }
.qimg img, .hint img { display: block; max-width: 100%; max-height: 300px; margin: 0 auto; border-radius: 14px; border: 3px solid var(--ink); background: #fff; cursor: zoom-in; }
.hint-row { margin: 14px 0 4px; }
.hint-row .btn svg { width: 20px; height: 20px; }
.hint { margin-top: 10px; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--gold) 22%, var(--card)); border: 2px solid var(--gold); }
.hint p { margin: 0 0 6px; }
.hint .src { font-size: 14px; color: var(--ink-soft); }
.zoom { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, .85); display: grid; place-items: center; gap: 12px; padding: 16px; grid-template-rows: 1fr auto; }
.zoom img { max-width: 100%; max-height: 82vh; object-fit: contain; border-radius: 10px; background: #fff; }
.bd-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.bd-chip, .bd-slot, .bd-gap, .bd-l, .bd-r, .bd-grow .seg button { border: 3px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 17px; font-weight: 700; box-shadow: 0 3px 0 var(--line); text-align: left; }
.bd-chip[disabled] { opacity: .3; box-shadow: none; }
.bd-picked { display: grid; gap: 8px; min-height: 56px; padding: 10px; border: 2px dashed var(--line); border-radius: 14px; }
.bd-slot { border-color: var(--accent); }
.bd-pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bd-pairs .col { display: grid; gap: 8px; align-content: start; }
.bd-l, .bd-r { display: flex; gap: 8px; align-items: center; font-size: 16px; }
.bd-l.sel { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 20%, var(--card)); }
.tag { min-width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 14px; flex: none; }
.tag:empty { background: var(--paper); }
.bd-groups { display: grid; gap: 10px; }
.bd-grow { display: grid; gap: 6px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); }
.bd-grow > span { font-weight: 700; }
.bd-grow .seg { display: flex; flex-wrap: wrap; gap: 6px; }
.bd-grow .seg button { padding: 6px 12px; font-size: 15px; }
.bd-grow .seg button.on { border-color: var(--accent); background: var(--accent-soft); }
.bd-cloze { font-size: 20px; line-height: 2.1; }
.bd-gap { padding: 2px 12px; font-size: 18px; margin: 0 2px; border-style: dashed; }
.bd-gap.filled { border-style: solid; border-color: var(--accent); }
.bd-multi.on { border-color: var(--accent); background: var(--accent-soft); }
.bd-multi.on kbd { background: var(--accent); color: #fff; border-color: var(--accent); }
.bd-slot.right, .bd-gap.right, .bd-l.right, .bd-grow.right, .bd-multi.right { border-color: var(--good); background: var(--good-soft); }
.bd-slot.wrong, .bd-gap.wrong, .bd-l.wrong, .bd-grow.wrong, .bd-multi.wrong { border-color: var(--bad); background: var(--bad-soft); }
.bd-multi.missed { border-color: var(--good); border-style: dashed; }

/* ---------- parents' view (parents.js) ---------- */
.ptable { overflow-x: auto; }
.ptable table { width: 100%; border-collapse: collapse; font-size: 15px; background: var(--card); border-radius: 14px; overflow: hidden; }
.ptable th, .ptable td { padding: 8px 10px; border-bottom: 2px solid var(--line); text-align: left; }
.plist { display: grid; gap: 10px; padding-left: 22px; }
.plist .muted { font-size: 14px; }
.pbtns { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.pcode { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
.bad-text { color: var(--bad); font-weight: 700; }



/* memory */
.memory { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mem { aspect-ratio: 1; perspective: 600px; border: 0; padding: 0; background: none; }
.mem .in { display: block; position: relative; width: 100%; height: 100%; transition: transform .4s; transform-style: preserve-3d; }
.mem.open .in, .mem.gone .in { transform: rotateY(180deg); }
.mem .f, .mem .b { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 3px solid var(--ink); display: grid; place-items: center; padding: 6px; }
.mem .f { background: var(--accent); background-image: repeating-linear-gradient(45deg, transparent 0 8px, rgba(255, 255, 255, .12) 8px 16px); }
.mem .f svg { width: 40%; color: #fff; }
.mem .b { background: var(--card); transform: rotateY(180deg); font-weight: 700; font-size: clamp(11px, 2.6vw, 15px); text-align: center; color: var(--ink); line-height: 1.15; }
.mem .b svg { width: 80%; }
.mem.gone .b { border-color: var(--good); background: var(--good-soft); }

/* learn */
.learn-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 10px; margin-top: 10px; min-height: 40px; }
.learn-head .qtitle { margin-top: 0; flex: 1 1 220px; }
.read-ctrl { flex: none; display: flex; gap: 6px; margin-left: auto; }
.read-rate { min-width: 54px; padding-left: 8px; padding-right: 8px; font-variant-numeric: tabular-nums; }
.read-aloud { flex: none; } .read-aloud svg { width: 20px; height: 20px; }
.read-aloud.on { background: var(--accent-strong); color: #fff; }
.learn-card { background: var(--card); border: 3px solid var(--ink); border-radius: 22px; padding: 22px; box-shadow: var(--shadow); }
.learn-card h2 { font-size: clamp(22px, 4.8vw, 30px); margin-bottom: 10px; }
.learn-card p { font-size: 18px; margin: 0; max-width: 62ch; }
.learn-card ul, .learn-card ol { margin: 6px 0 0; padding-left: 22px; display: grid; gap: 8px; font-size: 17px; }
.learn-card ol li::marker { font-family: var(--f-display); color: var(--accent); }
.dev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.dev { border: 2px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; background: var(--paper); }
.dev .a { width: 74px; height: 74px; margin: 0 auto 6px; color: var(--ink); }
.dev b { display: block; font-size: 15px; }
.dev span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.dots { display: flex; gap: 6px; justify-content: center; margin: 16px 0; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--accent); width: 26px; border-radius: 99px; }
.nav-row { display: flex; justify-content: space-between; gap: 12px; }

/* results */
.result { text-align: center; padding-top: 30px; }
.result h1 { font-size: clamp(30px, 7vw, 46px); }
.bigstars { display: flex; justify-content: center; gap: 8px; margin: 22px 0; }
.bigstars svg { width: 76px; height: 76px; opacity: .2; transform: scale(.4); }
.bigstars svg.on { animation: starIn .5s forwards; }
.rewards { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 10px 0 24px; }
.reward { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 10px 16px; font-family: var(--f-display); font-size: 22px; display: flex; gap: 8px; align-items: center; }
.reward svg { width: 26px; height: 26px; }
.result .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.grade { font-family: var(--f-display); font-size: 92px; line-height: 1; color: var(--accent); }

/* arcade */
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.game { background: var(--card); border: 3px solid var(--ink); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column; text-align: left; padding: 0; }
.game .thumb { height: 120px; overflow: hidden; }
.game .thumb svg { height: 100%; width: 100%; }
.game .body { padding: 14px 16px 16px; display: grid; gap: 6px; }
.game h3 { font-size: 20px; }
.game p { margin: 0; font-size: 15px; color: var(--ink-soft); }
.game .meta { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; margin-top: 4px; }
.game.locked { filter: grayscale(1); opacity: .65; }
.ticketbar { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--gold); color: var(--gold-ink); border: 3px solid var(--ink); margin-bottom: 16px; }
.ticketbar svg { width: 40px; height: 40px; flex: none; }
.ticketbar b { font-family: var(--f-display); font-size: 22px; }
.ticketbar p { margin: 0; font-size: 14px; }

.game-stage { position: fixed; inset: 0; z-index: 50; background: #0B1020; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.game-bar { display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); color: #fff; }
.game-bar .ttl { font-family: var(--f-display); font-size: 18px; flex: 1; }
.game-bar .iconbtn { background: rgba(255, 255, 255, .1); border-color: rgba(255, 255, 255, .25); color: #fff; }
.game-area { flex: 1; position: relative; min-height: 0; }
.game-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; background: rgba(8, 12, 26, .72); color: #fff; text-align: center; overflow-y: auto; }
.overlay .box { max-width: 560px; width: 100%; }
.overlay h2 { font-size: clamp(26px, 6vw, 40px); }
.overlay p { color: #C8D3EE; }
.overlay .btn { border-color: #fff; box-shadow: 0 4px 0 #fff; }
.fq { text-align: left; background: #152039; border: 2px solid #2A3A60; border-radius: 18px; padding: 18px; }
.fq .question { color: #fff; font-size: clamp(19px, 4vw, 24px); }
.fq .opt { background: #1B2949; border-color: #33467A; box-shadow: 0 4px 0 #33467A; color: #fff; }
.fq .opt kbd { border-color: #33467A; color: #9DAED2; }
.fq .opt.right { background: #11392A; border-color: #34D08C; box-shadow: 0 4px 0 #34D08C; }
.fq .opt.wrong { background: #3D1A24; border-color: #FF5D70; box-shadow: 0 4px 0 #FF5D70; }
.fq .fact { margin-top: 12px; color: #C8D3EE; font-size: 15px; }

/* football blitz */
.blitz { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; max-width: 520px; margin: 0 auto; color: #fff; background: radial-gradient(ellipse at top, #1C4F8A, #0B1020 75%); }
.blitz .timer { background: rgba(255, 255, 255, .15); margin: 0; }
.blitz .timer i { background: #FFC21A; }
.blitz-score { text-align: center; color: #C8D3EE; font-size: 16px; }
.blitz-score b { font-family: var(--f-display); font-size: 26px; color: #fff; }
.blitz-card { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; background: #152039; border: 3px solid #33467A; border-radius: 22px; padding: 20px; text-align: center; touch-action: none; user-select: none; cursor: grab; transition: border-color .15s, background .15s; }
.blitz-q { color: #C8D3EE; font-size: clamp(17px, 4.2vw, 21px); }
.blitz-a { font-family: var(--f-display); font-size: clamp(24px, 7vw, 36px); color: #FFC21A; overflow-wrap: anywhere; }
.blitz-note { min-height: 1.4em; color: #fff; font-size: 16px; }
.blitz-card.right { border-color: #34D08C; background: #11392A; }
.blitz-card.wrong { border-color: #FF5D70; background: #3D1A24; }
.blitz-btns { display: flex; gap: 12px; }
.blitz-btns .btn { flex: 1; border-color: #fff; box-shadow: 0 4px 0 #fff; font-size: 19px; padding: 14px 10px; }
.blitz-no { background: #D7263D; color: #fff; }

/* knowledge scorer */
.scorer { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 18px; color: #fff; background: linear-gradient(#0B4D2C, #13804A); }
.scorer > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
.scorer .timer { background: rgba(255, 255, 255, .18); margin: 0 auto; }
.scorer .timer i { background: #FFC21A; }
.scorer-q { font-size: clamp(19px, 4.6vw, 24px); text-align: center; }
.scorer-q .type-lead { font-size: 15px; color: #CFE8DA; margin-bottom: 4px; }
.scorer-goals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sgoal { position: relative; min-height: 136px; padding: 8px 6px 56px; border: 5px solid #fff; border-bottom: 0; border-radius: 4px 4px 0 0; color: #fff; font-weight: 700; font-size: clamp(15px, 4.2vw, 18px); line-height: 1.25; display: flex; align-items: flex-start; justify-content: center; overflow-wrap: anywhere; hyphens: auto;
  background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .14) 0 1px, transparent 1px 12px), repeating-linear-gradient(90deg, rgba(255, 255, 255, .14) 0 1px, transparent 1px 12px), rgba(0, 0, 0, .18); transition: background-color .2s, transform .2s; }
.sgoal:not([disabled]):hover { background-color: rgba(255, 194, 26, .2); }
.sgoal-txt { position: relative; z-index: 1; }
.sgoal-keeper { position: absolute; left: 50%; bottom: 0; width: 26px; height: 34px; margin-left: -13px; border-radius: 8px 8px 3px 3px; background: #FFC21A; transition: transform .25s; }
.sgoal-keeper::before { content: ""; position: absolute; left: 6px; top: -14px; width: 14px; height: 14px; border-radius: 50%; background: #FFD6B0; }
.sgoal.goal { background-color: rgba(255, 194, 26, .35); transform: scale(1.04); }
.sgoal.saved .sgoal-keeper { transform: translateY(-6px) rotate(-14deg) scale(1.15); }
.sgoal.answer { outline: 4px dashed #34D08C; outline-offset: 3px; }
.sgoal[disabled] { cursor: default; opacity: 1; }
@media (max-width: 599px) {
  .scorer-goals.stack { grid-template-columns: 1fr; }
  .scorer-goals.stack .sgoal { min-height: 66px; padding: 10px 56px 10px 14px; border-bottom: 5px solid #fff; border-radius: 4px; align-items: center; justify-content: flex-start; text-align: left; }
  .scorer-goals.stack .sgoal-keeper { left: auto; right: 16px; bottom: 4px; margin-left: 0; width: 22px; height: 26px; }
  .scorer-goals.stack .sgoal-keeper::before { left: 5px; top: -12px; width: 12px; height: 12px; }
}
.scorer-pitch { height: 58px; display: grid; place-items: center; }
.sball { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #111 0 26%, #fff 28%); border: 2px solid #111; transition: transform .4s cubic-bezier(.2, .7, .3, 1), opacity .3s; }
.sball.gone { opacity: 0; }
.scorer-fact { min-height: 1.4em; text-align: center; color: #E5F3EA; font-size: 16px; }
.scorer-next { text-align: center; }
.scorer-next .btn { border-color: #fff; box-shadow: 0 4px 0 #fff; }
.scorer-dots { display: flex; gap: 8px; justify-content: center; }
.scorer-dots i { width: 14px; height: 14px; border-radius: 50%; background: rgba(255, 255, 255, .25); }
.scorer-dots i.hit { background: #34D08C; }
.scorer-dots i.miss { background: #FF5D70; }

/* badges */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.badge { background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 14px 10px; text-align: center; }
.badge .medal { width: 64px; height: 64px; margin: 0 auto 8px; }
.badge b { display: block; font-size: 15px; }
.badge span { display: block; font-size: 13px; color: var(--ink-soft); line-height: 1.3; }
.badge.off { opacity: .5; }
.badge.off .medal { filter: grayscale(1); }
.statgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { font-family: var(--f-display); font-size: 26px; display: block; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--ink-soft); }

/* cheat sheet */
.cheat { display: grid; gap: 14px; }
.cheat details { background: var(--card); border: 3px solid var(--ink); border-radius: 18px; overflow: hidden; }
.cheat summary { padding: 14px 18px; font-family: var(--f-display); font-size: 19px; cursor: pointer; list-style: none; display: flex; align-items: center; gap: 12px; }
.cheat summary::-webkit-details-marker { display: none; }
.cheat summary .sa { width: 40px; height: 40px; flex: none; color: var(--ink); }
.cheat summary::after { content: "+"; margin-left: auto; font-size: 26px; color: var(--accent); }
.cheat details[open] summary::after { content: "–"; }
.cheat .cbody { padding: 0 18px 18px; display: grid; gap: 14px; }
.cheat h4 { margin: 0 0 4px; font-size: 16px; color: var(--accent); }
.cheat p, .cheat li { font-size: 16px; }
.cheat p { margin: 0; }
.cheat ul, .cheat ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* toasts & modal */
.toasts { position: fixed; top: calc(70px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 70; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { background: var(--ink); color: var(--paper); border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; animation: toastIn .4s, toastOut .4s 3.2s forwards; box-shadow: 0 12px 30px -10px rgba(0, 0, 0, .5); }
.toast svg { width: 40px; height: 40px; flex: none; }
.toast b { display: block; }
.toast span { font-size: 14px; opacity: .8; }
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(8, 12, 26, .6); display: grid; place-items: center; padding: 20px; }
.modal .box { background: var(--card); border: 3px solid var(--ink); border-radius: 24px; padding: 26px; max-width: 440px; width: 100%; text-align: center; animation: pop .5s; }
.modal h2 { font-size: 28px; margin: 6px 0; }

.modal .thumb svg { width: 100%; height: 100%; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; width: 100%; height: 100%; }

@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
@keyframes starIn { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { opacity: 1; transform: scale(1.25) rotate(8deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-20px); } }
@keyframes fly0 { to { transform: translate(-120px, 160px) scale(.3); opacity: 0; } }
@keyframes fly1 { to { transform: translate(0, 170px) scale(.3); opacity: 0; } }
@keyframes fly2 { to { transform: translate(120px, 160px) scale(.3); opacity: 0; } }
@keyframes flick { 0%, 100% { transform: scaleY(1) skewX(0); } 25% { transform: scaleY(1.05) skewX(-2deg); } 50% { transform: scaleY(.96) skewX(1deg); } 75% { transform: scaleY(1.03) skewX(2deg); } }
.flicker { transform-origin: 50% 100%; transform-box: fill-box; animation: flick 1.2s ease-in-out infinite; }

@media (max-width: 640px) {
  body { font-size: 16px; }

}

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* Listen button of the optional speech module (core/modules/speech.js). */

/* Staff, xylophone and melodies of the optional music module (core/modules/music.js). */
.staff { display: block; width: 100%; height: auto; margin: 6px auto; overflow: visible; }

.staff .good { fill: var(--good); stroke: var(--good); }

.question .staff, .type-word .staff { max-height: 190px; }
/* Staves inside the reward games sit on a white card, the pitch behind them is dark. */
.scorer-q .staff { --ink: #1B1A33; --card: #FFFFFF; --pen: #2B2470; background: #FFFFFF; border-radius: 12px; max-width: 280px; max-height: 150px; margin: 8px auto 0; }

.xylo { display: flex; align-items: center; gap: 5px; height: 150px; padding: 10px 8px; margin: 10px 0 6px; border-radius: 16px; background: linear-gradient(transparent 32%, #6B4A2B 32%, #6B4A2B 38%, transparent 38%, transparent 62%, #6B4A2B 62%, #6B4A2B 68%, transparent 68%); }
.xbar { flex: 1; height: var(--h); min-width: 0; border: 2px solid #8A5A2B; border-radius: 8px; background: linear-gradient(90deg, #E9C38C, #F6DDB0 45%, #DDAE6F); box-shadow: 0 3px 0 #9A6A35; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 8px; font-family: var(--f-display); font-size: 15px; color: #4A2F14; touch-action: manipulation; }

@keyframes xhit { 50% { transform: translateY(4px) scale(.97); filter: brightness(1.15); } }
.xy-picked { display: flex; flex-wrap: wrap; gap: 6px; min-height: 36px; justify-content: center; }
.xy-picked span { min-width: 36px; height: 34px; padding: 0 6px; border-radius: 10px; border: 2px dashed var(--line); display: grid; place-items: center; font-weight: 700; color: var(--ink-soft); }
.xy-picked span.on { border-style: solid; border-color: var(--accent); color: var(--ink); background: var(--accent-soft); }
.xy-picked span.right { border-color: var(--good); background: var(--good-soft); }

.xy-listen, .xy-tools { display: flex; justify-content: center; gap: 8px; margin: 6px 0; }

.melody-card .staff { margin: 2px auto; }
.melody-card .mc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font: 700 15px/1.3 var(--f-body); color: var(--ink); text-align: left; }
.melody-card .mc-head .btn { font: 700 13px var(--f-body); }

/* cloud.js: an app the parents locked. */
.cloud-lock { position: fixed; inset: 0; z-index: 90; background: color-mix(in srgb, var(--paper) 94%, transparent); display: grid; place-items: center; padding: 20px; }
.cloud-lock-box { max-width: 420px; padding: 26px; border-radius: 24px; background: var(--card); border: 3px solid var(--ink); text-align: center; display: grid; gap: 10px; justify-items: center; }
.cloud-lock-box > svg { width: 56px; height: 56px; color: var(--ink-soft); }

/* Parents' dashboard. Builds on core/core.css (tokens, graph paper, buttons, modal). */
.app.dash { padding-block: 0 60px; }
.dash-head { margin-top: 28px; padding: 20px 22px 18px 26px; border-radius: 18px; background: var(--card); border: 3px solid var(--ink); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.dash-head::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 10px; background: var(--stripe); }

.dash-head h1 { font-size: clamp(28px, 6.4vw, 42px); margin-top: 4px; }

.dash-kids { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.dash-kid { display: grid; padding: 8px 16px; border-radius: 14px; border: 3px solid var(--ink); background: var(--card); color: var(--ink); font: inherit; font-size: 18px; font-weight: 700; text-align: left; }

.dash-kid.add { border-style: dashed; color: var(--ink-soft); align-content: center; }

.dash-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 18px; }

.dash-tile small { font-size: 13px; color: var(--ink-soft); }
.dash-tile.play { background: var(--good-soft); border-color: var(--ink); }

.dash-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dash-card { margin-top: 18px; padding: 18px; border-radius: 18px; background: var(--card); border: 3px solid var(--ink); box-shadow: var(--shadow); min-width: 0; }
.dash-card h2 { font-size: 24px; }
.dash-card h3 { font-size: 18px; margin-top: 16px; }
.dash-cardhead { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.dash-daypick { display: flex; gap: 6px; align-items: center; }

.dash-daypick .iconbtn { font-size: 22px; color: var(--ink); }
.dash-daypick .iconbtn[disabled] { opacity: .35; }
.dash-muted { color: var(--ink-soft); margin: 6px 0 0; }
.dash-err { color: var(--bad); font-weight: 700; }
.dash-sum { font-weight: 700; margin: 10px 0 0; }

.dash-day { margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--line); }
.dash-day h3 { margin: 0; }

<div class="app dash" id="dash"></div><div class="toasts" id="toasts" aria-live="polite"></div>
<script>
// Small helpers shared by the engine, the games and every app.

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => s.toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss');
const sleep = ms => new Promise(r => setTimeout(r, ms));

function svg(inner, vb = '0 0 100 100') {
  return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
}

// Dates are plain 'YYYY-MM-DD' strings in local time.
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayStr = () => isoDate(new Date());
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function daysUntil(s) { const now = new Date(); now.setHours(0, 0, 0, 0); return Math.round((parseDate(s) - now) / 864e5); }
const WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
const weekdayOf = s => WEEKDAYS[parseDate(s).getDay()];
function shortDate(s) { const d = parseDate(s); return `${d.getDate()}.${d.getMonth() + 1}.`; }
// A period after a solution, unless it already ends with a punctuation mark.
const endDot = t => /[.!?…]$/.test(String(t).replace(/<[^>]*>/g, '').trim()) ? '' : '.';


// Inline SVG icons for the shared UI. Colors come from the theme tokens in core.css.

const ICON = {
  star: (on = true) => `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? 'var(--gold)' : 'var(--line)'}" stroke="${on ? 'var(--gold-ink)' : 'var(--ink-soft)'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  ticket: `<svg viewBox="0 0 24 24"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z" fill="var(--gold)" stroke="var(--gold-ink)" stroke-width="1.5" stroke-linejoin="round"/><path d="M14 7v10" stroke="var(--gold-ink)" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`,
  fire: `<svg viewBox="0 0 24 24"><path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-7 1 2 1 3 3 4 0-3-1-5 0-8z" fill="#FF8A3D" stroke="#B4471A" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  heart: (on = true) => `<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="${on ? 'var(--bad)' : 'var(--line)'}"/></svg>`,
  close: `<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>`,
  soundOn: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  soundOff: `<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
  play: `<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>`,
  pause: `<svg viewBox="0 0 24 24"><path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z" fill="currentColor"/></svg>`,
  map: `<svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z M9 4v14 M15 6v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,

// Feedback effects: WebAudio sounds (no files), confetti, toasts and modals.

const Sound = {
  ctx: null,
  ensure() {
    if (!state.sound) return null;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) { return null; }
    return this.ctx;
  },
  tone(f, d = .12, type = 'sine', vol = .12, when = 0, slide = 0) {
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .02);
  },
  right() { this.tone(660, .09, 'triangle', .14); this.tone(990, .16, 'triangle', .14, .08); },
  wrong() { this.tone(200, .28, 'sawtooth', .07, 0, 120); },
  click() { this.tone(520, .04, 'square', .04); },
  coin() { this.tone(988, .07, 'square', .06); this.tone(1319, .18, 'square', .06, .07); },
  fanfare() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .22, 'triangle', .13, i * .11)); this.tone(1047, .5, 'triangle', .1, .5); },
  whistle() { this.tone(2100, .12, 'sine', .08); this.tone(2100, .35, 'sine', .08, .16); },
  kick() { this.tone(140, .12, 'sine', .25, 0, 50); },
  // Looping filtered noise, e.g. for a roaring flame or a crowd.
  noiseNode: null,
  setRoar(level) {
    const c = this.ensure();
    if (!c) return;
    if (!this.noiseNode) {
      const buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
      const filt = c.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = 900; filt.Q.value = .6;
      const g = c.createGain(); g.gain.value = 0;
      src.connect(filt); filt.connect(g); g.connect(c.destination); src.start();
      this.noiseNode = { src, g };
    }
    this.noiseNode.g.gain.setTargetAtTime(level, c.currentTime, .08);
  },
  stopRoar() { if (this.noiseNode) { try { this.noiseNode.src.stop(); } catch (e) { } this.noiseNode = null; } },
};

const Confetti = {
  parts: [], running: false,
  burst(n = 120, x = .5, y = .35) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const cv = $('#confetti'); const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const cols = ['#2257E6', '#FFC21A', '#D7263D', '#12995A', '#8FE3FF', '#FF8A3D'];
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 4 + Math.random() * 9;
      this.parts.push({ x: x * W, y: y * H, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 6, r: 4 + Math.random() * 6, c: pick(cols), rot: Math.random() * 6, vr: Math.random() * .4 - .2, life: 120 + Math.random() * 60 });
    }
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.tick()); }
  },
  tick() {
    const cv = $('#confetti'), g = cv.getContext('2d');
    g.clearRect(0, 0, cv.width, cv.height);
    this.parts = this.parts.filter(p => p.life > 0 && p.y < cv.height + 20);
    for (const p of this.parts) {
      p.vy += .25; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillStyle = p.c; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore();
    }
    if (this.parts.length) requestAnimationFrame(() => this.tick()); else { this.running = false; g.clearRect(0, 0, cv.width, cv.height); }
  },
};

function toast(title, text, iconHtml) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `${iconHtml || ICON.medal('var(--gold)', 'var(--gold-ink)')}<div><b>${title}</b><span>${text}</span></div>`;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3700);
}

const modalQueue = [];
function modal(html, buttons = [{ label: 'Weiter', cls: 'primary' }]) {
  return new Promise(resolve => {
    modalQueue.push({ html, buttons, resolve });
    if (modalQueue.length === 1) showNextModal();
  });
}
function showNextModal() {
  const m = modalQueue[0]; if (!m) return;
  const el = document.createElement('div');
  el.className = 'modal';
  el.innerHTML = `<div class="box" role="dialog" aria-modal="true">${m.html}<div class="actions" style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">${m.buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-i="${i}">${b.label}</button>`).join('')}</div></div>`;
  document.body.appendChild(el);
  $('button', el).focus();
  el.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]'); if (!b) return;
    el.remove(); modalQueue.shift(); m.resolve(+b.dataset.i); showNextModal();
  });
}

const state = { sound: false };   // fx.js reads this

async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch(ROOT + 'api/parent/' + path, {
      method: opts.method || 'GET', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-KLA': '1' },
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
  } catch (e) { throw Object.assign(new Error('Keine Verbindung zum Server.'), { status: 0 }); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    const d = data.detail;
    throw Object.assign(new Error(Array.isArray(d) ? 'Bitte die Eingaben prüfen.' : d || 'Da ist etwas schiefgegangen.'), { status: r.status });
  }
  return data;
}
// Runs a change, reports errors as a toast and reloads the view on success.
async function act(fn, done) {
  try { const r = await fn(); if (done) toast(done, ''); await load(); return r; }
  catch (e) { if (e.status === 401) return signedOutView(); toast('Hat nicht geklappt', e.message); }
}

const mins = sec => { const m = Math.round((sec || 0) / 60); return m < 60 ? `${m} Min` : `${Math.floor(m / 60)} Std ${String(m % 60).padStart(2, '0')} Min`; };
const time = ts => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const when = ts => {
  if (!ts) return 'nie';
  const d = new Date(ts), days = Math.round((new Date().setHours(0, 0, 0, 0) - new Date(d).setHours(0, 0, 0, 0)) / 864e5);
  return `${days === 0 ? 'heute' : days === 1 ? 'gestern' : d.toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' })}, ${time(ts)}`;
};
const stars = n => '★'.repeat(n) + '☆'.repeat(Math.max(0, 3 - n));
const appTitle = id => (CATALOG[id] || {}).title || id;
// Upcoming exams first (soonest on top), then apps without a date, then past exams.
function appOrder(a, b) {
  const key = x => { const d = x.exam && x.exam.date ? daysUntil(x.exam.date) : 9999; return d < 0 ? 10000 - d : d; };
  return key(a) - key(b);
}

// A small form in a dialog; resolves with the field values or null.
function ask(title, text, fields, okLabel = 'Speichern') {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal';
    el.innerHTML = `<form class="box dash-ask" role="dialog" aria-modal="true"><h2>${title}</h2>${text ? `<p>${text}</p>` : ''}
      ${fields.map(f => `<label>${f.label}${f.options
        ? `<select name="${f.name}">${f.options.map(o => `<option${o === f.value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
        : `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.attrs || ''}>`}</label>`).join('')}
      <div class="actions"><button class="btn primary" type="submit">${okLabel}</button><button class="btn" type="button" data-cancel>Abbrechen</button></div></form>`;
    document.body.appendChild(el);
    const form = $('form', el);
    (form.elements[0] || form).focus();
    $('[data-cancel]', el).onclick = () => { el.remove(); resolve(null); };
    form.onsubmit = e => {
      e.preventDefault();
      const v = Object.fromEntries(fields.map(f => [f.name, form.elements[f.name].value.trim()]));
      el.remove(); resolve(v);
    };
  });
}
const confirmIt = async (html, label = 'Ja, weiter') => (await modal(html, [{ label, cls: 'warn' }, { label: 'Abbrechen' }])) === 0;

// ----- views ---------------------------------------------------------------------------
const root = () => $('#dash');

function signedOutView() {
  root().innerHTML = `<header class="dash-head"><div class="eyebrow">Lernapps</div><h1>Eltern-<em>Dashboard</em></h1></header>
    <section class="dash-card"><p>Das Dashboard ist nur für Eltern. Melde dich zuerst auf der Familienseite an und öffne diese Seite danach noch einmal.</p>
    <div class="dash-row"><a class="btn primary" href="/">Zur Familienseite</a><button class="btn" id="again">Nochmal prüfen</button></div></section>`;
  $('#again').onclick = () => load();
}

async function load() {
  let data;
  try { data = await api('overview'); }
  catch (e) {
    if (e.status === 401) return signedOutView();
    root().innerHTML = `<section class="dash-card"><p class="dash-err">${esc(e.message)}</p><button class="btn" onclick="load()">Nochmal versuchen</button></section>`;
    return;
  }
  ui.data = data;
  if (!data.children.some(c => c.id === ui.childId)) ui.childId = data.children.length ? data.children[0].id : null;
  render();
}

function render() {
  const { data } = ui, child = data.children.find(c => c.id === ui.childId);
  root().innerHTML = `
    <header class="dash-head"><div class="eyebrow">Lernapps · angemeldet als ${esc(data.parent)}</div><h1>Eltern-<em>Dashboard</em></h1></header>
    <nav class="dash-kids">${data.children.map(c => `<button class="dash-kid" data-id="${c.id}" aria-current="${c.id === ui.childId}">${esc(c.name)}<small>${esc(c.school)}</small></button>`).join('')}
      <button class="dash-kid add" id="addChild">+ Kind</button></nav>
    ${child ? childView(child) : '<section class="dash-card"><p>Noch kein Kind angelegt. Leg die Kinder mit Namen, Schulart und persönlichem Code an, dann können sie sich auf der Startseite anmelden.</p></section>'}`;
  $$('.dash-kid[data-id]').forEach(b => b.onclick = () => { ui.childId = +b.dataset.id; ui.day = todayStr(); render(); });
  $('#addChild').onclick = addChild;
  if (child) wireChild(child);
}

function childView(c) {
  const p = c.playtime;
  return `
    <section class="dash-tiles">
      <div class="dash-tile"><span>Heute gelernt</span><b>${mins(c.activity.learn)}</b></div>
      <div class="dash-tile"><span>Heute gespielt</span><b>${mins(c.activity.game)}</b>${c.gameLimit != null ? `<small>Grenze ${c.gameLimit} Min</small>` : ''}</div>
      <div class="dash-tile play"><span>Zockzeit-Konto</span><b>${p.balance} Min</b><small>heute verdient ${p.earnedToday} von ${p.cap}</small></div>
    </section>
    <div class="dash-row"><button class="btn warn" id="redeem">Zockzeit einlösen</button><button class="btn" id="grant">Minuten schenken</button></div>

    <section class="dash-card">
      <div class="dash-cardhead"><h2>Tag</h2>
        <div class="dash-daypick"><button class="iconbtn" id="dayPrev" aria-label="Tag davor">‹</button><input type="date" id="day" value="${ui.day}" max="${todayStr()}"><button class="iconbtn" id="dayNext" aria-label="Tag danach" ${ui.day >= todayStr() ? 'disabled' : ''}>›</button></div></div>
      <div id="dayView"><p class="dash-muted">Lade …</p></div>
    </section>

    <section class="dash-card">
      <h2>Apps</h2>
      <div class="dash-apps">${c.apps.length ? c.apps.slice().sort(appOrder).map(a => appRow(c, a)).join('') :'<p class="dash-muted">Für diese Schulart gibt es noch keine App.</p>'}</div>
    </section>

    <section class="dash-card">
      <h2>Zockzeit-Verlauf</h2>
      <div id="ptLog"><p class="dash-muted">Lade …</p></div>
    </section>

    <section class="dash-card">
      <h2>Einstellungen für ${esc(c.name)}</h2>
      <dl class="dash-settings">
        <dt>Name und Schulart</dt><dd>${esc(c.name)}, ${esc(c.school)} <button class="linkbtn" data-set="name">ändern</button></dd>
        <dt>Code</dt><dd>${c.requireCode ? 'wird beim Profilwechsel abgefragt' : 'nur bei der ersten Anmeldung auf einem Gerät'} <button class="linkbtn" data-set="code">neuer Code</button> <button class="linkbtn" data-set="require">${c.requireCode ? 'nicht mehr abfragen' : 'beim Wechsel abfragen'}</button></dd>
        <dt>Zockzeit</dt><dd>${c.playtimePerStar} Min pro neuem Stern, höchstens ${c.playtimeCap} Min am Tag <button class="linkbtn" data-set="playtime">ändern</button></dd>
        <dt>Spiele in den Apps</dt><dd>${c.gameLimit == null ? 'ohne Grenze' : `höchstens ${c.gameLimit} Min am Tag`} <button class="linkbtn" data-set="games">ändern</button></dd>
      </dl>
      <h3>Angemeldete Geräte</h3>
      <div id="devices"><p class="dash-muted">Lade …</p></div>
      <div class="dash-row"><button class="btn small" id="delChild">${esc(c.name)} löschen</button></div>
    </section>`;
}

function appRow(c, a) {
  const cat = CATALOG[a.id] || {};
  const today = a.learnSecToday || a.gameSecToday ? `heute ${mins(a.learnSecToday)} gelernt${a.gameSecToday ? `, ${mins(a.gameSecToday)} gespielt` : ''}` : 'heute nicht geöffnet';
  return `<div class="dash-app" data-app="${a.id}">
    <div class="dash-app-top"><div class="dash-app-icon">${cat.icon || ''}</div>
      <div><b>${esc(a.title)}</b><small>${esc(a.subject || '')}${a.exam && a.exam.date ? ` · ${esc(a.exam.kind)} am ${shortDate(a.exam.date)}` : ''}</small>
      <small>${a.stars} Sterne · ${a.xp} XP${a.examBest ? ` · Probe-Note ${esc(a.examBest)}` : ''}${a.mistakes ? ` · ${a.mistakes} in der Fehlerkiste` : ''}</small>
      <small>${today} · zuletzt gespeichert ${when(a.updatedAt)}</small></div></div>
    <div class="dash-toggles">
      <label class="dash-switch"><input type="checkbox" data-toggle="earnsPlaytime" ${a.earnsPlaytime ? 'checked' : ''}><span>Zockzeit sammeln</span></label>
      <label class="dash-switch"><input type="checkbox" data-toggle="locked" ${a.locked ? 'checked' : ''}><span>Gesperrt</span></label>
    </div>
    <div class="dash-row small">
      <button class="btn small" data-op="tickets">Tickets schenken</button>
      <button class="btn small" data-op="goal">Tagesziel${a.dailyGoal ? ` (${a.dailyGoal} XP)` : ''}</button>
      <button class="btn small" data-op="reset">Zurücksetzen</button>
      <button class="btn small" data-op="log">Protokoll löschen</button>
    </div></div>`;
}

function wireChild(c) {
  const base = `children/${c.id}`;
  $('#redeem').onclick = async () => {
    const v = await ask('Zockzeit einlösen', `${esc(c.name)} hat ${c.playtime.balance} Minuten auf dem Konto.`, [
      { name: 'minutes', label: 'Minuten', type: 'number', value: Math.min(30, c.playtime.balance), attrs: 'min="1" max="600" required' },
      { name: 'note', label: 'Wofür (frei)', value: '', attrs: 'maxlength="120" placeholder="z. B. Switch"' }], 'Einlösen');
    if (v) act(() => api(`${base}/playtime`, { method: 'POST', body: { minutes: -Math.abs(+v.minutes), note: v.note } }), `${v.minutes} Minuten eingelöst`);
  };
  $('#grant').onclick = async () => {
    const v = await ask('Minuten schenken', 'Die Minuten kommen direkt aufs Konto und zählen nicht zur Tagesgrenze.', [
      { name: 'minutes', label: 'Minuten', type: 'number', value: 10, attrs: 'min="1" max="600" required' },
      { name: 'note', label: 'Anlass (frei)', value: '', attrs: 'maxlength="120"' }], 'Schenken');
    if (v) act(() => api(`${base}/playtime`, { method: 'POST', body: { minutes: Math.abs(+v.minutes), note: v.note } }), `${v.minutes} Minuten geschenkt`);
  };
  const go = d => { ui.day = d; render(); };
  const shift = n => { const d = parseDate(ui.day); d.setDate(d.getDate() + n); return isoDate(d); };
  $('#day').onchange = e => e.target.value && go(e.target.value);
  $('#dayPrev').onclick = () => go(shift(-1));
  $('#dayNext').onclick = () => go(shift(1));
  loadDay(c);
  loadPlaytime(c);
  loadDevices(c);

  $$('.dash-app').forEach(row => {
    const app = row.dataset.app, a = c.apps.find(x => x.id === app), url = `${base}/apps/${app}`;
    $$('[data-toggle]', row).forEach(t => t.onchange = () => act(() => api(url, { method: 'PATCH', body: { [t.dataset.toggle]: t.checked } })));
    $('[data-op=tickets]', row).onclick = async () => {
      const v = await ask('Tickets schenken', `Spiel-Tickets für ${esc(a.title)}. Sie kommen an, sobald die App das nächste Mal online ist.`,
        [{ name: 'n', label: 'Anzahl', type: 'number', value: 1, attrs: 'min="1" max="20" required' }], 'Schenken');
      if (v) act(() => api(`${url}/tickets`, { method: 'POST', body: { n: +v.n } }), `${v.n} Ticket${+v.n === 1 ? '' : 's'} unterwegs`);
    };
    $('[data-op=goal]', row).onclick = async () => {
      const v = await ask('Tagesziel', 'XP pro Tag, bis der Tagesring voll ist. Leer lassen für den Standard der App.',
        [{ name: 'goal', label: 'XP am Tag', type: 'number', value: a.dailyGoal || '', attrs: 'min="10" max="5000"' }]);
      if (v) act(() => api(url, { method: 'PATCH', body: v.goal ? { dailyGoal: +v.goal } : { clearDailyGoal: true } }), 'Tagesziel gespeichert');
    };
    $('[data-op=reset]', row).onclick = async () => {
      if (await confirmIt(`<h2>Zurücksetzen?</h2><p>Der ganze Fortschritt von ${esc(c.name)} in ${esc(a.title)} wird gelöscht, auch auf allen Geräten. Das Protokoll und die Zockzeit bleiben, und Sterne, die schon einmal Minuten gebracht haben, bringen kein zweites Mal.</p>`, 'Zurücksetzen'))
        act(() => api(`${url}/reset`, { method: 'POST' }), 'Zurückgesetzt');
    };
    $('[data-op=log]', row).onclick = async () => {
      if (await confirmIt(`<h2>Protokoll löschen?</h2><p>Alle Tageseinträge von ${esc(c.name)} in ${esc(a.title)} werden endgültig gelöscht. Der Fortschritt in der App bleibt.</p>`, 'Löschen'))
        act(async () => { const r = await api(`${url}/events`, { method: 'DELETE' }); toast(`${r.deleted} Einträge gelöscht`, ''); });
    };
  });

  $$('[data-set]').forEach(b => b.onclick = async () => {
    const k = b.dataset.set;
    let body = null;
    if (k === 'name') {
      const v = await ask('Name und Schulart', 'Die Schulart bestimmt, welche Apps das Kind sieht.', [
        { name: 'name', label: 'Name', value: c.name, attrs: 'maxlength="40" required' },
        { name: 'school', label: 'Schulart', value: c.school, options: SCHOOLS }]);
      if (v) body = v;
    } else if (k === 'code') {
      const v = await ask('Neuer Code', 'Mindestens 4 Buchstaben oder Ziffern, Groß- und Kleinschreibung und Leerzeichen zählen nicht. Angemeldete Geräte bleiben angemeldet.', [
        { name: 'code', label: 'Code', value: '', attrs: 'minlength="4" maxlength="40" required autocomplete="off"' }]);
      if (v) body = v;
    } else if (k === 'require') body = { requireCode: !c.requireCode };
    else if (k === 'playtime') {
      const v = await ask('Zockzeit', 'Minuten gibt es nur in Apps mit „Zockzeit sammeln“, für jeden Stern, der zum ersten Mal erreicht wird, und für eine Probearbeit mit Note 1 oder 2 einmal am Tag 5 Minuten.', [
        { name: 'per', label: 'Minuten pro neuem Stern', type: 'number', value: c.playtimePerStar, attrs: 'min="0" max="10" required' },
        { name: 'cap', label: 'Höchstens Minuten am Tag', type: 'number', value: c.playtimeCap, attrs: 'min="0" max="600" required' }]);
      if (v) body = { playtimePerStar: +v.per, playtimeCap: +v.cap };
    } else if (k === 'games') {
      const v = await ask('Spiele in den Apps', 'Wie lange am Tag die Belohnungsspiele in allen Apps zusammen laufen dürfen. Leer lassen für keine Grenze.', [
        { name: 'limit', label: 'Minuten am Tag', type: 'number', value: c.gameLimit ?? '', attrs: 'min="0" max="600"' }]);
      if (v) body = v.limit === '' ? { clearGameLimit: true } : { gameLimit: +v.limit };
    }
    if (body) act(() => api(base, { method: 'PATCH', body }), 'Gespeichert');
  });

  $('#delChild').onclick = async () => {
    if (await confirmIt(`<h2>${esc(c.name)} löschen?</h2><p>Das Kind wird mit allen Geräten, dem Fortschritt in allen Apps, dem Protokoll und dem Zockzeit-Konto endgültig gelöscht.</p>`, 'Endgültig löschen'))
      act(() => api(base, { method: 'DELETE' }), `${c.name} gelöscht`);
  };
}

// The day: active time per app, then per app the levels (summarised), mock tests and games.
async function loadDay(c) {
  const box = $('#dayView');
  let d;
  try { d = await api(`children/${c.id}/day?date=${ui.day}`); } catch (e) { box.innerHTML = `<p class="dash-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  const apps = [...new Set([...Object.keys(d.active), ...d.timeline.map(e => e.app)])];
  const pt = d.playtime.filter(p => p.reason !== 'parent').reduce((s, p) => s + p.minutes, 0);
  if (!apps.length) { box.innerHTML = `<p class="dash-muted">${ui.day === todayStr() ? 'Heute' : 'An diesem Tag'} hat ${esc(c.name)} keine Lernapp benutzt.</p>`; return; }
  const total = Object.values(d.active).reduce((s, a) => ({ learn: s.learn + a.learn, game: s.game + a.game }), { learn: 0, game: 0 });
  box.innerHTML = `<p class="dash-sum">${mins(total.learn)} gelernt, ${mins(total.game)} gespielt${pt ? `, ${pt} Min Zockzeit verdient` : ''}.</p>` +
    apps.map(app => dayApp(app, d.active[app] || { learn: 0, game: 0 }, d.timeline.filter(e => e.app === app), d.playtime.filter(p => p.app_id === app))).join('');
}

function dayApp(app, act, evs, play) {
  const levels = new Map(), exams = [], games = new Map(), other = [];
  for (const e of evs) {
    const x = e.data || {};
    if (e.kind === 'level') {
      const key = `${x.world || ''}|${x.title}|${x.type}`;
      const g = levels.get(key) || { ...x, first: e.ts, runs: 0, best: 0, wrong: new Set(), last: x };
      g.runs++; g.best = Math.max(g.best, x.stars || 0); g.last = x; (x.wrong || []).forEach(w => g.wrong.add(w));
      g.isNew = g.isNew || (x.stars || 0) > (x.prev ?? 3);
      levels.set(key, g);
    } else if (e.kind === 'exam') exams.push(e);
    else if (e.kind === 'game') { const g = games.get(x.name) || { sec: 0, n: 0 }; g.sec += x.sec || 0; g.n++; games.set(x.name, g); }
    else other.push(e);
  }
  const wrongList = w => w.length ? `<details><summary>${w.length} falsch</summary><ul>${w.map(t => `<li>${esc(t)}</li>`).join('')}</ul></details>` : '';
  const earned = play.reduce((s, p) => s + p.minutes, 0);
  return `<div class="dash-day">
    <h3>${esc(appTitle(app))}</h3>
    <p class="dash-muted">${mins(act.learn)} gelernt${act.game ? `, ${mins(act.game)} gespielt` : ''}${earned ? `, ${earned} Min Zockzeit verdient` : ''}</p>
    <ul class="dash-tl">
      ${[...levels.values()].map(g => `<li><time>${time(g.first)}</time><div><b>${esc(g.title)}</b>${g.world && g.world !== g.title ? ` <small>${esc(g.world)}</small>` : ''}
        <span class="dash-stars" title="beste Sterne">${g.type === 'level' || g.world ? stars(g.best) : ''}</span>${g.isNew ? '<span class="dash-new">neu</span>' : ''}
        <small>${g.runs}× gespielt, zuletzt ${g.last.right ?? '?'} von ${g.last.total ?? '?'} richtig</small>${wrongList([...g.wrong])}</div></li>`).join('')}
      ${exams.map(e => `<li><time>${time(e.ts)}</time><div><b>Probearbeit: Note ${esc(e.data.grade)}</b> <small>${e.data.pts ?? ''}${e.data.max ? ` von ${e.data.max} Punkten` : ''}${e.data.pct != null ? `, ${e.data.pct} %` : ''}</small>${wrongList(e.data.wrong || [])}</div></li>`).join('')}
      ${games.size ? `<li><time>Spiele</time><div>${[...games.entries()].map(([n, g]) => `${esc(n)} ${mins(g.sec)}${g.n > 1 ? ` (${g.n}×)` : ''}`).join(', ')}</div></li>` : ''}
      ${other.map(e => `<li><time>${time(e.ts)}</time><div>${esc(e.kind)}: ${esc(JSON.stringify(e.data).slice(0, 120))}</div></li>`).join('')}
    </ul></div>`;
}

async function loadPlaytime(c) {
  const box = $('#ptLog');
  let rows;
  try { rows = await api(`children/${c.id}/playtime?limit=30`); } catch (e) { box.innerHTML = `<p class="dash-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  const why = r => r.reason === 'stars' ? `neue Sterne in ${esc(appTitle(r.app_id))}` : r.reason === 'exam' ? `Probearbeit in ${esc(appTitle(r.app_id))}` : r.minutes < 0 ? `eingelöst von ${esc(r.by_parent || '?')}` : `geschenkt von ${esc(r.by_parent || '?')}`;
  box.innerHTML = rows.length
    ? `<ul class="dash-pt">${rows.map(r => `<li><span class="${r.minutes < 0 ? 'neg' : 'pos'}">${r.minutes > 0 ? '+' : ''}${r.minutes} Min</span><span>${why(r)}${r.note ? ` · ${esc(r.note)}` : ''}</span><time>${when(r.ts)}</time></li>`).join('')}</ul>`
    : '<p class="dash-muted">Noch keine Zockzeit verdient oder eingelöst.</p>';
}

async function loadDevices(c) {
  const box = $('#devices');
  let rows;
  try { rows = await api(`children/${c.id}/devices`); } catch (e) { box.innerHTML = `<p class="dash-err">${esc(e.message)}</p>`; return; }
  if (!box.isConnected) return;
  box.innerHTML = rows.length
    ? `<ul class="dash-devices">${rows.map(d => `<li><span><b>${esc(d.label || 'Gerät')}</b><small>angemeldet ${when(d.createdAt)}, zuletzt aktiv ${when(d.lastSeenAt)}</small></span><button class="btn small" data-dev="${d.id}">Abmelden</button></li>`).join('')}</ul>`
    : '<p class="dash-muted">Auf keinem Gerät angemeldet.</p>';
  $$('[data-dev]', box).forEach(b => b.onclick = async () => {
    if (await confirmIt(`<h2>Gerät abmelden?</h2><p>${esc(c.name)} braucht auf diesem Gerät danach wieder den Code. Der Fortschritt bleibt erhalten.</p>`, 'Abmelden'))
      act(() => api(`devices/${b.dataset.dev}`, { method: 'DELETE' }), 'Gerät abgemeldet');
  });
}

async function addChild() {
  const v = await ask('Kind anlegen', 'Mit dem Code meldet sich das Kind einmal pro Gerät auf der Startseite an. Jedes Kind braucht einen eigenen Code.', [
    { name: 'name', label: 'Name', value: '', attrs: 'maxlength="40" required' },
    { name: 'school', label: 'Schulart', value: SCHOOLS[0], options: SCHOOLS },
    { name: 'code', label: 'Persönlicher Code', value: '', attrs: 'minlength="4" maxlength="40" required autocomplete="off"' }], 'Anlegen');
  if (!v) return;
  const r = await act(() => api('children', { method: 'POST', body: v }), `${v.name} angelegt`);
  if (r) { ui.childId = r.id; render(); }
}

load();
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('.modal')) load(); });

</script>
